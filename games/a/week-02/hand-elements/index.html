<!DOCTYPE html>
<html lang="ko">
<head><script src="../../../../runtime/ml5-support.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>손바닥 원소 · Hand Elements</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #eaf2ff;
      --muted: #8fa0b8;
      --line: rgba(150, 180, 220, 0.16);
      --fire: #ff9a3c;
      --water: #55b8ff;
      --bolt: #ffe066;
      --ice: #a9dcff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3.5vh, 40px) clamp(14px, 4vw, 32px);
      background:
        radial-gradient(900px 620px at 16% -12%, #142440 0%, transparent 62%),
        radial-gradient(760px 560px at 90% 112%, #2b1531 0%, transparent 60%),
        #05070b;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Pretendard", "Segoe UI", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: min(640px, 100%);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2.2vh, 20px);
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px 18px;
      flex-wrap: wrap;
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #7e93b4;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 3.4vw, 31px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      background: linear-gradient(100deg, #ffffff 10%, #a8d4ff 48%, #ffcf9b 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      margin: 0;
      max-width: 300px;
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--muted);
      text-align: right;
      word-break: keep-all;
    }

    .stage {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #070b12;
      box-shadow:
        0 0 0 1px var(--line),
        0 30px 90px -36px rgba(90, 160, 255, 0.55),
        0 10px 40px -20px rgba(0, 0, 0, 0.9);
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #070b12;
    }

    .frame canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.025);
      line-height: 1.2;
      white-space: nowrap;
    }

    .chip b {
      color: var(--ink);
      font-weight: 600;
    }

    .dot {
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 9px currentColor;
    }

    .dot.fire { color: var(--fire); }
    .dot.water { color: var(--water); }
    .dot.bolt { color: var(--bolt); }
    .dot.ice { color: var(--ice); }

    .chip.action {
      border-color: rgba(150, 180, 220, 0.22);
      background: rgba(150, 180, 220, 0.05);
    }

    /* 로딩 / 오류 오버레이 */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      padding: 26px;
      text-align: center;
      background: rgba(5, 9, 16, 0.78);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(160, 200, 255, 0.18);
      border-top-color: #9ccdff;
      border-right-color: #ffc98f;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(1turn); } }

    .overlay .title {
      margin: 2px 0 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .overlay .sub {
      margin: 0;
      max-width: 330px;
      font-size: 12px;
      line-height: 1.65;
      color: var(--muted);
      white-space: pre-line;
      word-break: keep-all;
    }

    .overlay button {
      margin-top: 6px;
      padding: 9px 18px;
      border: 1px solid rgba(170, 205, 255, 0.32);
      border-radius: 999px;
      background: rgba(140, 190, 255, 0.12);
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .overlay button:hover { background: rgba(140, 190, 255, 0.22); }

    .overlay button[hidden] { display: none; }

    .hint {
      margin: -4px 0 0;
      text-align: center;
      font-size: 11px;
      color: #637389;
    }

    @media (max-width: 560px) {
      .hero p { display: none; }
      .chip { font-size: 11px; padding: 5px 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Realtime · ml5 Hand Pose</p>
        <h1>손바닥 원소</h1>
      </div>
      <p>엄지에 손가락 끝을 맞대 원소를 소환하고,<br />손바닥을 펼쳐 발사하세요.</p>
    </header>

    <section class="stage" aria-label="웹캠 손 인식 아트">
      <div class="frame" id="frame">
        <div class="overlay" id="overlay">
          <div class="spinner" aria-hidden="true"></div>
          <p class="title" id="overlayTitle">손 인식 모델을 준비하는 중…</p>
          <p class="sub" id="overlaySub">첫 실행은 모델 다운로드로 조금 걸릴 수 있어요.</p>
          <button type="button" id="retry" hidden>다시 시도</button>
        </div>
      </div>
    </section>

    <div class="legend" aria-label="동작 방법">
      <span class="chip"><i class="dot fire"></i><b>불</b> 엄지+검지</span>
      <span class="chip"><i class="dot water"></i><b>물</b> 엄지+중지</span>
      <span class="chip"><i class="dot bolt"></i><b>번개</b> 엄지+약지</span>
      <span class="chip"><i class="dot ice"></i><b>얼음</b> 엄지+새끼</span>
      <span class="chip action"><b>주먹</b> 해제</span>
      <span class="chip action"><b>손바닥 펼치기</b> 발사</span>
    </div>

    <p class="hint">웹캠이 필요합니다 · 카메라 권한을 허용해 주세요</p>
  </main>

  <noscript>
    <p style="color:#fff;text-align:center">이 작품을 보려면 JavaScript를 켜 주세요.</p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js"></script>
  <script src="sketch.js"></script>
  <script>
    (function () {
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlaySub = document.getElementById('overlaySub');
      const retry = document.getElementById('retry');
      let ready = false;
      let failed = false;
      let modelReady = false;

      // 모델 → 카메라 순서로 준비되므로, 단계에 맞는 안내를 보여준다.
      const watch = setInterval(function () {
        try {
          if (typeof video !== 'undefined' && video && video.elt &&
              video.elt.readyState >= 2 && video.elt.videoWidth > 0) {
            ready = true;
            overlay.classList.add('hidden');
            clearInterval(watch);
            return;
          }
          if (typeof handPose !== 'undefined' && handPose && handPose.model && !modelReady) {
            modelReady = true;
            overlayTitle.textContent = '카메라를 시작하는 중…';
            overlaySub.textContent = '카메라 권한을 허용해 주세요.\n주소창의 카메라 아이콘에서 허용할 수 있어요.';
          }
        } catch (err) { /* 아직 초기화 전 */ }
      }, 250);

      setTimeout(function () {
        if (!ready && !failed && !modelReady) {
          overlaySub.textContent = '손 인식 모델을 내려받는 중입니다.\n첫 실행은 네트워크 상태에 따라 시간이 걸릴 수 있어요.';
        }
      }, 9000);

      function showError(detail) {
        if (ready || failed) return;
        failed = true;
        overlay.classList.remove('hidden');
        overlayTitle.textContent = '시작하지 못했어요';
        overlaySub.textContent = '카메라 권한을 허용한 뒤 다시 시도해 주세요.' +
          (detail ? '\n(' + String(detail).slice(0, 140) + ')' : '');
        retry.hidden = false;
      }

      retry.addEventListener('click', function () { location.reload(); });

      window.addEventListener('error', function (e) {
        if (e && e.message) showError(e.message);
      });

      window.addEventListener('unhandledrejection', function (e) {
        const r = e && e.reason;
        showError(r && (r.message || r));
      });
    })();
  </script>
</body>
</html>
