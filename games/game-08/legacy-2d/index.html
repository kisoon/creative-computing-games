<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08111d" />
  <title>물불 원정대 · Elemental Duo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <div id="stage-frame">
      <canvas
        id="game"
        width="1280"
        height="720"
        aria-label="2인 협동 물불 게임. 플레이어 1은 A, D, W로 물 캐릭터를, 플레이어 2는 방향키로 불 캐릭터를 조작합니다."
      ></canvas>
      <div class="frame-shine" aria-hidden="true"></div>
    </div>
    <p class="sr-only">
      두 캐릭터가 각자의 성소를 동시에 밟아 봉인을 해제한 뒤, 각자의 출구로 이동하면 스테이지가 클리어됩니다.
      물 캐릭터는 물에 안전하고 불에 닿으면 죽습니다. 불 캐릭터는 불에 안전하고 물에 닿으면 죽습니다.
    </p>
  </main>
  <script src="src/core.js"></script>
  <script src="src/level.js"></script>
  <script src="src/game.js"></script>
  <script src="src/draw-world.js"></script>
  <script src="src/draw-actors.js"></script>
  <script src="src/draw-hud.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
