<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달콤 옷장 · Dolly's Dress-Up Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:#5b4453;
    background:
      radial-gradient(circle at 8% 8%, #fff2f7 0, transparent 42%),
      radial-gradient(circle at 92% 92%, #ece6ff 0, transparent 45%),
      linear-gradient(135deg,#ffe1ed,#fff1e6 55%,#e9e3ff);
    min-height:100dvh; padding:14px; overflow:hidden;
  }
  .app{height:calc(100dvh - 28px); display:grid; grid-template-columns:minmax(350px,420px) 1fr; gap:14px;}

  /* ---------- closet panel ---------- */
  .closet{
    background:rgba(255,255,255,.78); border:1.5px solid #fff; border-radius:30px;
    padding:18px 16px; display:flex; flex-direction:column; gap:12px;
    box-shadow:0 20px 45px -24px rgba(190,110,145,.5); backdrop-filter:blur(14px);
    overflow-y:auto;
  }
  .closet::-webkit-scrollbar{width:8px}
  .closet::-webkit-scrollbar-thumb{background:#ffd3e2; border-radius:8px}
  .closet::-webkit-scrollbar-track{background:transparent}
  .closet-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 4px}
  .closet-head h1{
    font-family:"Gaegu","Apple SD Gothic Neo",sans-serif; font-size:33px; line-height:1; margin:0;
    color:#e2678c; font-weight:700; letter-spacing:-.5px;
  }
  .closet-head h1 .berry{font-size:26px}
  .closet-head p{margin:5px 0 0; font-size:11px; letter-spacing:1.6px; color:#c79aad; text-transform:uppercase}
  .badge{
    width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(135deg,#ffe0ec,#ffc4d8); color:#e2678c; font-size:19px;
    box-shadow:inset 0 2px 0 #fff, 0 5px 12px rgba(230,140,170,.25);
    flex:0 0 auto;
  }

  .tabs{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 7px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto; border:0; background:#fff; color:#a07a8c; border-radius:14px;
    padding:7px 10px; font-family:inherit; font-size:12px; cursor:pointer;
    box-shadow:0 2px 6px rgba(200,150,170,.12); transition:.2s;
    display:flex; align-items:center; gap:4px;
  }
  .tab b{font-size:14px; font-weight:400}
  .tab:hover{color:#e2678c}
  .tab.active{
    background:linear-gradient(135deg,#ffb3c9,#ff8fb0); color:#fff;
    box-shadow:0 5px 14px rgba(255,143,176,.4); transform:translateY(-1px);
  }

  .items{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
  .item{
    border:2px solid transparent; background:#fff; border-radius:16px;
    padding:8px 2px 6px; cursor:pointer; font-family:inherit; color:#7d5c6c;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:transform .16s, box-shadow .16s, border-color .16s, background .16s;
    box-shadow:0 3px 8px rgba(190,140,165,.1); min-width:0;
  }
  .item:hover{transform:translateY(-3px); box-shadow:0 8px 16px rgba(190,140,165,.2)}
  .item:focus-visible,.tab:focus-visible,.sw:focus-visible,.actions button:focus-visible{
    outline:2.5px solid #ff8fb0; outline-offset:2px;
  }
  .item.active{
    border-color:#ff9fbb; background:linear-gradient(180deg,#fff4f8,#ffe6ef);
    box-shadow:0 6px 14px rgba(255,143,176,.28);
  }
  .item .icon{font-size:21px; line-height:1.1}
  .item .name{font-size:10.5px; white-space:nowrap; letter-spacing:-.3px; max-width:100%; overflow:hidden; text-overflow:ellipsis}

  .palette-block{background:#fff9fc; border:1.5px solid #ffe3ee; border-radius:18px; padding:10px 12px}
  .p-label{font-size:11.5px; color:#ad7d92; display:flex; justify-content:space-between; margin-bottom:7px}
  .p-label em{font-style:normal; color:#e58aa8; font-weight:700}
  .swatches{display:flex; gap:7px; flex-wrap:wrap}
  .sw{
    width:24px; height:24px; border-radius:50%; border:2.5px solid #fff;
    box-shadow:0 2px 5px rgba(150,100,120,.25); cursor:pointer; transition:.15s; padding:0;
  }
  .sw:hover{transform:scale(1.12)}
  .sw.active{box-shadow:0 0 0 2.5px #ff9fbb, 0 2px 6px rgba(150,100,120,.25); transform:scale(1.08)}

  .actions{display:grid; grid-template-columns:1fr 1fr 1.2fr; gap:7px; margin-top:2px}
  .actions button{
    font-family:inherit; border:0; border-radius:16px; padding:11px 6px; font-size:12.5px;
    cursor:pointer; background:#fff; color:#a06b82;
    box-shadow:0 4px 10px rgba(190,140,165,.15); transition:.18s;
  }
  .actions button:hover{transform:translateY(-2px)}
  .actions button:active{transform:translateY(0) scale(.97)}
  #saveBtn{background:linear-gradient(135deg,#ffb3c9,#ff8fb0); color:#fff; box-shadow:0 8px 18px rgba(255,143,176,.4)}

  /* ---------- stage ---------- */
  .stage{
    position:relative; border-radius:30px; overflow:hidden; background:#ffe9f3;
    box-shadow:0 20px 45px -20px rgba(190,110,145,.45), inset 0 0 0 2px #fff;
    min-width:0;
  }
  .stage-head{
    position:absolute; inset:16px 20px auto 20px; display:flex; align-items:flex-start;
    justify-content:space-between; gap:12px; z-index:3; pointer-events:none;
  }
  .brand{
    font-family:"Gaegu","Apple SD Gothic Neo",sans-serif; font-size:25px; font-weight:700; color:#e2678c;
    text-shadow:0 2px 0 #fff; background:rgba(255,255,255,.35);
    padding:0 12px 2px; border-radius:14px; white-space:nowrap;
  }
  .hint{
    background:rgba(255,255,255,.78); border:1px solid #fff; padding:7px 14px;
    border-radius:999px; font-size:12.5px; color:#a26b84; backdrop-filter:blur(6px);
    box-shadow:0 4px 12px rgba(210,140,170,.15); white-space:nowrap;
  }
  .scene-wrap{position:absolute; inset:0}
  #scene{width:100%; height:100%; display:block}
  #doll{transform-box:fill-box; transform-origin:50% 100%; animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .toast{
    position:absolute; left:50%; bottom:26px; transform:translate(-50%,20px);
    background:rgba(255,255,255,.94); border:1.5px solid #ffd3e2; color:#b05c7a;
    padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none;
    transition:.3s; z-index:5; box-shadow:0 10px 24px rgba(200,120,150,.25); white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  .sparkles{position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2}
  .sparkles span{position:absolute; font-size:14px; opacity:0; animation:floaty linear infinite}
  @keyframes floaty{
    0%{opacity:0; transform:translateY(24px) scale(.6) rotate(0)}
    20%{opacity:.9}
    100%{opacity:0; transform:translateY(-140px) scale(1.15) rotate(20deg)}
  }
  .pop-heart{
    position:absolute; z-index:4; pointer-events:none; opacity:0;
    animation:popUp 1s ease-out forwards;
  }
  @keyframes popUp{
    0%{opacity:0; transform:translateY(0) scale(.4)}
    25%{opacity:1}
    100%{opacity:0; transform:translateY(-90px) scale(1.2) rotate(12deg)}
  }

  @media (max-width:900px){
    body{overflow-y:auto; overflow-x:hidden; padding:10px}
    .app{height:auto; grid-template-columns:1fr; gap:10px}
    .stage{order:-1; width:100%; height:auto; aspect-ratio:900/620; min-height:0}
    .closet{order:1; border-radius:26px; max-height:none; overflow:visible}
    .closet-head h1{font-size:29px}
    .items{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  }
  @media (max-width:560px){
    .hint{display:none}
    .brand{font-size:21px}
    .items{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  }
</style>

<script>
/* ======================= helpers ======================= */
function hexToRgb(h){
  h = h.replace('#','');
  if(h.length === 3) h = h.split('').map(x => x + x).join('');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function shade(hex, p){
  const [r,g,b] = hexToRgb(hex);
  const target = p < 0 ? 0 : 255;
  const f = Math.abs(p) / 100;
  const mix = v => Math.round(v + (target - v) * f);
  return '#' + [mix(r),mix(g),mix(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}
function mixHex(a, b, t){
  const A = hexToRgb(a), B = hexToRgb(b);
  return '#' + A.map((v,i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2,'0')).join('');
}
function bow(x, y, s, fill){
  const dk = shade(fill, -18);
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <path d="M0,0 C-16,-14 -32,-8 -28,4 C-24,15 -8,12 0,2 Z" fill="${fill}" stroke="${dk}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M0,0 C16,-14 32,-8 28,4 C24,15 8,12 0,2 Z" fill="${fill}" stroke="${dk}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-4,6 L-12,25 L-2,19 Z" fill="${fill}" stroke="${dk}" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M4,6 L12,25 L2,19 Z" fill="${fill}" stroke="${dk}" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="0" cy="1" r="6.5" fill="${dk}"/>
  </g>`;
}
function flower(x, y, r, fill){
  const dk = shade(fill, -12);
  return `<g transform="translate(${x} ${y})">
    <circle cx="0" cy="${-r}" r="${r*0.8}" fill="${fill}"/>
    <circle cx="${r*0.76}" cy="${-r*0.24}" r="${r*0.8}" fill="${fill}"/>
    <circle cx="${r*0.47}" cy="${r*0.64}" r="${r*0.8}" fill="${fill}"/>
    <circle cx="${-r*0.47}" cy="${r*0.64}" r="${r*0.8}" fill="${fill}"/>
    <circle cx="${-r*0.76}" cy="${-r*0.24}" r="${r*0.8}" fill="${fill}"/>
    <circle cx="0" cy="0" r="${r*0.55}" fill="${dk}"/>
  </g>`;
}

function star(x,y,r,fill){
  return `<path d="M${x},${y-r} L${x+r*.3},${y-r*.3} L${x+r},${y} L${x+r*.3},${y+r*.3} L${x},${y+r} L${x-r*.3},${y+r*.3} L${x-r},${y} L${x-r*.3},${y-r*.3} Z" fill="${fill}"/>`;
}
function twinkle(x,y,fill){
  return `<g fill="${fill}" opacity=".85"><path d="M${x},${y-5} Q${x},${y} ${x+5},${y} Q${x},${y} ${x},${y+5} Q${x},${y} ${x-5},${y} Q${x},${y} ${x},${y-5} Z"/></g>`;
}

  { key:'face',   label:'표정',    icon:'😊' }
];
const PALETTES = {
  hair:  ['#3a2a2e','#7a4a3a','#b9754b','#e8b7c8','#b6a6e3','#8fbcd6'],
  top:   ['#ffd6e2','#fff3c9','#d8f0e2','#d9e6ff','#f3d7ff','#ffd9c7','#faf6f2','#5f5064'],
  bottom:['#cbb8ef','#ffc2d4','#bcd8f7','#f7e6b8','#cdd6c2','#f7d7c0','#8aa9d8','#5f5064'],
  dress: ['#ffd1e0','#f6e7ff','#d9f2e6','#fff0c9','#ffd9c9','#cfe2ff','#f9c6d8','#fff8f8'],
  shoes: ['#8a5a44','#faf6f2','#ffb3c6','#6b5a7a','#d9b38c','#3a2a2e'],
  acc:   ['#ff9fbb','#ffd166','#a9d6c9','#b9a8e0','#fff8f8','#f18ba8']
};
const SKINS = ['#ffe2d1','#f8d9c4','#eec2a4','#d7a17e'];
const COLOR_LABEL = { hair:'헤어', top:'상의', bottom:'하의', dress:'원피스', shoes:'신발', acc:'액세서리' };

const DEFAULT_STATE = {
  hair:'h1', top:'t1', bottom:'b1', dress:null, shoes:'s1', acc:'a1', face:'f1',
  skin:'#f8d9c4',
  colors:{ hair:'#7a4a3a', top:'#ffd6e2', bottom:'#cbb8ef', dress:'#ffd1e0', shoes:'#8a5a44', acc:'#ff9fbb' }
};
const STORAGE_KEY = 'dolly-closet-v1';
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let currentTab = 'hair';

function find(cat, id){ return (DB[cat] || []).find(i => i.id === id); }

function saveState(){ try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){} }
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    ['hair','top','bottom','dress','shoes','acc','face'].forEach(k => {
      if(s[k] && find(k, s[k])) state[k] = s[k];
      else if(k in s) state[k] = s[k];
    });
    if(s.skin) state.skin = s.skin;
    if(s.colors) Object.assign(state.colors, s.colors);
  } catch(e){}
}

/* ======================= render doll ======================= */
const dollEl = document.getElementById('doll');

function renderDoll(){
  const hair = find('hair', state.hair);
  const top = state.top ? find('top', state.top) : null;
  const bottom = state.bottom ? find('bottom', state.bottom) : null;
  const dress = state.dress ? find('dress', state.dress) : null;
  const shoes = state.shoes ? find('shoes', state.shoes) : null;
  const acc = state.acc ? find('acc', state.acc) : null;
  const face = find('face', state.face);

  const topDraw = top ? top.draw(state.colors.top) : null;

  let html = '';
  // 후드처럼 머리 뒤로 넘어가는 부분은 몸/헤어보다 먼저 그립니다.
  if(topDraw && typeof topDraw === 'object' && topDraw.back) html += topDraw.back;
  if(hair){ const h = hair.draw(state.colors.hair); html += h.back || ''; }
  html += bodySVG(state.skin);
  // 신발은 하의/원피스 밑에 깔아서 긴 옷자락이 자연스럽게 덮도록 합니다.
  if(shoes) html += `<g transform="translate(0 4)">${shoes.draw(state.colors.shoes)}</g>`;
  if(dress && typeof dress.draw === 'function') html += dress.draw(state.colors.dress);
  else {
    if(bottom) html += bottom.draw(state.colors.bottom);
    if(topDraw) html += typeof topDraw === 'string' ? topDraw : (topDraw.front || '');
  }
  if(face) html += face.draw();
  if(hair){ const h = hair.draw(state.colors.hair); html += h.front || ''; }
  if(acc && typeof acc.draw === 'function') html += acc.draw(state.colors.acc);
  dollEl.innerHTML = html;
}

/* ======================= render panel ======================= */
const tabsEl = document.getElementById('tabs');
const itemsEl = document.getElementById('items');
const swatchesEl = document.getElementById('swatches');
const skinSwatchesEl = document.getElementById('skinSwatches');
const colorBlock = document.getElementById('colorBlock');
const colorLabel = document.getElementById('colorLabel');

function renderTabs(){
  tabsEl.innerHTML = CATS.map(cat => `
    <button class="tab ${cat.key === currentTab ? 'active' : ''}" data-tab="${cat.key}">
      <b>${cat.icon}</b>${cat.label}
    </button>`).join('');
}

function itemActive(cat, id){
  if(cat === 'dress') return id === 'none' ? !state.dress : state.dress === id;
  if(cat === 'acc') return id === 'none' ? !state.acc : state.acc === id;
  return state[cat] === id;
}

function renderItems(){
  itemsEl.innerHTML = (DB[currentTab] || []).map(item => `
    <button class="item ${itemActive(currentTab, item.id) ? 'active' : ''}" data-id="${item.id}">
      <span class="icon">${item.icon}</span>
      <span class="name">${item.name}</span>
    </button>`).join('');
}

function renderPalette(){
  if(currentTab === 'face'){
    colorBlock.style.display = 'none';
  } else {
    colorBlock.style.display = '';
    const cat = currentTab;
    colorLabel.textContent = COLOR_LABEL[cat] || '의상';
    const pal = PALETTES[cat] || [];
    swatchesEl.innerHTML = pal.map(color => `
      <button class="sw ${state.colors[cat] === color ? 'active' : ''}" data-color="${color}"
        style="background:${color}" aria-label="${color}"></button>`).join('');
  }
  skinSwatchesEl.innerHTML = SKINS.map(color => `
    <button class="sw ${state.skin === color ? 'active' : ''}" data-skin="${color}"
      style="background:${color}" aria-label="피부톤 ${color}"></button>`).join('');
}

function renderAll(){
  renderTabs();
  renderItems();
  renderPalette();
  renderDoll();
}

/* ======================= interactions ======================= */
const stageEl = document.getElementById('stage');
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

function burst(count = 4){
  const chars = ['💕','✨','♡','🌸','💗'];
  for(let i=0;i<count;i++){
    const s = document.createElement('span');
    s.className = 'pop-heart';
    s.textContent = chars[Math.floor(Math.random()*chars.length)];
    s.style.left = (42 + Math.random()*24) + '%';
    s.style.bottom = (18 + Math.random()*28) + '%';
    s.style.fontSize = (11 + Math.random()*13) + 'px';
    s.style.animationDelay = (i*45) + 'ms';
    stageEl.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}

tabsEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-tab]');
  if(!btn) return;
  currentTab = btn.dataset.tab;
  renderTabs();
  renderItems();
  renderPalette();
});

itemsEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-id]');
  if(!btn) return;
  const id = btn.dataset.id;

  if(currentTab === 'dress'){
    if(id === 'none'){
      state.dress = null;
      if(!state.top) state.top = 't1';
      if(!state.bottom) state.bottom = 'b1';
    }
    else {
      state.dress = id;
      state.top = null;
      state.bottom = null;
      showToast('원피스를 입었어요! 상·하의는 잠시 쉬어갈게요 👗');
    }
  } else if(currentTab === 'top'){
    state.top = id;
    if(state.dress){ state.dress = null; showToast('낱개 코디로 바꿨어요 ✂️'); }
    if(!state.bottom && !state.dress) state.bottom = 'b1';
  } else if(currentTab === 'bottom'){
    state.bottom = id;
    if(state.dress){ state.dress = null; showToast('낱개 코디로 바꿨어요 ✂️'); }
    if(!state.top && !state.dress) state.top = 't2';
  } else if(currentTab === 'acc'){
    state.acc = id === 'none' ? null : id;
  } else if(currentTab === 'face'){
    state.face = id;
  } else {
    state[currentTab] = id;
  }

  saveState();
  renderItems();
  renderDoll();
  burst();
});

swatchesEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-color]');
  if(!btn) return;
  if(currentTab === 'face') return;
  state.colors[currentTab] = btn.dataset.color;
  saveState();
  renderPalette();
  renderDoll();
  burst(2);
});

skinSwatchesEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-skin]');
  if(!btn) return;
  state.skin = btn.dataset.skin;
  saveState();
  renderPalette();
  renderDoll();
  burst(2);
});

document.getElementById('randomBtn').addEventListener('click', () => {
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];
  state.hair = pick(DB.hair).id;
  state.face = pick(DB.face).id;
  state.shoes = pick(DB.shoes).id;
  state.acc = Math.random() < .82 ? pick(DB.acc.filter(a => a.id !== 'none')).id : null;

  if(Math.random() < .42){
    state.dress = pick(DB.dress.filter(d => d.id !== 'none')).id;
    state.top = null;
    state.bottom = null;
  } else {
    state.dress = null;
    state.top = pick(DB.top).id;
    state.bottom = pick(DB.bottom).id;
  }

  for(const cat of Object.keys(PALETTES)) state.colors[cat] = pick(PALETTES[cat]);

  saveState();
  renderItems();
  renderPalette();
  renderDoll();
  burst(7);
  showToast('랜덤 코디 완성! 마음에 드나요? 🎲');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  saveState();
  renderItems();
  renderPalette();
  renderDoll();
  showToast('처음 모습으로 돌아왔어요 ↺');
});

/* ======================= save as PNG ======================= */
function downloadPNG(){
  const svgEl = document.getElementById('scene');
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', '1800');
  clone.setAttribute('height', '1240');
  clone.querySelectorAll('*').forEach(el => {
    el.style.animation = 'none';
    if(el.tagName === 'g') el.style.transform = el.getAttribute('transform') || '';
  });
  const str = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([str], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = 1800; cv.height = 1240;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffe9f3'; ctx.fillRect(0,0,1800,1240);
    ctx.drawImage(img, 0, 0, 1800, 1240);
    URL.revokeObjectURL(url);
    try {
      const a = document.createElement('a');
      a.download = 'dolly-room.png';
      a.href = cv.toDataURL('image/png');
      a.click();
      showToast('사진을 저장했어요 📸');
    } catch(err){ showToast('저장에 실패했어요 🥲'); }
  };
  img.onerror = () => { URL.revokeObjectURL(url); showToast('저장에 실패했어요 🥲'); };
  img.src = url;
}
document.getElementById('saveBtn').addEventListener('click', downloadPNG);

/* ======================= sparkles ======================= */
(function makeSparkles(){
  const wrap = document.getElementById('sparkles');
  const chars = ['✦','♡','✧','·','❀'];
  const colors = ['#ffffff','#ffc4d8','#fff0b8','#e5d8ff'];
  for(let i=0;i<16;i++){
    const s = document.createElement('span');
    s.textContent = chars[i % chars.length];
    s.style.left = (Math.random()*100) + '%';
    s.style.top = (20 + Math.random()*70) + '%';
    s.style.color = colors[i % colors.length];
    s.style.fontSize = (9 + Math.random()*11) + 'px';
    s.style.animationDuration = (9 + Math.random()*9) + 's';
    s.style.animationDelay = (-Math.random()*15) + 's';
    s.style.textShadow = '0 0 8px rgba(255,255,255,.9)';
    wrap.appendChild(s);
  }
})();

/* ======================= boot ======================= */
loadState();
if(!state.dress){
  if(!state.top) state.top = 't1';
  if(!state.bottom) state.bottom = 'b1';
}
renderAll();
</script>
