<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>숲길을 건너는 호랑이 · 떡 피하기</title>
<style>
  :root{
    --ink:#20301f;
    --ink-soft:#4a5b45;
    --sky:#dcebc7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    overflow:hidden;
    background:var(--sky);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #scene{
    display:block;width:100%;height:100%;
    touch-action:none;cursor:grab;outline:none;
  }
  #scene:active{cursor:grabbing;}

  .hud{
    position:fixed;
    top:clamp(16px,3vw,34px);
    left:clamp(16px,3vw,34px);
    max-width:min(27rem,66vw);
    pointer-events:none;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:18px;
    padding:clamp(14px,2vw,20px) clamp(16px,2.2vw,24px);
    box-shadow:0 18px 40px -26px rgba(32,48,31,.55);
  }
  .eyebrow{
    margin:0 0 6px;
    font-size:10px;
    font-weight:700;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:#7b8a68;
  }
  h1{
    margin:0;
    font-size:clamp(17px,2.2vw,24px);
    line-height:1.25;
    letter-spacing:-.02em;
    font-weight:800;
  }
  .desc{
    margin:8px 0 0;
    font-size:clamp(11.5px,1.15vw,13px);
    line-height:1.6;
    color:var(--ink-soft);
    word-break:keep-all;
  }
  .palette{display:flex;gap:6px;margin-top:12px;}
  .palette i{
    width:16px;height:16px;border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }

  .score{
    position:fixed;
    top:clamp(16px,3vw,34px);
    right:clamp(16px,3vw,34px);
    display:flex;
    align-items:baseline;
    gap:8px;
    background:rgba(255,255,255,.76);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.92);
    border-radius:999px;
    padding:8px 16px 9px;
    pointer-events:none;
    box-shadow:0 14px 30px -22px rgba(32,48,31,.6);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    color:#5b6b52;
  }
  .score b{
    font-size:21px;
    line-height:1;
    color:#20301f;
    font-variant-numeric:tabular-nums;
    display:inline-block;
  }
  .score b.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1);}
  @keyframes pop{
    0%{transform:scale(1);}
    45%{transform:scale(1.4);}
    100%{transform:scale(1);}
  }

  .hint{
    position:fixed;
    right:clamp(14px,3vw,34px);
    bottom:clamp(14px,3vw,30px);
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    justify-content:flex-end;
    pointer-events:none;
    font-size:11.5px;
    letter-spacing:.02em;
    color:#46573f;
  }
  .hint span{
    background:rgba(255,255,255,.68);
    border:1px solid rgba(255,255,255,.9);
    border-radius:999px;
    padding:7px 12px;
    backdrop-filter:blur(8px);
  }
  .hint b{font-weight:700;color:#2c3d2a;}

  .overlay{
    position:fixed;inset:0;display:grid;place-items:center;
    pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .25s ease, visibility .25s;
    background:radial-gradient(circle at 50% 45%, rgba(26,38,24,.28), rgba(26,38,24,.5));
    z-index:4;
  }
  .overlay.show{opacity:1;visibility:visible;}
  /* READY는 호랑이를 가리지 않도록 아래쪽에 얇게 */
  .overlay:not(.over-mode){
    align-items:end;
    padding-bottom:clamp(72px,11vh,132px);
  }
  .overlay:not(.over-mode) .card{
    display:flex;
    align-items:center;
    gap:clamp(12px,2vw,20px);
    padding:clamp(12px,1.6vw,16px) clamp(18px,2.6vw,26px);
    border-radius:18px;
    text-align:left;
    max-width:min(26rem,86vw);
  }
  .overlay:not(.over-mode) .eyebrow,
  .overlay:not(.over-mode) .card p{display:none;}
  .overlay:not(.over-mode) h2{
    margin:0;
    font-size:clamp(16px,1.9vw,20px);
  }
  .overlay:not(.over-mode) .key{margin-top:0;flex:0 0 auto;}
  .overlay .card{
    background:rgba(255,255,255,.93);
    border-radius:22px;
    padding:clamp(22px,3vw,30px) clamp(24px,4vw,38px);
    text-align:center;
    max-width:min(30rem,84vw);
    box-shadow:0 34px 70px -34px rgba(10,20,8,.7);
    transform:translateY(10px) scale(.98);
    transition:transform .3s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.show .card{transform:none;}
  .overlay h2{
    margin:0 0 8px;
    font-size:clamp(20px,3vw,28px);
    letter-spacing:-.02em;
  }
  .overlay .card p{
    margin:0;
    font-size:clamp(12px,1.3vw,13.5px);
    line-height:1.7;
    color:#4a5b45;
    word-break:keep-all;
  }
  .overlay .card p b{color:#20301f;font-size:1.25em;}
  .overlay .key{
    display:inline-block;
    margin-top:16px;
    padding:8px 16px;
    border-radius:10px;
    border:1px solid #cfd9c4;
    border-bottom-width:3px;
    background:#f4f7ee;
    font-size:11px;
    font-weight:800;
    letter-spacing:.18em;
    color:#3c4c36;
  }

  .loader{
    position:fixed;inset:0;display:grid;place-items:center;
    background:var(--sky);font-size:13px;color:#5c6b51;letter-spacing:.08em;
    transition:opacity .5s ease;z-index:5;
  }
  .loader.hide{opacity:0;pointer-events:none;}

  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 52%, rgba(38,52,32,.22) 100%);
  }

  @media (max-width: 620px){
    .hud{max-width:calc(100vw - 32px);}
    .hint span:nth-child(2){display:none;}
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="블록으로 만든 호랑이가 하늘에서 떨어지는 떡을 뛰어넘는 3D 게임"></canvas>
<div class="vignette"></div>

<div class="hud">
  <p class="eyebrow">Voxel Run · Tiger</p>
  <h1>숲길을 건너는 호랑이</h1>
  <p class="desc">하늘에서 떡이 하나씩 내려옵니다. 발밑에 닿기 전에 점프해서 넘어가세요.</p>
  <div class="palette" aria-hidden="true">
    <i style="background:#e98a3c"></i>
    <i style="background:#f7e7ca"></i>
    <i style="background:#2f2620"></i>
    <i style="background:#5aa267"></i>
    <i style="background:#c8a16a"></i>
  </div>
</div>

<div class="score">넘은 떡 <b id="scoreValue">0</b></div>

<div class="hint">
  <span><b>SPACE</b> / 클릭 점프</span>
  <span><b>드래그</b> 시점 회전</span>
  <span><b>휠</b> 확대·축소</span>
</div>

<div class="overlay show" id="overlay">
  <div class="card">
    <p class="eyebrow" id="ovEyebrow">Ready</p>
    <h2 id="ovTitle">떡이 내려온다</h2>
    <p id="ovDesc">SPACE 또는 화면을 눌러 출발하세요. 떡이 발밑에 닿기 전에 점프하면 넘어갑니다.</p>
    <div class="key">SPACE</div>
  </div>
</div>

<div class="loader" id="loader">숲을 짓는 중…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>

<script>
  // CDN 로딩이 막힌 경우를 위한 안내
  setTimeout(() => {
    if (!window.__tigerReady && !window.__tigerFailed) {
      const el = document.getElementById('loader');
      if (el) el.textContent = '3D 라이브러리를 불러오지 못했어요 · 인터넷 연결을 확인해 주세요';
    }
  }, 6000);
</script>

<script type="module">
import * as THREE from 'three';

/* ------------------------------------------------------------------
   기본 설정
------------------------------------------------------------------ */
const canvas = document.getElementById('scene');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (error) {
 window.__tigerFailed = true;
 document.getElementById('loader').textContent = '이 게임은 WebGL2가 필요해요. 브라우저의 그래픽 가속을 켜거나 다른 기기에서 실행해 주세요.';
 throw error;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const SKY = 0xdcebc7;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 26, 76);

const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 220);

const hemi = new THREE.HemisphereLight(0xfff8e6, 0x5d7a46, 1.25);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1cc, 2.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0009;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ------------------------------------------------------------------
   색 팔레트 (단순한 조합)
------------------------------------------------------------------ */
const C = {
  fur:      0xe98a3c,
  furDeep:  0xd4772c,
  cream:    0xf7e7ca,
  creamDeep:0xe9cda6,
  stripe:   0x2f2620,
  nose:     0x2b211b,
  eye:      0x1c1712,
  grass:    0x7cb45c,
  grassDeep:0x69a44e,
  dirt:     0xc8a16a,
  dirtDeep: 0xc09a66,
  dirtEdge: 0xa87f50,
  trunk:    0x7b5a3f,
  leafA:    0x5aa267,
  leafB:    0x478a54,
  rock:     0x9aa294,
  petal:    0xf2a6b8,
  bloom:    0xf6d465,
  // 떡
  rice:     0xf7f1e2,
  riceTop:  0xfffbf0,
  riceDark: 0xe3d7bd,
  bean:     0xe79ab0,
  herb:     0x9dbf7a,
};

/* ------------------------------------------------------------------
   복셀 헬퍼
------------------------------------------------------------------ */
const geoCache = new Map();
const matCache = new Map();

function geoFor(w, h, d) {
  const k = `${w}|${h}|${d}`;
  let g = geoCache.get(k);
  if (!g) {
    g = new THREE.BoxGeometry(w, h, d);
    geoCache.set(k, g);
  }
  return g;
}
function matFor(color) {
  let m = matCache.get(color);
  if (!m) {
    m = new THREE.MeshLambertMaterial({ color });
    matCache.set(color, m);
  }
  return m;
}
function vox(parent, w, h, d, color, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(geoFor(w, h, d), matFor(color));
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

/* ------------------------------------------------------------------
   호랑이 (정면 = -Z)
------------------------------------------------------------------ */
const TIGER_SCALE = 0.85;

function buildTiger() {
  const root = new THREE.Group();
  const rig = new THREE.Group();     // 발밑이 원점 → 점프 스쿼시 기준
  root.add(rig);

  // 몸통
  vox(rig, 1.15, 1.05, 1.55, C.fur, 0, 1.35, 0.15);
  vox(rig, 1.22, 1.10, 0.62, C.furDeep, 0, 1.38, -0.72); // 어깨
  vox(rig, 1.18, 1.00, 0.55, C.fur, 0, 1.33, 0.80);      // 엉덩이

  // 가슴 크림색 털
  vox(rig, 0.60, 0.44, 0.10, C.cream, 0, 1.34, -1.05);

  // 몸통 줄무늬 — 옆면
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      vox(rig, 0.06, 0.56, 0.16, C.stripe, side * 0.585, 1.40, 0.54 - i * 0.40);
    }
    vox(rig, 0.06, 0.60, 0.16, C.stripe, side * 0.615, 1.42, -0.72);
  }
  // 몸통 줄무늬 — 등
  for (let i = 0; i < 3; i++) {
    vox(rig, 0.52, 0.06, 0.20, C.stripe, 0, 1.88, 0.58 - i * 0.44);
  }

  // 머리
  const head = new THREE.Group();
  head.position.set(0, 2.12, -1.30);
  rig.add(head);

  vox(head, 1.15, 0.95, 0.95, C.fur, 0, 0, 0);
  vox(head, 0.94, 0.28, 0.10, C.furDeep, 0, -0.36, -0.46); // 턱 아래

  // 귀
  for (const side of [-1, 1]) {
    vox(head, 0.36, 0.40, 0.22, C.furDeep, side * 0.42, 0.64, 0.12);
    vox(head, 0.13, 0.15, 0.06, C.creamDeep, side * 0.42, 0.63, 0.015);
  }

  // 주둥이 · 코
  vox(head, 0.54, 0.30, 0.26, C.cream, 0, -0.22, -0.58);
  vox(head, 0.24, 0.13, 0.10, C.nose, 0, -0.09, -0.73);
  vox(head, 0.16, 0.05, 0.05, C.stripe, 0, -0.34, -0.71);

  // 눈
  for (const side of [-1, 1]) {
    vox(head, 0.14, 0.22, 0.09, C.eye, side * 0.26, 0.22, -0.48);
  }

  // 이마 줄무늬 (앞면 + 머리 위)
  for (const side of [-1, 1]) {
    vox(head, 0.07, 0.10, 0.05, C.stripe, side * 0.12, 0.43, -0.48);
    vox(head, 0.07, 0.05, 0.30, C.stripe, side * 0.16, 0.477, -0.05);
  }
  // 볼 줄무늬 (옆면에 붙임)
  for (const side of [-1, 1]) {
    vox(head, 0.05, 0.10, 0.20, C.stripe, side * 0.578, -0.04, 0.18);
    vox(head, 0.05, 0.10, 0.18, C.stripe, side * 0.578, -0.16, 0.38);
  }

  // 다리 — 엉덩이 관절 기준
  function makeLeg(x, z, front) {
    const g = new THREE.Group();
    g.position.set(x, 1.00, z);
    vox(g, 0.36, 0.62, 0.44, front ? C.fur : C.furDeep, 0, -0.31, 0);
    vox(g, 0.32, 0.42, 0.40, C.fur, 0, -0.72, 0);
    vox(g, 0.38, 0.15, 0.46, C.cream, 0, -0.87, -0.02);
    vox(g, 0.34, 0.08, 0.05, C.stripe, 0, -0.45, -0.225);
    rig.add(g);
    return g;
  }
  const legs = {
    fl: makeLeg(-0.42, -0.58, true),
    fr: makeLeg( 0.42, -0.58, true),
    bl: makeLeg(-0.44,  0.62, false),
    br: makeLeg( 0.44,  0.62, false),
  };

  // 꼬리 — 옆으로 살짝 휘며 위로 들림
  const tail = new THREE.Group();
  tail.position.set(0.34, 1.48, 0.86);
  rig.add(tail);

  vox(tail, 0.30, 0.30, 0.40, C.furDeep, 0.00, 0.04, 0.16);
  vox(tail, 0.26, 0.26, 0.36, C.fur,     0.02, 0.20, 0.44);
  vox(tail, 0.22, 0.22, 0.30, C.furDeep, 0.04, 0.38, 0.68);
  vox(tail, 0.20, 0.20, 0.20, C.stripe,  0.06, 0.54, 0.86);

  root.scale.setScalar(TIGER_SCALE);
  scene.add(root);
  return { root, rig, head, tail, legs };
}

const tiger = buildTiger();
tiger.root.position.set(0, 0.05, 0);

/* ------------------------------------------------------------------
   숲길 · 나무 · 바닥
------------------------------------------------------------------ */
const GROUND_Y = 0;
const PATH_TOP = 0.05;

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220),
  new THREE.MeshLambertMaterial({ color: C.grass })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = GROUND_Y;
ground.receiveShadow = true;
scene.add(ground);

// 길 타일
const PATH_TILE_LEN = 4;
const PATH_COUNT = 30;
const pathTiles = [];
for (let i = 0; i < PATH_COUNT; i++) {
  const g = new THREE.Group();
  const shade = i % 2 === 0 ? C.dirt : C.dirtDeep;
  vox(g, 4.9, 0.18, PATH_TILE_LEN + 0.06, shade, 0, -0.04, 0);
  // 가장자리 흙더미
  vox(g, 0.5, 0.20, PATH_TILE_LEN + 0.06, C.dirtEdge, -2.65, -0.03, 0);
  vox(g, 0.5, 0.20, PATH_TILE_LEN + 0.06, C.dirtEdge,  2.65, -0.03, 0);
  g.position.set(Math.sin(i * 0.20) * 0.10, 0, 30 - i * PATH_TILE_LEN);
  g.scale.x = 1 + Math.sin(i * 0.25) * 0.06;
  scene.add(g);
  pathTiles.push(g);
}

// 나무
function makeTree() {
  const g = new THREE.Group();
  const trunkH = 2.3 + Math.random() * 1.2;
  vox(g, 0.86, trunkH, 0.86, C.trunk, 0, trunkH / 2, 0);

  const foliage = new THREE.Group();
  const w = 2.5 + Math.random() * 0.9;
  vox(foliage, w, 1.45, w, C.leafA, 0, trunkH + 0.5, 0);
  vox(foliage, w * 0.74, 1.05, w * 0.74, C.leafB, 0.14, trunkH + 1.42, -0.12);
  vox(foliage, w * 0.46, 0.75, w * 0.46, C.leafA, -0.12, trunkH + 1.98, 0.14);
  vox(foliage, 0.95, 0.85, 0.95, C.leafB, w * 0.42, trunkH + 0.15, w * 0.3);
  vox(foliage, 0.8, 0.7, 0.8, C.leafB, -w * 0.4, trunkH - 0.1, -w * 0.25);
  g.add(foliage);

  g.userData.foliage = foliage;
  g.userData.swayPhase = Math.random() * Math.PI * 2;
  return g;
}

const AHEAD = -82;
const BEHIND = 34;
const WORLD_SPAN = BEHIND - AHEAD;

const recyclables = [];

function placeRandom(obj, kind) {
  const side = Math.random() < 0.5 ? -1 : 1;
  if (kind === 'tree') {
    obj.position.x = side * (8.0 + Math.random() * 12);
    obj.scale.setScalar(0.8 + Math.random() * 0.4);
    obj.rotation.y = Math.random() * Math.PI;
  } else if (kind === 'bigtree') {
    obj.position.x = side * (21 + Math.random() * 12);
    obj.scale.setScalar(1.0 + Math.random() * 0.35);
    obj.rotation.y = Math.random() * Math.PI;
  } else if (kind === 'pebble') {
    obj.position.x = (Math.random() * 2 - 1) * 2.1;
    obj.scale.set(0.6 + Math.random() * 0.7, 0.5 + Math.random() * 0.5, 0.6 + Math.random() * 0.7);
    obj.rotation.y = Math.random() * Math.PI;
  } else if (kind === 'bush') {
    obj.position.x = side * (4.2 + Math.random() * 7);
    obj.scale.setScalar(0.8 + Math.random() * 0.7);
    obj.rotation.y = Math.random() * Math.PI;
  } else if (kind === 'rock') {
    obj.position.x = side * (3.1 + Math.random() * 5.5);
    obj.scale.set(0.7 + Math.random() * 0.8, 0.45 + Math.random() * 0.6, 0.7 + Math.random() * 0.8);
    obj.rotation.y = Math.random() * Math.PI;
  } else if (kind === 'tuft') {
    obj.position.x = side * (2.95 + Math.random() * 3.4);
    obj.scale.setScalar(0.7 + Math.random() * 0.8);
    obj.rotation.y = Math.random() * Math.PI;
  } else if (kind === 'flower') {
    obj.position.x = side * (2.9 + Math.random() * 7);
    obj.scale.setScalar(0.7 + Math.random() * 0.6);
    obj.rotation.y = Math.random() * Math.PI;
  }
}

function addProp(kind, count, builder) {
  for (let i = 0; i < count; i++) {
    const obj = builder();
    placeRandom(obj, kind);
    obj.position.z = BEHIND - (i / count) * WORLD_SPAN - Math.random() * (WORLD_SPAN / count);
    scene.add(obj);
    recyclables.push({ obj, kind });
  }
}

addProp('tree', 58, makeTree);
addProp('bigtree', 22, makeTree);
addProp('pebble', 16, () => {
  const g = new THREE.Group();

/* ------------------------------------------------------------------
   떡 장애물
------------------------------------------------------------------ */
const CAKE_POOL = 8;
const CAKE_SPAWN_AHEAD = 18;
const CAKE_FALL_HEIGHT = 8.5;
const CAKE_GRAVITY = 21;
const CAKE_SCALE = 0.82;

const cakes = [];

function makeCakeModel() {
  const g = new THREE.Group();
  vox(g, 1.50, 0.14, 1.50, C.riceDark, 0, 0.07, 0);  // 밑면
  vox(g, 1.44, 0.56, 1.44, C.rice,     0, 0.42, 0);  // 몸통
  vox(g, 1.10, 0.30, 1.10, C.riceTop,  0, 0.83, 0);  // 윗면
  vox(g, 0.42, 0.20, 0.42, C.leafB,   0.20, 1.02, 0.16); // 송편 잎
  vox(g, 0.28, 0.16, 0.28, C.bean,   -0.24, 1.00, -0.18); // 앙금
  return g;
}

for (let i = 0; i < CAKE_POOL; i++) {
  const root = new THREE.Group();

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.80, 20),
    new THREE.MeshBasicMaterial({
      color: 0x2b2116, transparent: true, opacity: 0.16, depthWrite: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.06;
  shadow.renderOrder = 1;

  const body = new THREE.Group();
  const model = makeCakeModel();
  body.add(model);

  root.add(shadow, body);
  root.visible = false;
  scene.add(root);

  cakes.push({
    root, body, model, shadow,
    active: false,
    falling: false,
    vy: 0,
    hit: false,
    passed: false,
    bounce: 0,
  });
}

function resetCakes() {
  for (const c of cakes) {
    c.active = false;
    c.falling = false;
    c.hit = false;
    c.passed = false;
    c.bounce = 0;
    c.root.visible = false;
    c.body.position.y = 0;
    c.body.rotation.set(0, 0, 0);
    c.model.scale.setScalar(CAKE_SCALE);
  }
}

function spawnCake() {
  const c = cakes.find((x) => !x.active);
  if (!c) return;
  c.active = true;
  c.falling = true;
  c.hit = false;
  c.passed = false;
  c.bounce = 0;
  c.vy = 0;
  c.root.position.set(
    (Math.random() * 2 - 1) * 0.7,
    0,
    tiger.root.position.z - CAKE_SPAWN_AHEAD
  );
  c.root.visible = true;
  c.body.position.y = CAKE_FALL_HEIGHT;
  c.body.rotation.set(0, Math.random() * Math.PI, 0);
  c.model.scale.setScalar(CAKE_SCALE);
  c.shadow.material.opacity = 0.04;
  c.shadow.scale.setScalar(0.4);
}

/* ------------------------------------------------------------------
   카메라 (뒤쪽 3/4, 드래그로 회전)
------------------------------------------------------------------ */
let yaw = 0.36;
let pitch = 0.52;
let dist = 11.8;
const camTarget = new THREE.Vector3(0, 1.35, 0);
const camDesired = new THREE.Vector3();
const lookAt = new THREE.Vector3();

function updateCamera(dt, instant = false) {
  const t = tiger.root.position;
  lookAt.set(t.x, PATH_TOP + 1.35, t.z - 1.8); // 살짝 앞을 내려다봐 장애물이 잘 보이게
  camTarget.lerp(lookAt, instant ? 1 : 1 - Math.exp(-7 * dt));

  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  camDesired.set(
    camTarget.x + Math.sin(yaw) * cp * dist,
    camTarget.y + sp * dist,
    camTarget.z + Math.cos(yaw) * cp * dist
  );
  camera.position.lerp(camDesired, instant ? 1 : 1 - Math.exp(-6 * dt));
  camera.lookAt(camTarget);
}
updateCamera(0, true);

/* ------------------------------------------------------------------
   게임 상태
------------------------------------------------------------------ */
const STATE = { READY: 'ready', RUNNING: 'running', OVER: 'over' };

const RUN_START = 5.0;
const RUN_MAX = 8.4;
const JUMP_TIME = 0.72;
const JUMP_HEIGHT = 1.65;
const CAKE_HIT_HEIGHT = 0.8;
const CAKE_HIT_DEPTH = 0.6;

let state = STATE.READY;
let score = 0;
let runSpeed = RUN_START;
let jumpT = -1;
let landTimer = 0;
let runPhase = 0;
let elapsed = 0;
let nextCakeAt = 1.4;

const scoreValue = document.getElementById('scoreValue');
const overlay = document.getElementById('overlay');
const ovEyebrow = document.getElementById('ovEyebrow');
const ovTitle = document.getElementById('ovTitle');
const ovDesc = document.getElementById('ovDesc');

function showOverlay(mode) {
  if (mode === 'hide') {
    overlay.classList.remove('show');
    return;
  }
  if (mode === 'over') {
    overlay.classList.add('over-mode');
    ovEyebrow.textContent = 'Game Over';
    ovTitle.textContent = '떡에 걸렸다!';
    ovDesc.innerHTML = `넘은 떡 <b>${score}</b>개 · SPACE 또는 화면을 눌러 다시 도전`;
  } else {
    overlay.classList.remove('over-mode');
    ovEyebrow.textContent = 'Ready';
    ovTitle.textContent = '떡이 내려온다';
    ovDesc.textContent = 'SPACE 또는 화면을 눌러 출발하세요. 떡이 발밑에 닿기 전에 점프하면 넘어갑니다.';
  }
  overlay.classList.add('show');
}

function updateScore() {
  scoreValue.textContent = String(score);
  scoreValue.classList.remove('pop');
  void scoreValue.offsetWidth;
  scoreValue.classList.add('pop');
}

function startGame() {
  state = STATE.RUNNING;
  score = 0;
  runSpeed = RUN_START;
  jumpT = -1;
  landTimer = 0;
  nextCakeAt = 0.5;
  resetCakes();
  scoreValue.textContent = '0';
  showOverlay('hide');
}

function gameOver() {
  state = STATE.OVER;
  jumpT = -1;
  landTimer = 0.18;
  showOverlay('over');
}

function addScore() {
  score++;
  runSpeed = Math.min(RUN_MAX, RUN_START + score * 0.12);
  updateScore();
}

/* ------------------------------------------------------------------
   입력 — SPACE / 클릭 / 탭
------------------------------------------------------------------ */
function action() {
  if (state === STATE.READY || state === STATE.OVER) {
    startGame();
    return;
  }
  if (jumpT < 0) {
    jumpT = 0;
    landTimer = 0;
  }
}

window.addEventListener('keydown', (e) => {
  const isSpace = e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar';
  if (!isSpace) return;
  e.preventDefault();
  if (e.repeat) return;
  action();
}, { passive: false });

// 캔버스에 포커스를 주어 키 입력을 확실히 받도록
canvas.addEventListener('focus', () => {});
window.addEventListener('load', () => { try { window.focus(); } catch {} });

let dragging = false;
let moved = false;
let lastX = 0, lastY = 0;

canvas.addEventListener('pointerdown', (e) => {
  try { canvas.focus(); } catch {}
  dragging = true;
  moved = false;
  lastX = e.clientX;
  lastY = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch {}
});

canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  if (!moved && Math.hypot(dx, dy) > 6) moved = true;
  if (moved) {
    yaw -= dx * 0.006;
    pitch = THREE.MathUtils.clamp(pitch - dy * 0.004, 0.16, 1.12);
  }
  lastX = e.clientX;
  lastY = e.clientY;
});

function endPointer(e) {
  if (dragging && !moved) action();   // 짧은 탭 = 점프
  dragging = false;
  if (canvas.hasPointerCapture?.(e.pointerId)) {
    try { canvas.releasePointerCapture(e.pointerId); } catch {}
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', () => { dragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = THREE.MathUtils.clamp(dist * (1 + e.deltaY * 0.0012), 8, 22);
}, { passive: false });

/* ------------------------------------------------------------------
   업데이트
------------------------------------------------------------------ */
function updateTiger(dt) {
  const p = tiger.root.position;

  if (state === STATE.RUNNING) {
    p.z -= runSpeed * dt;
    runPhase += dt * (6 + runSpeed * 1.15);
  }

  // 점프 진행
  let air = 0;
  if (jumpT >= 0) {
    jumpT += dt;
    const k = jumpT / JUMP_TIME;
    if (k >= 1) {
      jumpT = -1;
      landTimer = 0.15;
    } else {
      air = Math.sin(Math.PI * k);
    }
  }
  p.y = PATH_TOP + air * JUMP_HEIGHT;

  // 스쿼시 & 스트레치
  let sy = 1, sxz = 1;
  if (air > 0) {
    sy = 1 + 0.07 * air;
    sxz = 1 - 0.035 * air;
  }
  if (landTimer > 0) {
    landTimer = Math.max(0, landTimer - dt);
    const k = landTimer / 0.15;
    sy = 1 - 0.10 * k;
    sxz = 1 + 0.06 * k;
  }
  tiger.rig.scale.set(sxz, sy, sxz);

  const { fl, fr, bl, br } = tiger.legs;

  if (air > 0) {
    // 공중: 다리 접기
    tiger.rig.position.y = 0;
    tiger.rig.rotation.x = -0.14 * air;
    fl.rotation.x = fr.rotation.x = -0.85 * air;
    bl.rotation.x = br.rotation.x = 0.75 * air;
    tiger.head.rotation.x = -0.10 * air;
    tiger.tail.rotation.x = -0.35 * air;
    tiger.tail.rotation.y = 0.85 + 0.15 * Math.sin(elapsed * 8);
  } else if (state === STATE.RUNNING) {
    // 달리기: 앞뒤 교차 스윙
    const s = Math.sin(runPhase);
    const c = Math.cos(runPhase);
    tiger.rig.position.y = Math.abs(s) * 0.06;
    tiger.rig.rotation.x = -0.045;
    fl.rotation.x = 0.62 * s;
    br.rotation.x = 0.62 * s;
    fr.rotation.x = -0.62 * s;
    bl.rotation.x = -0.62 * s;
    tiger.head.rotation.x = 0.035 * c;
    tiger.tail.rotation.x = -0.06 + 0.08 * c;
    tiger.tail.rotation.y = 0.85 + 0.22 * Math.sin(runPhase * 0.5 + elapsed);
  } else {
    // 대기 / 게임오버
    tiger.rig.position.y = Math.sin(elapsed * 2.1) * 0.015;
    tiger.rig.rotation.x = 0;
    fl.rotation.x = fr.rotation.x = 0;
    bl.rotation.x = br.rotation.x = 0;
    tiger.head.rotation.x = 0.04 * Math.sin(elapsed * 2.0);
    tiger.tail.rotation.x = 0;
    tiger.tail.rotation.y = 0.42 + 0.18 * Math.sin(elapsed * 2.4);
  }
}

function updateCakes(dt) {
  const tz = tiger.root.position.z;

  if (state === STATE.RUNNING) {
    nextCakeAt -= dt;
    if (nextCakeAt <= 0) {
      spawnCake();
      const gap = Math.max(1.15, 2.1 - score * 0.045);
      nextCakeAt = gap + Math.random() * 0.35;
    }
  }

  for (const c of cakes) {
    if (!c.active) continue;

    if (c.falling) {
      c.vy -= CAKE_GRAVITY * dt;
      c.body.position.y += c.vy * dt;
      c.body.rotation.y += dt * 1.4;
      c.body.rotation.z = Math.sin(c.body.position.y * 0.7) * 0.10;

      if (c.body.position.y <= 0) {
        c.body.position.y = 0;
        c.body.rotation.z = 0;
        c.falling = false;
        c.bounce = 1;
      }
    } else if (c.bounce > 0) {
      c.bounce = Math.max(0, c.bounce - dt * 5.5);
      const k = c.bounce;
      c.model.scale.set(
        CAKE_SCALE * (1 + 0.14 * k),
        CAKE_SCALE * (1 - 0.22 * k),
        CAKE_SCALE * (1 + 0.14 * k)
      );
    }

    // 착지 지점 그림자
    const h = c.body.position.y;
    const k = 1 - Math.min(h / CAKE_FALL_HEIGHT, 1);
    c.shadow.material.opacity = 0.04 + 0.15 * k;
    c.shadow.scale.setScalar(0.42 + 0.58 * k);

    // 충돌: 땅에 있을 때만
    const grounded = (tiger.root.position.y - PATH_TOP) < CAKE_HIT_HEIGHT;
    if (state === STATE.RUNNING && !c.hit && !c.falling && grounded) {
      const dz = Math.abs(c.root.position.z - tz);
      const dx = Math.abs(c.root.position.x - tiger.root.position.x);
      if (dz < CAKE_HIT_DEPTH && dx < 1.05) {
        c.hit = true;
        c.bounce = 1;
        gameOver();
      }
    }

    // 넘어간 떡 점수
    if (!c.hit && !c.passed && c.root.position.z > tz + 1.0) {
      c.passed = true;
      if (state === STATE.RUNNING) addScore();
    }

    // 뒤로 멀어지면 풀로 반납
    if (c.root.position.z > tz + 8 || (!c.falling && c.root.position.z > tz + 4)) {
      c.active = false;
      c.root.visible = false;
    }
  }
}

function updateWorld(tz) {
  for (const r of recyclables) {
    if (r.obj.position.z > tz + BEHIND) {
      r.obj.position.z -= WORLD_SPAN;
      placeRandom(r.obj, r.kind);
    }
  }
  for (const tile of pathTiles) {
    if (tile.position.z > tz + BEHIND) {
      tile.position.z -= PATH_COUNT * PATH_TILE_LEN;
    }
  }
  ground.position.z = Math.round(tz / 20) * 20;
  ground.position.x = Math.round(tiger.root.position.x / 20) * 20;

  sun.position.set(11, 20, tz + 9);
  sun.target.position.set(0, 0, tz);
}

/* ------------------------------------------------------------------
   메인 루프
------------------------------------------------------------------ */
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  updateTiger(dt);
  updateCakes(dt);
  updateWorld(tiger.root.position.z);
  updateCamera(dt);

  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------
   리사이즈 · 시작
------------------------------------------------------------------ */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(animate);
showOverlay('ready');

window.__tigerReady = true;
document.getElementById('loader').classList.add('hide');
</script>
