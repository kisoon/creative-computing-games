<!doctype html><html lang="ko"><head><script src="../../../../runtime/ml5-support.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>엘사 필터 · 신체 인식 실험</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js" defer></script><script src="filter.js" defer></script></head><body><main><header><p class="eyebrow">BODY · FACE · HAND / ICE FILTER</p><h1>엘사 필터</h1><p>손·얼굴·몸의 움직임으로 눈과 얼음을 만들어 보세요.</p><p class="note">제출된 기획 MD의 13가지 효과를 실행할 수 있도록 보완한 버전입니다.</p></header><section class="stage"><canvas id="stage" width="960" height="540" aria-label="카메라 영상 위에 눈과 얼음 효과를 표시하는 화면"></canvas><span id="mode">카메라 꺼짐</span></section><div class="toolbar"><button id="camera">카메라 시작</button><button id="stop" disabled>카메라 끄기</button><button id="demo">동작 없이 미리보기</button><button id="reset">효과 초기화</button></div><p id="status" role="status">카메라를 켜거나 아래 효과 버튼으로 미리 볼 수 있어요.</p><section aria-labelledby="effects-title"><h2 id="effects-title">효과 미리보기</h2><div id="effects" class="effects"></div><p class="note">손 펴기·주먹, 입 벌리기·눈 감기, 팔 들기·점프·걷기 등은 카메라에서 직접 인식합니다. 모델은 처음 실행할 때 내려받습니다. 영상은 이 브라우저에서만 처리합니다.</p></section></main></body></html>
