<!doctype html>
<html lang="ko">
<head><script src="../../../../runtime/ml5-support.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>움직임이 남는 거울</title>

  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #f8f5fc;
      color: #2d223f;
      font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic",
        "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.7;
      word-break: keep-all;
    }
    main { width: min(680px, calc(100% - 32px)); margin: 24px auto; }
    h1 { line-height: 1.2; }
    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      border-radius: 12px;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    button {
      min-height: 44px;
      padding: 6px 12px;
      border: 1px solid #dacbe7;
      border-radius: 8px;
      background: white;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible { outline: 2px solid #704ca7; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>움직임이 남는 거울</h1>
    <p>검지 끝을 천천히 움직이면 잉크가 넓게 번지고, 빠르게 움직이면 가는 선이 남아요.</p>

    <div id="stage"></div>

    <div class="controls">
      <button id="test" disabled>테스트 선 그리기</button>
      <button id="start" disabled>카메라 시작</button>
      <button id="stop" disabled>카메라 끄기</button>
      <button id="toggle" disabled>영상 숨기기</button>
      <button id="clear" disabled>잉크 지우기</button>
      <button id="save" disabled>잉크만 PNG 저장</button>
    </div>

    <p id="status" role="status">그리기 화면을 준비하는 중…</p>
  </main>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const W = 640;
      const H = 480;
      const $ = id => document.getElementById(id);
      const setStatus = text => {
        if ($("status").textContent !== text) $("status").textContent = text;
      };

      if (!window.p5) {
        setStatus("p5.js를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 실행해 주세요.");
        return;
      }

      // 잉크 전용 캔버스에는 카메라 영상을 그리지 않아요.
      const ink = document.createElement("canvas");
      ink.width = W;
      ink.height = H;
      const pen = ink.getContext("2d");
      pen.lineCap = "round";

      let stream = null;
      let video = null;
      let modelPromise = null;
      let pendingDetection = null;
      let runId = 0;
      let frameId = 0;
      let showVideo = true;
      let tip = null;
      let anchor = null;
      let lastSeen = 0;

      new window.p5(p => {
        p.setup = () => {
          p.pixelDensity(1);
          const canvas = p.createCanvas(W, H);
          canvas.elt.setAttribute("aria-label", "카메라 영상과 잉크 그림");
          $("test").disabled = false;
          $("start").disabled = false;
          setStatus("테스트 선을 그려 보거나 카메라를 시작해 주세요.");
        };

        p.draw = () => {
          p.background(27, 19, 43);
          const ctx = p.drawingContext;

          if (showVideo && video?.readyState >= 2) {
            ctx.save();
            ctx.translate(W, 0);
            ctx.scale(-1, 1);
            ctx.globalAlpha = 0.42;
            ctx.drawImage(video, 0, 0, W, H);
            ctx.restore();
          }

          ctx.drawImage(ink, 0, 0);

          // 검지가 감지되면 위치를 흰 원으로 표시해요. PNG에는 들어가지 않아요.
          if (showVideo && tip) {
            ctx.beginPath();
            ctx.arc(tip.x, tip.y, 6, 0, Math.PI * 2);
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = "white";
            ctx.stroke();
          }
        };
      }, $("stage"));

      function enableInkButtons() {
        $("clear").disabled = false;
        $("save").disabled = false;
      }

      function drawLine(x0, y0, x1, y1, speed) {
        const spread = 1 - Math.max(0, Math.min(1, (speed - 35) / 500));

        pen.beginPath();
        pen.moveTo(x0, y0);
        pen.lineTo(x1, y1);

        for (const [width, alpha] of [
          [4 + 22 * spread, 0.14 * spread],
          [2 + 12 * spread, 0.25 * spread],
          [2 + 5 * spread, 0.96]
        ]) {
          pen.lineWidth = width;
          pen.strokeStyle = `rgba(204, 157, 255, ${alpha})`;
          pen.stroke();
        }

        enableInkButtons();
      }

      function paintTip(x, y) {
        const now = performance.now();
        const distance = anchor ? Math.hypot(x - anchor.x, y - anchor.y) : 0;

        // 첫 감지이거나 손 위치가 크게 뛰면 이전 선에 연결하지 않아요.
        if (!anchor || now - lastSeen > 700 || distance > 170) {
          pen.beginPath();
          pen.arc(x, y, 3, 0, Math.PI * 2);
          pen.fillStyle = "#cc9dff";
          pen.fill();
          anchor = { x, y, time: now, speed: null };
          enableInkButtons();
        } else if (distance >= 2) {
          const rawSpeed = distance * 1000 / Math.max(16, now - anchor.time);
          const speed = anchor.speed === null
            ? rawSpeed
            : anchor.speed * 0.45 + rawSpeed * 0.55;

          drawLine(anchor.x, anchor.y, x, y, speed);
          anchor = { x, y, time: now, speed };
        }

        lastSeen = now;
      }

      function stopCamera(message) {
        runId++;
        cancelAnimationFrame(frameId);
        stream?.getTracks().forEach(track => track.stop());
        if (video) video.srcObject = null;

        stream = null;
        video = null;
        tip = null;
        anchor = null;

        $("start").disabled = false;
        $("stop").disabled = true;
        $("toggle").disabled = true;
        if (message) setStatus(message);
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("카메라를 쓰려면 HTTPS로 열린 실행 화면이 필요해요.");
          return;
        }
        if (!window.ml5?.handPose) {
          setStatus("ml5를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
          return;
        }

        const id = ++runId;
        $("start").disabled = true;
        $("stop").disabled = false;
        setStatus("브라우저에서 카메라 사용을 허용해 주세요…");

        let phase = "camera";

        try {
          const media = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: "user",
              width: { ideal: W },
              height: { ideal: H }
            }
          });

          if (id !== runId) {
            media.getTracks().forEach(track => track.stop());
            return;
          }

          stream = media;
          const input = document.createElement("video");
          input.muted = true;
          input.playsInline = true;
          input.srcObject = media;
          video = input;

          await input.play();
          if (id !== runId) return;

          showVideo = true;
          $("toggle").textContent = "영상 숨기기";
          $("toggle").disabled = false;

          phase = "model";
          setStatus("손 추적 모델을 불러오는 중…");

          if (!modelPromise) {
            modelPromise = Promise.resolve(window.ml5.handPose({
              runtime: "mediapipe",
              solutionPath: "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240",
              maxHands: 1,
              modelType: "lite",
              flipped: false
            })).then(async model => {
              await model.ready;
              return model;
            }).catch(error => {
              modelPromise = null;
              throw error;
            });
          }

          const model = await modelPromise;
          if (pendingDetection) await pendingDetection.catch(() => {});
          if (id !== runId) return;

          setStatus("손바닥과 손가락 전체를 화면에 보여 주세요.");

          async function detectNext() {
            if (id !== runId) return;

            try {
              pendingDetection = window.Ml5Runtime.detect(model, input);
              const [hand] = await pendingDetection;
              if (id !== runId) return;

              // 손 관절 번호 8은 검지 끝이에요.
              const point = hand?.keypoints?.[8] ?? hand?.index_finger_tip;

              if (Number.isFinite(point?.x) && Number.isFinite(point?.y)
                  && input.videoWidth && input.videoHeight) {
                // 카메라 영상과 똑같이 좌우를 뒤집어요.
                const x = W * (1 - point.x / input.videoWidth);
                const y = H * point.y / input.videoHeight;
                tip = x >= 0 && x <= W && y >= 0 && y <= H ? { x, y } : null;
              } else {
                tip = null;
              }

              if (tip) {
                paintTip(tip.x, tip.y);
                setStatus("검지 끝을 따라 그리고 있어요.");
              } else {
                anchor = null;
                setStatus(hand
                  ? "손은 감지했지만 검지 위치를 읽지 못했어요. 손 전체를 화면 안에 보여 주세요."
                  : "손을 찾는 중이에요. 손바닥과 손가락 전체를 화면에 보여 주세요.");
              }

              frameId = requestAnimationFrame(detectNext);
            } catch (error) {
              if (id !== runId) return;
              console.error(error);
              stopCamera("손 추적이 멈췄어요. 카메라를 다시 켜 주세요.");
            }
          }

          detectNext();
        } catch (error) {
          if (id !== runId) return;
          console.error(error);

          if (phase === "model") {
            stopCamera("손 추적 모델을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
          } else if (error.name === "NotAllowedError") {
            stopCamera("카메라 권한이 차단됐어요. 권한을 허용하거나 실행 화면을 새 탭에서 열어 주세요.");
          } else if (error.name === "NotFoundError") {
            stopCamera("연결된 카메라를 찾지 못했어요.");
          } else {
            stopCamera("카메라를 열지 못했어요. 다른 앱에서 사용 중인지 확인해 주세요.");
          }
        }
      }

      $("test").onclick = () => {
        drawLine(80, 120, 240, 120, 60);
        setStatus("보라색 테스트 선을 그렸어요.");
      };

      $("start").onclick = startCamera;
      $("stop").onclick = () => stopCamera("카메라가 꺼져 있어요.");

      $("toggle").onclick = () => {
        showVideo = !showVideo;
        $("toggle").textContent = showVideo ? "영상 숨기기" : "영상 보이기";
      };

      $("clear").onclick = () => {
        if (!window.confirm("지금까지 그린 잉크를 모두 지울까요?")) return;
        pen.clearRect(0, 0, W, H);
        $("clear").disabled = true;
        $("save").disabled = true;
      };

      $("save").onclick = () => {
        const link = document.createElement("a");
        link.download = "movement-mirror.png";
        link.href = ink.toDataURL("image/png");
        link.click();
      };

      window.addEventListener("pagehide", () => stopCamera());
    });
  </script>
</body>
</html>
