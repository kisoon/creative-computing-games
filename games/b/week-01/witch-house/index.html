<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마녀의 과자집 · 2인 협동 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 12%,#533566 0%,#2c1836 55%,#1a0e21 100%);
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    color:#4a2b3d;overflow:hidden;user-select:none;
  }
  #wrap{
    position:relative;
    width:min(96vw,1080px,calc(92vh * 1.6129));
    aspect-ratio:1000/620;
    border-radius:26px;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.06);
    overflow:hidden;
    background:#ffd9ea;
  }
  canvas{display:block;width:100%;height:100%}
  #mute{
    position:absolute;top:12px;right:12px;z-index:30;
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.82);font-size:19px;line-height:1;
    box-shadow:0 4px 12px rgba(80,30,60,.25);transition:transform .15s;
  }
  #mute:hover{transform:scale(1.08)}

  #overlay{
    position:absolute;inset:0;z-index:20;display:none;
    align-items:center;justify-content:center;padding:3%;
    background:radial-gradient(circle at 50% 45%,rgba(46,20,54,.35),rgba(24,10,30,.78));
    backdrop-filter:blur(3px);
  }
  #overlay.show{display:flex;animation:fadeIn .28s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .panel{
    width:min(720px,100%);max-height:96%;overflow:auto;
    background:linear-gradient(180deg,#fffaf3,#ffeef6);
    border-radius:30px;padding:26px 30px 24px;
    border:4px solid #fff;
    box-shadow:0 24px 60px rgba(40,10,40,.45),inset 0 0 0 3px #ffd0e2;
    text-align:center;animation:pop .32s cubic-bezier(.2,1.5,.4,1);
    scrollbar-width:thin;
  }
  @keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  .panel h1{
    margin:2px 0 2px;font-size:clamp(28px,4.6vw,46px);letter-spacing:-1px;
    color:#e03e77;text-shadow:0 3px 0 #ffd0e2,0 6px 14px rgba(224,62,119,.28);
  }
  .panel h2{margin:0 0 6px;font-size:clamp(24px,4vw,38px);color:#e03e77}
  .sub{margin:0 0 14px;font-size:clamp(12px,1.7vw,16px);color:#a06a86}
  .rules{display:flex;flex-direction:column;gap:7px;margin:0 0 14px}
  .rule{
    display:flex;align-items:center;gap:10px;text-align:left;
    background:#fff;border-radius:14px;padding:9px 14px;
    font-size:clamp(12px,1.65vw,15px);color:#6b4560;
    box-shadow:0 3px 0 #ffe1ec;
  }
  .rule span{font-size:clamp(16px,2.2vw,21px);flex:0 0 auto}
  .rule b{color:#e03e77}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .ctrl{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 #ffe1ec}
  .ctrl .who{
    display:inline-block;font-size:12px;color:#fff;border-radius:999px;
    padding:2px 12px;margin-bottom:6px;letter-spacing:1px;
  }
  .ctrl.p1 .who{background:#ff7aa8}
  .ctrl.p2 .who{background:#3fbf9a}
  .ctrl .keys{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font-size:clamp(10px,1.4vw,13px);color:#8a5f79}
  kbd{
    display:inline-block;min-width:22px;padding:2px 5px;border-radius:6px;
    background:#f4e6ef;border:1px solid #e7cfe0;border-bottom-width:3px;
    font-family:inherit;font-size:.92em;color:#7a4a63;line-height:1.35;
  }
  kbd.wide{padding:2px 9px;background:#ffe3ee;border-color:#ffc2d8;color:#d63b70}
  .btn{
    font-family:inherit;font-size:clamp(17px,2.4vw,23px);
    padding:12px 46px;border-radius:999px;border:none;cursor:pointer;
    color:#fff;background:linear-gradient(180deg,#ff8fb8,#e83b76);
    box-shadow:0 6px 0 #b82458,0 12px 26px rgba(232,59,118,.4);
    transition:transform .1s,box-shadow .1s;letter-spacing:1px;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #b82458,0 16px 30px rgba(232,59,118,.45)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b82458}
  .tip{margin:12px 0 0;font-size:clamp(10px,1.4vw,13px);color:#a5879a;line-height:1.5}
  .tip b{color:#e03e77}

  .resultScore{
    font-size:clamp(44px,7vw,72px);color:#e03e77;line-height:1;
    text-shadow:0 4px 0 #ffd0e2;margin:6px 0 2px;
  }
  .resultScore small{font-size:.36em;color:#b58aa4;margin-left:4px}
  .stats{display:flex;gap:10px;justify-content:center;margin:14px 0 16px;flex-wrap:wrap}
  .stat{background:#fff;border-radius:14px;padding:8px 18px;box-shadow:0 3px 0 #ffe1ec;min-width:96px}
  .stat b{display:block;font-size:20px;color:#7a4a63}
  .stat span{font-size:11px;color:#b58aa4}
  .newBest{display:inline-block;background:#ffe066;color:#8a5a00;border-radius:999px;padding:3px 14px;font-size:12px;margin-bottom:8px;animation:pulse 1s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

  .diffs{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:6px 0 14px}
  .diffBtn{
    font-family:inherit;cursor:pointer;padding:10px 8px 9px;
    display:flex;flex-direction:column;align-items:center;gap:1px;
    background:linear-gradient(180deg,#fff,#fff5fa);
    border:3px solid #ffd0e2;border-radius:18px;
    box-shadow:0 4px 0 #ffe1ec;
    transition:transform .12s,box-shadow .12s,border-color .12s,background .12s;
  }
  .diffBtn:hover{transform:translateY(-3px);border-color:#ff9ec4;box-shadow:0 7px 0 #ffd0e2}
  .diffBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #ffe1ec}
  .diffBtn .dEmoji{font-size:clamp(22px,3.2vw,30px);line-height:1.05}
  .diffBtn b{font-size:clamp(16px,2.2vw,21px);color:#e03e77;letter-spacing:.5px}
  .diffBtn small{font-size:clamp(10px,1.35vw,12px);color:#a06a86;line-height:1.3}
  .diffBtn em{
    font-style:normal;font-size:11px;color:#8a5a00;background:#ffe066;
    border-radius:999px;padding:1px 10px;margin-top:4px;
  }
  .diffBtn.hard{border-color:#e6c6ff;background:linear-gradient(180deg,#fff,#f8f1ff);box-shadow:0 4px 0 #ecdcff}
  .diffBtn.hard b{color:#8a4bd6}
  .diffBtn.hard em{background:#e3ccff;color:#5a2a8a}
  .diffBtn.hard:hover{border-color:#b98cf0;box-shadow:0 7px 0 #e3ccff}
  .diffBtn.first{animation:pulse 1.1s infinite alternate}

  .scoreRow{display:flex;justify-content:center;gap:22px;font-size:12px;color:#b58aa4;margin:-4px 0 10px}
  .scoreRow b{color:#e03e77;font-size:15px}
  .btnRow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn.ghost{
    background:linear-gradient(180deg,#fff,#f7e8f1);color:#b03e72;
    box-shadow:0 6px 0 #eccfdd,0 10px 20px rgba(176,62,114,.18);
    font-size:clamp(14px,2vw,18px);padding:12px 30px;
  }
  .btn.ghost:hover{box-shadow:0 8px 0 #eccfdd,0 14px 24px rgba(176,62,114,.2)}
  .btn.ghost:active{box-shadow:0 2px 0 #eccfdd}
  .endingTag{
    display:inline-block;font-size:12px;border-radius:999px;padding:3px 14px;
    margin-bottom:6px;letter-spacing:.5px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <button id="mute" title="소리 켜기/끄기">🔊</button>
  <div id="overlay"><div class="panel" id="panel"></div></div>
</div>
<script>
/* ============================================================
   마녀의 과자집 — 2인 협동 잠입 디저트 대작전
   ============================================================ */
'use strict';

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 1000, H = 620;
const FLOOR_Y = 482;
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
cvs.width = W * DPR;
cvs.height = H * DPR;
ctx.scale(DPR, DPR);

const F = (size, weight) => `${weight || 700} ${size}px Jua, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif`;

/* ---------- 작은 유틸 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); }
function rrPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function star(cx, cy, r, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 ? r * 0.45 : r;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function heart(cx, cy, s, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-8, -3, -8, -10, -3.5, -10);
  ctx.bezierCurveTo(-1.5, -10, 0, -8.4, 0, -7);
  ctx.bezierCurveTo(0, -8.4, 1.5, -10, 3.5, -10);
  ctx.bezierCurveTo(8, -10, 8, -3, 0, 4);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* ---------- 사운드 (WebAudio) ---------- */
let actx = null, muted = false;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, delay, slide) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.1, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
const sfx = {
  eat(combo) {
    tone(combo ? 780 : 660, 0.09, 'triangle', 0.11);
    tone(combo ? 1180 : 990, 0.13, 'triangle', 0.09, 0.07);
    if (combo) tone(1480, 0.16, 'sine', 0.07, 0.14);
  },
  alert() { tone(920, 0.1, 'square', 0.06); tone(700, 0.13, 'square', 0.06, 0.11); },
  safe() { tone(520, 0.09, 'sine', 0.06); tone(780, 0.11, 'sine', 0.06, 0.08); },
  caught() {
    tone(320, 0.5, 'sawtooth', 0.13, 0, 70);
    tone(180, 0.6, 'square', 0.07, 0.06, 50);
  },
  tick() { tone(620, 0.09, 'sine', 0.08); },
  go() { tone(880, 0.16, 'triangle', 0.11); tone(1320, 0.22, 'triangle', 0.09, 0.1); },
  end() {
    [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.09, i * 0.11));
  },
  best() {
    [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.2, 'sine', 0.08, i * 0.09));
  },
  page() { tone(420, 0.07, 'triangle', 0.05); tone(620, 0.08, 'triangle', 0.04, 0.05); },
  chomp() {
    tone(150, 0.18, 'square', 0.16, 0, 60);
    tone(90, 0.3, 'sawtooth', 0.1, 0.09, 45);
    tone(1200, 0.05, 'square', 0.05, 0.02, 300);
  },
  splash() {
    tone(700, 0.28, 'sine', 0.1, 0, 140);
    tone(380, 0.34, 'triangle', 0.09, 0.05, 90);
    tone(160, 0.4, 'sine', 0.08, 0.16, 60);
  },
  win() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.26, 'triangle', 0.09, i * 0.1));
    [1046, 1318, 1568].forEach((f, i) => tone(f, 0.3, 'sine', 0.06, 0.5 + i * 0.1));
  }
};

/* ---------- 입력 ---------- */
const keys = new Set();
const BLOCK = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'Slash'];
const P1KEYS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', eat: ['Enter', 'NumpadEnter', 'Slash', 'ShiftRight'] };
const P2KEYS = { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', eat: ['Space', 'ShiftLeft'] };

window.addEventListener('keydown', e => {
  initAudio();
  if (BLOCK.indexOf(e.code) >= 0) e.preventDefault();
  keys.add(e.code);
  if ((e.code === 'Enter' || e.code === 'Space' || e.code === 'NumpadEnter') && !e.repeat) {
    const ready = performance.now() - overlayShownAt > 650;
    if (G.mode === 'title' && ready) {
      const focused = document.activeElement;
      if (!(focused && focused.dataset && focused.dataset.act)) beginRun(G.diff, true);
    } else if (G.mode === 'over' && ready) {
      beginRun(G.diff, false);
    } else if (G.mode === 'story') {
      advanceStory();
    } else if (G.mode === 'ending' && G.endingT > 0.55) {
      showResult(G.ending);
    }
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

/* ---------- 게임 상태 ---------- */
const BOUNDS = { x1: 218, x2: 948, y1: 505, y2: 598 };
const ROUND_TIME = 30;
const EAT_RANGE = 74;

const DIFFS = {
  easy: {
    key: 'easy', name: '쉬움', emoji: '🌱',
    away: [3.4, 2.5], watch: [1.4, 1.9], warn: [1.0, 0.8],
    candies: 8, cake: [8, 12], cakeChew: 2.0
  },
  hard: {
    key: 'hard', name: '어려움', emoji: '🔥',
    away: [2.4, 1.5], watch: [2.0, 2.9], warn: [0.6, 0.42],
    candies: 6, cake: [12, 17], cakeChew: 2.4
  }
};

const G = {
  mode: 'title',
  diff: 'easy',
  time: ROUND_TIME,
  score: 0,
  showScore: 0,
  eaten: 0,
  countdown: 0,
  shake: 0,
  flash: 0,
  caughtBy: null,
  caughtTimer: 0,
  cakeTimer: 9,
  lastCount: -1,
  best: 0,
  newBest: false,
  bannerPulse: 0,
  storyT: 0,
  storyBeat: -1,
  ending: null,
  endingT: 0,
  endingFlag: false,
  endingReason: ''
};
const DIFF = () => DIFFS[G.diff] || DIFFS.easy;

function bestKey(d) { return 'witchCandyBest_' + d; }
function readBest(d) {
  try { return Number(localStorage.getItem(bestKey(d))) || 0; } catch (e) { return 0; }
}
function saveBest(d, v) {
  try { localStorage.setItem(bestKey(d), String(v)); } catch (e) {}
}

const witch = { phase: 'away', t: 3.0, warnDur: 0.75, faceShake: 0 };
let players = [];
let candies = [];
let particles = [];
let floats = [];
let uid = 0;
let overlayShownAt = 0;

/* ---------- 과자 ---------- */
const CANDY_TYPES = [
  { kind: 'gum',     name: '구미젤리',   pts: 10, chew: 0.62, color: '#ff8fb1', w: 22 },
  { kind: 'cane',    name: '캔디케인',   pts: 15, chew: 0.68, color: '#ff5f7e', w: 20 },
  { kind: 'lolli',   name: '롤리팝',     pts: 20, chew: 0.76, color: '#a97bff', w: 18 },
  { kind: 'donut',   name: '도넛',       pts: 20, chew: 0.76, color: '#ffb35c', w: 16 },
  { kind: 'choco',   name: '초콜릿',     pts: 25, chew: 0.86, color: '#8b5a3c', w: 14 },
  { kind: 'macaron', name: '마카롱',     pts: 30, chew: 0.96, color: '#ff9ad5', w: 10 }
];
const CAKE = { kind: 'cake', name: '생일케이크', pts: 80, chew: 2.0, color: '#ffe0ee', w: 0 };

function weightedCandy() {
  let total = 0;
  for (const c of CANDY_TYPES) total += c.w;
  let r = Math.random() * total;
  for (const c of CANDY_TYPES) { r -= c.w; if (r <= 0) return c; }
  return CANDY_TYPES[0];
}

function spawnCandy(forceCake) {
  const isCake = !!forceCake;
  let x = 0, y = 0, ok = false;
  for (let tries = 0; tries < 80 && !ok; tries++) {
    x = rand(BOUNDS.x1 + 14, BOUNDS.x2 - 14);
    y = rand(BOUNDS.y1 + 6, BOUNDS.y2 - 4);
    ok = true;
    for (const c of candies) {
      if (Math.hypot(c.x - x, (c.y - y) * 1.6) < (isCake ? 150 : 86)) { ok = false; break; }
    }
  }
  const type = isCake ? CAKE : weightedCandy();
  candies.push({
    id: ++uid, x, y, kind: type.kind, color: type.color, pts: type.pts,
    chewTime: isCake ? DIFF().cakeChew : type.chew, name: type.name,
    pop: 0, dead: false, hintT: 0,
    wobble: rand(0, Math.PI * 2)
  });
}

function makePlayer(id) {
  return {
    id,
    x: id === 1 ? 400 : 660,
    y: 566,
    vx: 0, vy: 0,
    face: id === 1 ? 1 : -1,
    speed: 292,
    chew: 0, chewCandy: null, target: null,
    color: id === 1 ? '#ff7aa8' : '#3fbf9a',
    colorDark: id === 1 ? '#d63b70' : '#23967a',
    caught: false,
    hatAnim: 0,
    eatKeys: id === 1 ? P1KEYS.eat : P2KEYS.eat,
    keys: id === 1 ? P1KEYS : P2KEYS
  };
}

function resetGame() {
  const d = DIFF();
  G.time = ROUND_TIME;
  G.score = 0;
  G.showScore = 0;
  G.eaten = 0;
  G.shake = 0;
  G.flash = 0;
  G.caughtBy = null;
  G.caughtTimer = 0;
  G.cakeTimer = rand(d.cake[0], d.cake[1]);
  G.newBest = false;
  G.lastCount = -1;
  G.best = readBest(G.diff);
  witch.phase = 'away';
  witch.t = d.away[0] + 0.7;
  witch.warnDur = d.warn[0];
  keys.clear();
  players = [makePlayer(1), makePlayer(2)];
  players[1].x = 660;
  candies = [];
  particles = [];
  floats = [];
  for (let i = 0; i < d.candies; i++) spawnCandy();
}

function startGame() {
  initAudio();
  resetGame();
  G.mode = 'countdown';
  G.countdown = 3.0;
  hideOverlay();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  sfx.tick();
}

function startStory() {
  initAudio();
  hideOverlay();
  G.mode = 'story';
  G.storyT = 0;
  G.storyBeat = -1;
  keys.clear();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}

function beginRun(diff, withStory) {
  G.diff = diff;
  G.best = readBest(diff);
  if (withStory) startStory();
  else startGame();
}

/* ---------- 상태 도우미 ---------- */
function isWarn() {
  return G.mode === 'playing' && witch.t > 0 && witch.t <= witch.warnDur;
}
function isWatching() { return witch.phase === 'watch'; }
function playerHolding(p) { return p.eatKeys.some(k => keys.has(k)); }

function nearestCandy(p) {
  let best = null, bd = 1e9;
  for (const c of candies) {
    if (c.dead) continue;
    const d = Math.hypot(c.x - p.x, (c.y - p.y) * 1.15);
    if (d < EAT_RANGE && d < bd) { bd = d; best = c; }
  }
  return best;
}

/* ---------- 파티클 / 플로팅 텍스트 ---------- */
function burst(x, y, n, colors, power) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const sp = rand(40, power || 150);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: rand(0.4, 0.9), max: 0.9, size: rand(2.5, 5.5),
      color: pick(colors), rot: rand(0, 6.28), spin: rand(-8, 8), g: 420, shape: Math.random() < 0.35 ? 'star' : 'dot'
    });
  }
}
function addFloat(x, y, text, color, life) {
  floats.push({ x, y, text, color, life: life || 1.0, max: life || 1.0, vy: -46 });
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
    if (p.y > 610) { p.y = 610; p.vy *= -0.35; p.vx *= 0.7; }
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt;
    if (f.life <= 0) { floats.splice(i, 1); continue; }
    f.y += f.vy * dt;
    f.vy *= Math.pow(0.2, dt);
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    if (p.shape === 'star') star(0, 0, p.size * 1.5, p.color);
    else { circle(0, 0, p.size); ctx.fill(); }
    ctx.restore();
  }
}

function drawFloats() {
  for (const f of floats) {
    const a = clamp(f.life / f.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = F(20);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 5;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }
}

/* ============================================================
   업데이트
   ============================================================ */
function update(dt, t) {
  G.shake = Math.max(0, G.shake - dt * 55);
  G.flash = Math.max(0, G.flash - dt * 2.2);
  updateParticles(dt);
  G.showScore = lerp(G.showScore, G.score, 1 - Math.exp(-11 * dt));

  if (G.mode === 'title') { idleWitch(dt); idlePlayers(dt); updateCandyPop(dt); return; }

  if (G.mode === 'countdown') {
    const prev = Math.ceil(G.countdown);
    G.countdown -= dt;
    const nowC = Math.ceil(G.countdown);
    if (nowC !== prev && nowC > 0) sfx.tick();
    idlePlayers(dt);
    updateCandyPop(dt);
    if (G.countdown <= 0) { G.mode = 'playing'; sfx.go(); G.shake = 8; }
    return;
  }

  if (G.mode === 'playing') {
    G.time -= dt;
    if (G.time <= 0) { G.time = 0; endRound('time'); return; }
    updateWitch(dt);
    if (G.mode !== 'playing') return;
    updatePlayers(dt);
    updateEating(dt);
    if (G.mode !== 'playing') return;
    updateCandies(dt);
    return;
  }

  if (G.mode === 'caught') {
    G.caughtTimer -= dt;
    if (G.caughtBy) {
      G.caughtBy.vx *= Math.pow(0.05, dt);
      G.caughtBy.vy *= Math.pow(0.05, dt);
    }
    if (G.caughtTimer <= 0) startEnding('eaten', 'caught');
    return;
  }

  if (G.mode === 'story') { updateStory(dt); return; }

  if (G.mode === 'ending') { updateEnding(dt); return; }

  if (G.mode === 'over') { idleWitch(dt); idlePlayers(dt); updateCandyPop(dt); }
}

function updateCandyPop(dt) {
  for (const c of candies) c.pop = Math.min(1, c.pop + dt * 3.6);
}

function idleWitch(dt) {
  witch.t -= dt;
  if (witch.t <= 0) {
    if (witch.phase === 'away') { witch.phase = 'watch'; witch.t = 1.9; }
    else { witch.phase = 'away'; witch.t = 2.4; }
  }
}

function idlePlayers(dt) {
  for (const p of players) {
    p.vx *= Math.pow(0.02, dt);
    p.vy *= Math.pow(0.02, dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function updateWitch(dt) {
  const prog = clamp(1 - G.time / ROUND_TIME, 0, 1);
  const d = DIFF();
  witch.warnDur = lerp(d.warn[0], d.warn[1], prog);
  witch.t -= dt;
  if (witch.t > 0) return;

  if (witch.phase === 'away') {
    witch.phase = 'watch';
    witch.t = lerp(d.watch[0], d.watch[1], prog);
    sfx.alert();
    G.shake = Math.max(G.shake, 5);
  } else {
    witch.phase = 'away';
    witch.t = lerp(d.away[0], d.away[1], prog);
    sfx.safe();
  }
}

function updatePlayers(dt) {
  for (const p of players) {
    if (p.caught) continue;
    const k = p.keys;
    let dx = (keys.has(k.right) ? 1 : 0) - (keys.has(k.left) ? 1 : 0);
    let dy = (keys.has(k.down) ? 1 : 0) - (keys.has(k.up) ? 1 : 0);
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    const s = 1 - Math.exp(-15 * dt);
    p.vx = lerp(p.vx, dx * p.speed, s);
    p.vy = lerp(p.vy, dy * p.speed * 0.62, s);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.x < BOUNDS.x1) { p.x = BOUNDS.x1; p.vx = 0; }
    if (p.x > BOUNDS.x2) { p.x = BOUNDS.x2; p.vx = 0; }
    if (p.y < BOUNDS.y1) { p.y = BOUNDS.y1; p.vy = 0; }
    if (p.y > BOUNDS.y2) { p.y = BOUNDS.y2; p.vy = 0; }
    if (Math.abs(p.vx) > 14) p.face = p.vx > 0 ? 1 : -1;
    p.hatAnim = lerp(p.hatAnim, Math.min(1, Math.hypot(p.vx, p.vy) / p.speed), 1 - Math.exp(-10 * dt));
  }
  const a = players[0], b = players[1];
  if (!a || !b || a.caught || b.caught) return;
  const dx = b.x - a.x, dy = (b.y - a.y) * 2.2;
  const d = Math.hypot(dx, dy);
  if (d < 48 && d > 0.001) {
    const push = (48 - d) / 2, nx = dx / d, ny = dy / d;
    a.x -= nx * push; b.x += nx * push;
    a.y -= ny * push * 0.3; b.y += ny * push * 0.3;
    for (const p of players) {
      p.x = clamp(p.x, BOUNDS.x1, BOUNDS.x2);
      p.y = clamp(p.y, BOUNDS.y1, BOUNDS.y2);
    }
  }
}

function updateEating(dt) {
  // 목표 갱신
  for (const p of players) {
    if (p.caught) { p.target = null; p.holding = false; continue; }
    p.target = nearestCandy(p);
    p.holding = playerHolding(p);
    if (p.chewCandy && p.chewCandy.dead) { p.chewCandy = null; p.chew = 0; }
  }

  // 마녀가 보는 중에 과자 앞에서 먹기 키를 누르면 즉시 발각
  if (isWatching()) {
    for (const p of players) {
      if (!p.caught && p.holding && p.target) { catchPlayer(p); return; }
    }
  }

  // 케이크: 반드시 두 명이 함께 먹어야 함
  for (const c of candies) {
    if (c.dead || c.kind !== 'cake') continue;
    const engaged = players.filter(p =>
      !p.caught && p.holding &&
      (p.chewCandy === c || p.target === c) &&
      Math.hypot(c.x - p.x, (c.y - p.y) * 1.15) < EAT_RANGE + 20
    );
    if (engaged.length >= 2) {
      c.progress = Math.min(1, (c.progress || 0) + dt / c.chewTime);
      for (const p of engaged) { p.chewCandy = c; p.chew = c.progress; }
      if (Math.random() < dt * 16) {
        burst(c.x + rand(-22, 22), c.y - 70, 1, ['#ffe066', '#fff', '#ffb3d1'], 70);
      }
      if (c.progress >= 1) eatCandy(engaged[0], c, true);
    } else if (engaged.length === 1) {
      const p = engaged[0];
      p.chewCandy = c;
      p.chew = Math.max(0, p.chew - dt * 3);
      if (!(c.hintT > 0)) {
        addFloat(c.x, c.y - 122, '둘이 함께 먹어야 해!', '#ff8a00', 1.0);
        c.hintT = 1.5;
      }
    }
  }

  // 일반 과자
  for (const p of players) {
    if (p.caught) continue;

    if (p.chewCandy && p.chewCandy.kind === 'cake') {
      const c = p.chewCandy;
      const still = p.holding && !c.dead &&
        Math.hypot(c.x - p.x, (c.y - p.y) * 1.15) < EAT_RANGE + 20;
      if (!still) {
        p.chew = Math.max(0, p.chew - dt * 3);
        if (p.chew <= 0) { p.chew = 0; p.chewCandy = null; }
      }
      continue;
    }

    let c = null;
    if (p.chewCandy && !p.chewCandy.dead &&
        Math.hypot(p.chewCandy.x - p.x, (p.chewCandy.y - p.y) * 1.15) < EAT_RANGE + 18) {
      c = p.chewCandy;
    } else if (p.target && p.target.kind !== 'cake') {
      c = p.target;
    }

    if (p.holding && c) {
      if (p.chewCandy !== c) { p.chewCandy = c; p.chew = 0; }
      const partner = players.find(q => q !== p && q.chewCandy === c && q.chew > 0.03 && !q.caught);
      p.chew += dt * (partner ? 2 : 1) / c.chewTime;
      if (Math.random() < dt * 9) burst(p.x + (c.x - p.x) * 0.4, p.y - 46, 1, [c.color, '#fff8ec'], 40);
      if (p.chew >= 1) eatCandy(p, c, !!partner);
    } else {
      p.chew = Math.max(0, p.chew - dt * 2.2);
      if (p.chew <= 0) { p.chew = 0; p.chewCandy = null; }
    }
  }

  for (const c of candies) if (c.hintT > 0) c.hintT -= dt;
}

function eatCandy(p, c, combo) {
  c.dead = true;
  const pts = Math.round(c.pts * (combo ? 1.5 : 1));
  G.score += pts;
  G.eaten++;
  if (c.kind === 'cake') G.cakeTimer = rand(DIFF().cake[0], DIFF().cake[1]);
  p.chew = 0;
  p.chewCandy = null;
  addFloat(c.x, c.y - (c.kind === 'cake' ? 118 : 82), '+' + pts, combo ? '#ff9f1c' : '#e5487a', 1.1);
  if (combo) addFloat(c.x, c.y - (c.kind === 'cake' ? 150 : 112), c.kind === 'cake' ? '함께 냠냠!' : '더블 냠냠!', '#ff5f9e', 1.4);
  burst(c.x, c.y - 26, combo ? 22 : 14,
    ['#ffd166', '#ff8fb1', '#ffffff', c.color, '#a97bff'], combo ? 210 : 150);
  sfx.eat(combo);
  G.shake = Math.max(G.shake, combo ? 7 : 3);
}

function updateCandies(dt) {
  const d = DIFF();
  for (let i = candies.length - 1; i >= 0; i--) {
    const c = candies[i];
    c.pop = Math.min(1, c.pop + dt * 3.6);
    if (c.dead) candies.splice(i, 1);
  }
  let normal = 0, hasCake = false;
  for (const c of candies) { if (c.kind === 'cake') hasCake = true; else normal++; }
  let guard = 0;
  while (normal < d.candies && guard++ < 12) { spawnCandy(); normal++; }
  G.cakeTimer -= dt;
  if (!hasCake && G.cakeTimer <= 0) {
    spawnCandy(true);
    G.cakeTimer = rand(d.cake[0], d.cake[1]);
  }
}

function catchPlayer(p) {
  if (G.mode !== 'playing') return;
  G.mode = 'caught';
  G.caughtBy = p;
  G.caughtTimer = 1.5;
  G.shake = 26;
  G.flash = 1;
  p.caught = true;
  p.chew = 0;
  p.chewCandy = null;
  keys.clear();
  addFloat(p.x, p.y - 132, '들켰다!', '#ff2d55', 1.6);
  burst(p.x, p.y - 46, 22, ['#ff2d55', '#ffffff', '#ffd166'], 210);
  sfx.caught();
}

function endRound(reason) {
  if (G.mode === 'over' || G.mode === 'ending') return;
  keys.clear();
  if (G.score >= 400) startEnding('cauldron', reason);
  else if (G.score >= 201) startEnding('success', reason);
  else startEnding('eaten', reason);
}

/* ---------- 엔딩 연출 ---------- */
function endingDuration(kind) {
  return kind === 'eaten' ? 4.8 : kind === 'cauldron' ? 4.6 : 3.8;
}

function startEnding(kind, reason) {
  G.mode = 'ending';
  G.ending = kind;
  G.endingT = 0;
  G.endingFlag = false;
  G.endingReason = reason || 'time';
  G.shake = kind === 'eaten' ? 24 : kind === 'cauldron' ? 18 : 8;
  G.flash = 0;
  hideOverlay();
  keys.clear();
  if (kind === 'cauldron') sfx.splash();
  else if (kind === 'success') sfx.win();
}

function updateEnding(dt) {
  G.endingT += dt;
  if (!G.endingFlag) {
    if (G.ending === 'eaten' && G.endingT > 1.85) {
      G.endingFlag = true; G.shake = 26; G.flash = 0.9; sfx.chomp();
    } else if (G.ending === 'cauldron' && G.endingT > 1.55) {
      G.endingFlag = true; G.shake = 22; G.flash = 0.6; sfx.splash();
    } else if (G.ending === 'success' && G.endingT > 0.7) {
      G.endingFlag = true;
    }
  }
  if (G.endingT >= endingDuration(G.ending)) showResult(G.ending);
}

/* ---------- 스토리 컷만화 ---------- */
const STORY_BEATS = [
  { dur: 1.9, tag: 'PANEL 1', title: '숲 속 깊은 곳', caption: '달콤한 냄새가 흘러나오는 마녀의 과자집.', art: 'house' },
  { dur: 1.8, tag: 'PANEL 2', title: '마녀의 비밀', caption: '마녀는 밤마다 커다란 솥에 마법 과자를 끓여요.', art: 'witch' },
  { dur: 1.9, tag: 'PANEL 3', title: '몰래 온 손님', caption: '배고픈 진저브레드 남매, 몰래 창문을 열었어요!', art: 'peek' },
  { dur: 2.1, tag: 'PANEL 4', title: '작전 시작!', caption: '마녀가 뒤를 돌 때만 먹고, 30초 안에 도망치자!', art: 'rule' }
];

function storyStartTime(i) {
  let a = 0;
  for (let k = 0; k < i; k++) a += STORY_BEATS[k].dur;
  return a;
}

function storyBeatAt(tt) {
  let a = 0;
  for (let i = 0; i < STORY_BEATS.length; i++) {
    a += STORY_BEATS[i].dur;
    if (tt < a) return i;
  }
  return STORY_BEATS.length;
}

function advanceStory() {
  if (G.mode !== 'story') return;
  const b = storyBeatAt(G.storyT);
  if (b >= STORY_BEATS.length - 1) { startGame(); return; }
  G.storyT = storyStartTime(b + 1) + 0.001;
  G.storyBeat = b + 1;
  sfx.page();
}

function updateStory(dt) {
  G.storyT += dt;
  const b = storyBeatAt(G.storyT);
  if (b !== G.storyBeat) {
    if (b >= STORY_BEATS.length) { startGame(); return; }
    if (G.storyBeat >= 0) sfx.page();
    G.storyBeat = b;
  }
}

/* ============================================================
   그리기 — 과자집 배경
   ============================================================ */
function drawRoom(t) {
  // 벽
  let g = ctx.createLinearGradient(0, 0, 0, FLOOR_Y);
  g.addColorStop(0, '#ffe9f5');
  g.addColorStop(0.55, '#ffd9ea');
  g.addColorStop(1, '#ffc7de');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, FLOOR_Y);

  // 벽지 세로 줄
  ctx.fillStyle = 'rgba(255,255,255,.36)';
  for (let x = 0; x < W; x += 86) ctx.fillRect(x, 0, 36, FLOOR_Y);

  // 벽지 물방울무늬
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (let y = 26; y < FLOOR_Y - 20; y += 86) {
    const off = (Math.floor(y / 86) % 2) * 43;
    for (let x = 20; x < W; x += 86) {

  }

  // 바닥

  ctx.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);

  ctx.strokeStyle = 'rgba(120,70,40,.16)';
  ctx.lineWidth = 2;
  for (let y = FLOOR_Y + 30; y < H; y += 32) line(0, y, W, y);
  for (let y = FLOOR_Y; y < H; y += 32) {
    const off = (Math.floor((y - FLOOR_Y) / 32) % 2) * 110;
    for (let x = off; x < W; x += 220) line(x, y, x, y + 32);
  }

  // 러그
  ctx.save();
  ctx.translate(600, 562);
  ctx.fillStyle = 'rgba(120,60,110,.10)';
  ell(6, 8, 322, 60); ctx.fill();
  ctx.fillStyle = '#b980c9';
  ell(0, 0, 318, 58); ctx.fill();
  ctx.fillStyle = '#d59be6';
  ell(0, 0, 292, 49); ctx.fill();
  ctx.fillStyle = '#f0c2fb';
  ell(0, 0, 262, 40); ctx.fill();
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.75)';
  ctx.lineWidth = 3;
  ctx.setLineDash([13, 11]);
  ctx.lineDashOffset = -t * 22;
  ell(0, 0, 292, 49); ctx.stroke();
  ctx.restore();
  ctx.restore();

  // 걸레받이
  ctx.fillStyle = '#fff5e9';
  ctx.fillRect(0, FLOOR_Y - 18, W, 20);
  ctx.fillStyle = '#f3d9c4';
  ctx.fillRect(0, FLOOR_Y + 1, W, 5);

  drawWindow(t);
  drawShelf(t);

}

function drawWindow(t) {
  const cx = 796, cy = 176, w = 188, h = 148;

  // 커튼 (뒤)
  ctx.fillStyle = '#ffb6d2';
  ctx.beginPath();
  ctx.moveTo(cx - w / 2 - 40, cy - h / 2 - 26);
  ctx.quadraticCurveTo(cx - w / 2 - 12, cy, cx - w / 2 - 30, cy + h / 2 + 30);
  ctx.lineTo(cx - w / 2 + 6, cy + h / 2 + 26);
  ctx.quadraticCurveTo(cx - w / 2 + 10, cy, cx - w / 2 + 2, cy - h / 2 - 26);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + w / 2 + 40, cy - h / 2 - 26);
  ctx.quadraticCurveTo(cx + w / 2 + 12, cy, cx + w / 2 + 30, cy + h / 2 + 30);
  ctx.lineTo(cx + w / 2 - 6, cy + h / 2 + 26);
  ctx.quadraticCurveTo(cx + w / 2 - 10, cy, cx + w / 2 - 2, cy - h / 2 - 26);
  ctx.closePath(); ctx.fill();

  // 창틀
  ctx.fillStyle = '#fff7ec';
  rrPath(cx - w / 2 - 14, cy - h / 2 - 14, w + 28, h + 28, 22);
  ctx.fill();
  ctx.fillStyle = '#f6e3cf';
  rrPath(cx - w / 2 - 14, cy - h / 2 - 14, w + 28, h + 28, 22);
  ctx.fill();

  // 밤하늘
  const g = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
  g.addColorStop(0, '#2c2a5e');
  g.addColorStop(0.65, '#4b3a80');
  g.addColorStop(1, '#7a5aa8');
  ctx.fillStyle = g;
  rrPath(cx - w / 2, cy - h / 2, w, h, 14);
  ctx.fill();

  ctx.save();
  rrPath(cx - w / 2, cy - h / 2, w, h, 14);
  ctx.clip();

  // 별
  for (let i = 0; i < 26; i++) {
    const sx = cx - w / 2 + ((i * 71) % w);
    const sy = cy - h / 2 + ((i * 53) % h);
    const tw = 0.5 + 0.5 * Math.sin(t * 2.2 + i * 1.7);
    ctx.fillStyle = `rgba(255,246,205,${0.35 + 0.55 * tw})`;
    circle(sx, sy, 1.3 + tw * 1.3); ctx.fill();
  }
  // 달
  ctx.fillStyle = '#fff1bb';
  circle(cx + 44, cy - 34, 27); ctx.fill();
  ctx.fillStyle = 'rgba(226,203,140,.55)';
  circle(cx + 34, cy - 42, 6); ctx.fill();
  circle(cx + 55, cy - 22, 4.5); ctx.fill();
  circle(cx + 51, cy - 45, 3); ctx.fill();

  // 멀리 보이는 과자 언덕
  ctx.fillStyle = '#5a4a92';
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, cy + h / 2);
  ctx.quadraticCurveTo(cx - 40, cy + 6, cx + 10, cy + h / 2);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6a59a4';
  ctx.beginPath();
  ctx.moveTo(cx - 20, cy + h / 2);
  ctx.quadraticCurveTo(cx + 50, cy + 20, cx + w / 2, cy + h / 2);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // 창살
  ctx.fillStyle = '#fff7ec';
  ctx.fillRect(cx - 3, cy - h / 2, 6, h);

  ctx.quadraticCurveTo(cx + w / 2 + 4, cy - 20, cx + w / 2 + 2, cy - h / 2 - 22);

}

function drawCauldron(t) {
  const x = 46, y = 556;
  // 불
  for (let i = 0; i < 3; i++) {
    const fx = x - 16 + i * 16;
    const fh = 12 + Math.sin(t * 9 + i * 2) * 6;
    ctx.fillStyle = i % 2 ? '#ffb03a' : '#ff6b3d';
    ctx.beginPath();
    ctx.moveTo(fx - 7, y + 6);
    ctx.quadraticCurveTo(fx - 5, y - fh, fx, y - fh - 6);
    ctx.quadraticCurveTo(fx + 5, y - fh, fx + 7, y + 6);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#4a3f52';
  ell(x, y + 4, 40, 12); ctx.fill();
  // 냄비 몸통
  const g = ctx.createLinearGradient(x - 40, 0, x + 40, 0);
  g.addColorStop(0, '#2c2534');
  g.addColorStop(0.5, '#4a3f56');
  g.addColorStop(1, '#251f2c');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 38, y - 44);
  ctx.quadraticCurveTo(x - 34, y + 2, x, y + 2);
  ctx.quadraticCurveTo(x + 34, y + 2, x + 38, y - 44);
  ctx.closePath(); ctx.fill();
  // 마법 물약
  ctx.fillStyle = '#8ef2b8';
  ell(x, y - 46, 34, 11); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  circle(x - 12, y - 48, 3.2); ctx.fill();
  circle(x + 9, y - 44, 2.4); ctx.fill();
  // 테두리
  ctx.fillStyle = '#5f5468';
  ell(x, y - 46, 38, 11); ctx.fill();
  ctx.fillStyle = '#8ef2b8';
  ell(x, y - 46, 31, 8); ctx.fill();
  // 거품
  for (let i = 0; i < 3; i++) {
    const bt = (t * 0.7 + i * 0.33) % 1;
    ctx.fillStyle = `rgba(160,255,205,${1 - bt})`;
    circle(x - 14 + i * 13 + Math.sin(t * 2 + i) * 4, y - 62 - bt * 26, 3 + bt * 3);
    ctx.fill();
  }
  // 손잡이
  ctx.strokeStyle = '#6a5f75';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(x, y - 30, 44, Math.PI * 1.15, Math.PI * 1.85);
  ctx.stroke();
}

function drawWitch(t) {

  ctx.strokeStyle = 'rgba(214,182,150,.6)';

function drawWitchBadge(t, away, warn) {
  const bx = 0, by = -204;
  const pulse = 0.5 + 0.5 * Math.sin(t * (warn ? 16 : 4));
  let color = away ? '#2fbf90' : '#ff3b6b';
  if (warn) color = '#ff1744';

  ctx.save();
  ctx.translate(bx, by);
  const s = warn ? 1 + pulse * 0.18 : 1;
  ctx.scale(s, s);
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  circle(0, 0, 17); ctx.fill();
  ctx.fillStyle = color;
  circle(0, 0, 14); ctx.fill();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (warn) {
    ctx.fillStyle = '#fff';
    ctx.font = F(20);
    ctx.fillText('!', 0, 1);
  } else if (away) {
    ctx.fillStyle = '#fff';
    ctx.font = F(17);
    ctx.fillText('♪', 0, 1);
  } else {
    // 눈 아이콘
    ctx.fillStyle = '#fff';
    ell(0, 0, 8, 5.5); ctx.fill();
    ctx.fillStyle = '#7a1030';
    circle(0, 0, 2.8); ctx.fill();
  }
  ctx.restore();
}

/* ============================================================
   그리기 — 과자
   ============================================================ */
function drawCandies(t) {
  for (const c of candies) {
    if (c.pop <= 0 || c.dead) continue;
    const sc = easeOutBack(clamp(c.pop, 0, 1));
    const safe = G.mode !== 'playing' || witch.phase === 'away';
    const pulse = 0.5 + 0.5 * Math.sin(t * 4 + c.wobble);
    const cake = c.kind === 'cake';
    const high = cake || c.pts >= 25;
    const bump = cake ? 1.15 : c.pts >= 25 ? 1.07 : 1;

    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.fillStyle = safe
      ? `rgba(120,255,190,${0.13 + 0.10 * pulse})`
      : 'rgba(255,120,150,0.09)';
    ell(0, 0, cake ? 48 : 36, cake ? 15 : 12); ctx.fill();
    ctx.fillStyle = 'rgba(90,50,80,.16)';
    ell(0, 2, (cake ? 31 : 23) * sc, (cake ? 9 : 7) * sc); ctx.fill();

    // 고득점 과자 / 케이크의 황금빛 아우라
    if (high) {
      const gl = 0.5 + 0.5 * Math.sin(t * 5.5 + c.wobble);
      const R = cake ? 98 : 62;
      const grad = ctx.createRadialGradient(0, -38, 6, 0, -38, R);
      grad.addColorStop(0, cake
        ? `rgba(255,230,120,${0.30 + 0.20 * gl})`
        : `rgba(255,255,255,${0.20 + 0.14 * gl})`);
      grad.addColorStop(0.55, cake
        ? `rgba(255,196,80,${0.14 + 0.12 * gl})`
        : `rgba(255,240,180,${0.08 + 0.08 * gl})`);
      grad.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = grad;
      circle(0, -38, R); ctx.fill();
    }

    // 반짝반짝
    if (high) {
      const n = cake ? 5 : 3;
      for (let i = 0; i < n; i++) {
        const a = t * (cake ? 0.9 : 1.4) + i * (Math.PI * 2 / n) + c.wobble;
        const rr = cake ? 58 : 40;
        const sx = Math.cos(a) * rr;
        const sy = -38 + Math.sin(a) * (cake ? 46 : 30);
        const tw = 0.5 + 0.5 * Math.sin(t * 7 + i * 1.7 + c.wobble);
        ctx.save();
        ctx.globalAlpha = 0.25 + 0.7 * tw;
        star(sx, sy, (cake ? 5.5 : 3.6) * (0.6 + 0.7 * tw),
          i % 2 ? '#fff8d6' : (cake ? '#ffe066' : '#ffffff'));
        ctx.restore();
      }
    }

    ctx.scale(sc * bump, sc * bump);
    ctx.translate(0, Math.sin(t * 2.4 + c.wobble) * 1.4);
    drawCandyBody(c, t);
    ctx.restore();

    // 케이크 안내 라벨
    if (cake) {
      const bob = Math.sin(t * 3 + c.wobble) * 2;
      ctx.save();
      ctx.translate(c.x, c.y - 120 + bob);
      ctx.fillStyle = 'rgba(255,190,60,.95)';
      rrPath(-48, -13, 96, 26, 13); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 2;
      rrPath(-48, -13, 96, 26, 13); ctx.stroke();
      ctx.fillStyle = '#7a4a00';
      ctx.font = F(15);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('함께 먹기!', 0, 1);
      ctx.restore();
    }
  }
}

function drawCandyBody(c, t) {
  const col = c.color;
  switch (c.kind) {
    case 'gum': {
      const g = ctx.createLinearGradient(0, -34, 0, 0);
      g.addColorStop(0, '#ffc2d8'); g.addColorStop(0.5, col); g.addColorStop(1, '#e0598a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-20, 0);
      ctx.bezierCurveTo(-25, -26, -11, -35, 0, -35);
      ctx.bezierCurveTo(11, -35, 25, -26, 20, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      for (let i = 0; i < 9; i++) {
        circle(-12 + (i * 7) % 24, -8 - Math.floor(i / 3) * 8, 1.5);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ell(-7, -22, 5, 3, -0.5); ctx.fill();
      break;
    }
    case 'cane': {
      ctx.strokeStyle = '#fff7f0';
      ctx.lineWidth = 15;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(10, -42);
      ctx.arc(0, -42, 10, 0, Math.PI, true);
      ctx.lineTo(-10, -20);
      ctx.stroke();
      ctx.strokeStyle = col;
      ctx.lineWidth = 9.5;
      ctx.stroke();
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.92)';
      ctx.lineWidth = 9.5;
      ctx.setLineDash([4, 7]);
      ctx.stroke();
      ctx.restore();
      break;
    }
    case 'lolli': {
      ctx.strokeStyle = '#f6e7d4';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      line(0, -2, 0, -30);
      const cy = -48, r = 19;
      ctx.fillStyle = '#fff8f0';
      circle(0, cy, r + 2.5); ctx.fill();
      ctx.fillStyle = col;
      circle(0, cy, r); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      for (let a = 0; a < Math.PI * 4.2; a += 0.12) {
        const rr = Math.min(a * 1.55, r - 3);
        const px = Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ell(-7, cy - 7, 5, 3, -0.6); ctx.fill();
      break;
    }

/* ============================================================
   HUD & 연출
   ============================================================ */
function statusText() {
  if (G.mode !== 'playing' && G.mode !== 'countdown') return null;
  const warn = isWarn();
  if (witch.phase === 'away') {
    if (warn) return { text: '⚠  마녀가 돌아봅니다!', color: '#fff', bg: '#ff3b6b', border: '#ffb3c6', danger: true };
    return { text: '♪  지금 먹어요! 마녀가 뒤를 돌고 있어요', color: '#0f7a56', bg: 'rgba(216,255,239,.95)', border: '#79e0bc', danger: false };
  }
  if (warn) return { text: '마녀가 다시 돌아갑니다…', color: '#0f7a56', bg: 'rgba(216,255,239,.95)', border: '#79e0bc', danger: false };
  return { text: '👀  마녀가 보고 있어요! 멈춰요!', color: '#fff', bg: '#ff3b6b', border: '#ffb3c6', danger: true };
}

function drawHUD(t) {
  if (G.mode === 'title' || G.mode === 'story' || G.mode === 'ending') return;

  // 난이도 칩
  const d = DIFF();
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  rrPath(246, 18, 84, 32, 16); ctx.fill();
  ctx.fillStyle = G.diff === 'easy' ? '#0f7a56' : '#8a4bd6';
  ctx.font = F(14);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(`${d.emoji} ${d.name}`, 288, 35);
  ctx.restore();

  // 점수 패널
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  rrPath(18, 16, 216, 66, 22); ctx.fill();
  ctx.save();
  ctx.translate(46, 64);
  ctx.strokeStyle = '#f0dcc4'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  line(0, 0, 0, -12);
  ctx.fillStyle = '#ff8fb1'; circle(0, -25, 13); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -25, 8, -0.5, 3.2); ctx.stroke();
  ctx.restore();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#a87a95'; ctx.font = F(14);
  ctx.fillText('점수', 72, 40);
  ctx.fillStyle = '#e5487a'; ctx.font = F(30);
  ctx.fillText(String(Math.round(G.showScore)), 72, 62);
  ctx.restore();

  // 타이머 패널
  const tx = 340, ty = 16, tw = 320, th = 66;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  rrPath(tx, ty, tw, th, 22); ctx.fill();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#a87a95'; ctx.font = F(14);
  ctx.fillText('남은 시간', tx + 22, ty + 24);
  const secs = G.time;
  const urgent = secs <= 5.5;
  ctx.textAlign = 'right';
  ctx.fillStyle = urgent ? '#ff2d55' : '#7a4a63';
  ctx.font = F(urgent ? 31 + Math.sin(t * 14) * 2 : 30);
  ctx.fillText(secs.toFixed(1), tx + tw - 22, ty + 26);
  const bx = tx + 22, by = ty + th - 20, bw = tw - 44;
  ctx.fillStyle = 'rgba(160,110,140,.16)';
  rrPath(bx, by, bw, 10, 5); ctx.fill();
  const frac = clamp(secs / ROUND_TIME, 0, 1);
  ctx.fillStyle = secs > 12 ? '#4ed6a0' : secs > 6 ? '#ffb703' : '#ff3b6b';
  if (frac > 0.01) { rrPath(bx, by, Math.max(11, bw * frac), 10, 5); ctx.fill(); }
  ctx.restore();

  // 상태 배너
  const info = statusText();
  if (info) {
    ctx.save();
    ctx.font = F(19);
    const bw2 = ctx.measureText(info.text).width + 62;
    const pulse = info.danger ? 1 + Math.sin(t * 10) * 0.025 : 1;
    ctx.translate(500, 118);
    ctx.scale(pulse, pulse);
    ctx.fillStyle = info.bg;
    rrPath(-bw2 / 2, -20, bw2, 40, 20); ctx.fill();
    ctx.strokeStyle = info.border; ctx.lineWidth = 2.5;
    rrPath(-bw2 / 2, -20, bw2, 40, 20); ctx.stroke();
    ctx.fillStyle = info.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(info.text, 0, 1);
    ctx.restore();
  }
}

function drawVignette(t) {
  let a = 0;
  if (G.mode === 'playing') {
    if (witch.phase === 'watch') a = 0.22 + Math.sin(t * 5) * 0.03;
    else if (isWarn()) a = 0.16 + Math.sin(t * 22) * 0.10;
  } else if (G.mode === 'caught') {
    a = 0.32;
  }
  if (a <= 0.002) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.2, W / 2, H / 2, H * 0.92);
  g.addColorStop(0, 'rgba(255,30,70,0)');
  g.addColorStop(1, `rgba(255,30,70,${a})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawCountdown(t) {
  const n = Math.ceil(G.countdown);
  const frac = G.countdown - Math.floor(G.countdown);
  const sc = 1 + Math.sin(clamp(frac, 0, 1) * Math.PI) * 0.22;

  ctx.save();
  ctx.fillStyle = 'rgba(50,12,50,.32)';
  ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, H / 2 - 34);
  ctx.scale(sc, sc);
  ctx.font = F(150);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 20;
  ctx.strokeStyle = '#fff';
  ctx.strokeText(String(n), 0, 0);
  ctx.fillStyle = '#e5487a';
  ctx.fillText(String(n), 0, 0);
  ctx.restore();

  ctx.save();
  ctx.font = F(24);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(90,30,70,.55)';
  ctx.strokeText('마녀 몰래 먹을 준비…!', W / 2, H / 2 + 78);
  ctx.fillStyle = '#fff';
  ctx.fillText('마녀 몰래 먹을 준비…!', W / 2, H / 2 + 78);
  ctx.restore();
}

function drawCaughtBanner(t) {
  const el = 1.8 - G.caughtTimer;
  const p = clamp(el / 0.4, 0, 1);
  const sc = 0.4 + easeOutBack(p) * 0.6;

  ctx.save();
  ctx.fillStyle = `rgba(60,0,25,${Math.min(0.42, el * 1.4)})`;
  ctx.fillRect(0, 0, W, H);

  ctx.translate(W / 2, H / 2 - 26);
  ctx.rotate(Math.sin(el * 22) * 0.015 * (1 - p));
  ctx.scale(sc, sc);
  ctx.font = F(84);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 18;
  ctx.strokeStyle = '#fff';
  ctx.strokeText('잡았다!', 0, 0);
  ctx.fillStyle = '#ff2d55';
  ctx.fillText('잡았다!', 0, 0);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = clamp(el / 0.7, 0, 1);
  ctx.font = F(24);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 8;
  ctx.strokeStyle = 'rgba(100,0,35,.65)';
  const msg = G.caughtBy ? `${G.caughtBy.id}P가 마녀와 눈이 마주쳤어요!` : '마녀에게 들켰어요!';
  ctx.strokeText(msg, W / 2, H / 2 + 62);
  ctx.fillStyle = '#fff';
  ctx.fillText(msg, W / 2, H / 2 + 62);
  ctx.restore();
}

  ctx.fillStyle = '#ff8fb1';

  ctx.fillStyle = '#c96a8e';
  rrPath(bx + 70, by - 290, 44, 70, 8); ctx.fill();
  ctx.fillStyle = '#fff6ee';
  rrPath(bx + 64, by - 296, 56, 16, 8); ctx.fill();

  ctx.fillStyle = '#ffd166';

  for (const wx of [bx - 88, bx + 88]) {
    ctx.fillStyle = '#ffe066';
    rrPath(wx - 26, by - 128, 52, 52, 8); ctx.fill();
    ctx.strokeStyle = '#ff9ec4'; ctx.lineWidth = 4;
    rrPath(wx - 26, by - 128, 52, 52, 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, by - 128); ctx.lineTo(wx, by - 76); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx - 26, by - 102); ctx.lineTo(wx + 26, by - 102); ctx.stroke();
  }

  for (const cx of [bx - 120, bx + 120]) {
    ctx.strokeStyle = '#fff7f0'; ctx.lineWidth = 13; ctx.lineCap = 'round';

    ctx.strokeStyle = '#ff5f7e'; ctx.lineWidth = 8;

    star(150 + i * 130, 180 + (i % 3) * 60, 2.5 + (i % 2) * 1.5, '#fff8d6');
    ctx.restore();

}

function drawStory(t) {
  const g = ctx.createRadialGradient(500, 280, 100, 500, 300, 760);
  g.addColorStop(0, '#3b2050');
  g.addColorStop(1, '#160a1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.05)';

    for (let x = 20; x < W; x += 26) { circle(x, y, 1.5); ctx.fill(); }
  }

  const b = clamp(storyBeatAt(G.storyT), 0, STORY_BEATS.length - 1);
  const beat = STORY_BEATS[b];
  const bp = clamp((G.storyT - storyStartTime(b)) / 0.35, 0, 1);
  const ease = 1 - Math.pow(1 - bp, 3);
  const px = 80, py = 46, pw = 840, ph = 470;

  ctx.save();
  ctx.globalAlpha = 0.15 + 0.85 * ease;
  ctx.translate((1 - ease) * 90, 0);
  ctx.fillStyle = 'rgba(0,0,0,.45)';

  rrPath(px, py, pw, ph, 26); ctx.fill();
  ctx.save();
  rrPath(px + 9, py + 9, pw - 18, ph - 18, 20); ctx.clip();
  if (beat.art === 'house') drawStoryHouse(t);
  else if (beat.art === 'witch') drawStoryWitchScene(t);
  else if (beat.art === 'peek') drawStoryPeek(t);
  else drawStoryRule(t);
  ctx.restore();
  ctx.strokeStyle = '#2a1530'; ctx.lineWidth = 8;
  rrPath(px, py, pw, ph, 26); ctx.stroke();
  ctx.restore();

  // 캡션 리본
  ctx.save();
  ctx.translate(500, 522);
  ctx.fillStyle = 'rgba(42,21,48,.96)';
  rrPath(-380, -28, 760, 58, 18); ctx.fill();
  ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3;

  ctx.fillStyle = '#fff';
  ctx.font = F(19);
  ctx.fillText(beat.caption, -352, 11);
  ctx.restore();

  // 진행 점
  for (let i = 0; i < STORY_BEATS.length; i++) {
    const active = i === b;

    circle(500 - (STORY_BEATS.length - 1) * 15 + i * 30, 578, active ? 6.5 : 4.5);
    ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = 0.4 + 0.3 * Math.sin(t * 4);
  ctx.fillStyle = '#fff';
  ctx.font = F(14);
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText('클릭 / Enter 로 넘기기  →', 918, 602);

function endingBackdrop(kind, t) {
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 80, W / 2, H * 0.42, H * 0.95);
  if (kind === 'eaten') { g.addColorStop(0, '#4a1c3e'); g.addColorStop(1, '#1b0a16'); }
  else if (kind === 'success') { g.addColorStop(0, '#4a2c68'); g.addColorStop(1, '#1d0e2a'); }
  else { g.addColorStop(0, '#3a1a52'); g.addColorStop(1, '#160a20'); }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 46; i++) {
    const x = (i * 137.5) % W;
    const y = (i * 83.3) % H;
    ctx.globalAlpha = 0.12 + 0.14 * (0.5 + 0.5 * Math.sin(t * 2.6 + i));
    ctx.fillStyle = '#fff';
    circle(x, y, 1.5); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawEndingSkip(t) {
  if (G.endingT < 0.55) return;
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 4);
  ctx.fillStyle = '#fff';
  ctx.font = F(14);
  ctx.textAlign = 'left';

  ctx.fillText('클릭 / Enter 로 건너뛰기', 28, H - 22);
  ctx.restore();
}

function drawEnding(t) {
  ctx.save();
  if (G.shake > 0.2) ctx.translate(rand(-1, 1) * G.shake * 0.6, rand(-1, 1) * G.shake * 0.6);
  endingBackdrop(G.ending, t);
  if (G.ending === 'eaten') drawEndingEaten(t);
  else if (G.ending === 'success') drawEndingSuccess(t);
  else drawEndingCauldron(t);
  ctx.restore();
  drawEndingSkip(t);
}

function drawEndingEaten(t) {
  if (G.endingT < 1.85) drawEatenMouth(t);
  else drawEatenBelly(t);
}

function drawEatenMouth(t) {
  const chompAt = 1.85;
  const u = clamp(t / chompAt, 0, 1);
  const s = 0.82 + 0.62 * u;
  const closing = clamp((G.endingT - (chompAt - 0.42)) / 0.42, 0, 1);
  const open = Math.max(0.04, (0.4 + 0.6 * clamp(u * 1.7, 0, 1)) * (1 - closing));

  ctx.save();
  ctx.translate(500, 330);
  ctx.scale(s, s);

  ctx.fillStyle = '#3f2a6b';
  ell(0, -188, 245, 42); ctx.fill();
  const hg = ctx.createLinearGradient(-120, -360, 120, -160);
  hg.addColorStop(0, '#8b66d0'); hg.addColorStop(1, '#4e3486');
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(-150, -190);
  ctx.quadraticCurveTo(-130, -350, 30, -352);
  ctx.quadraticCurveTo(-40, -300, 150, -188);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb3d1';
  rrPath(-142, -215, 284, 22, 11); ctx.fill();

  ctx.fillStyle = '#b993dd';
  circle(0, -70, 215); ctx.fill();
  ctx.fillStyle = '#ffe3cf';
  ell(0, -60, 190, 180); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,150,.32)';
  ell(-118, 10, 40, 28); ctx.fill();
  ell(118, 10, 40, 28); ctx.fill();
  ctx.fillStyle = '#f0c2a6';
  ell(0, -18, 38, 30); ctx.fill();

  ctx.fillStyle = '#fff';
  ell(-78, -98, 36, 30); ctx.fill();
  ell(78, -98, 36, 30); ctx.fill();
  ctx.fillStyle = '#5a2233';
  circle(-70, -96, 15); ctx.fill();
  circle(86, -96, 15); ctx.fill();
  ctx.strokeStyle = '#7a4a63'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-112, -140); ctx.quadraticCurveTo(-80, -156, -46, -142); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(112, -140); ctx.quadraticCurveTo(80, -156, 46, -142); ctx.stroke();
  ctx.fillStyle = '#e0a98d';
  circle(126, -30, 9); ctx.fill();

  ctx.save();
  ctx.translate(0, 92);
  const mw = 120 + 20 * open;
  const mh = 24 + 66 * open;
  ctx.fillStyle = '#3a0d24';
  ell(0, 0, mw, mh); ctx.fill();
  if (open > 0.2) {
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) {
      rrPath(i * 42 - 16, -mh + 2, 32, 22 * open, 5); ctx.fill();
    }
    ctx.fillStyle = '#ff7f9e';
    ell(0, mh * 0.48, mw * 0.6, mh * 0.38); ctx.fill();
  }
  ctx.restore();

  for (let i = 0; i < 2; i++) {
    const kp = clamp((G.endingT - 0.15 - i * 0.18) / 1.35, 0, 1);
    if (kp <= 0) continue;
    const kx = lerp(i ? 690 : 310, 500 + (i ? 34 : -34), Math.pow(kp, 1.6));
    const ky = lerp(-180, 100, kp * kp);
    ctx.save();
    ctx.translate(kx, ky);
    ctx.rotate((i ? -1 : 1) * kp * 3.4);
    ctx.globalAlpha = 1 - Math.max(0, kp - 0.75) * 4;
    gingerKid(0, 0, 1.15, i ? '#3fbf9a' : '#ff7aa8', t, 1);
    ctx.restore();
  }
  ctx.restore();

  ctx.save();
  const wob = 1 + Math.sin(t * 14) * 0.055;
  ctx.translate(772, 148);
  ctx.rotate(-0.12);
  ctx.scale(wob, wob);
  ctx.font = F(46);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(40,8,26,.7)';
  ctx.strokeText('냠냠…', 0, 0);
  ctx.fillStyle = '#ffe066';
  ctx.fillText('냠냠…', 0, 0);
  ctx.restore();
}

  ctx.fillStyle = '#b993dd'; circle(0, -382, 82); ctx.fill();

  ctx.strokeStyle = '#5a2233'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-25, -392, 15, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.beginPath(); ctx.arc(25, -392, 15, 0.15, Math.PI - 0.15); ctx.stroke();
  ctx.fillStyle = '#5a2233';
  ctx.beginPath(); ctx.arc(0, -356, 20, 0.15, Math.PI - 0.15); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,150,.45)';
  circle(-42, -362, 11); ctx.fill();
  circle(42, -362, 11); ctx.fill();

  ctx.fillStyle = '#4e3486'; ell(0, -438, 92, 24); ctx.fill();
  ctx.fillStyle = '#6a49a8';
  ctx.beginPath();
  ctx.moveTo(-58, -440);
  ctx.quadraticCurveTo(-42, -560, 42, -556);
  ctx.quadraticCurveTo(-2, -514, 64, -438);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb3d1';
  rrPath(-56, -474, 112, 16, 8); ctx.fill();

  ctx.restore();

  for (let i = 0; i < 6; i++) {
    const ft = (t * 0.5 + i * 0.31) % 1;
    const hx = 290 + i * 84 + Math.sin(t * 1.6 + i) * 12;

    ctx.restore();
  }

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = F(34);
  ctx.lineWidth = 10;
  ctx.strokeStyle = 'rgba(30,6,20,.7)';
  ctx.strokeText('꺼억~ 잘 먹었다!', 500, 38);
  ctx.fillStyle = '#ffe066';
  ctx.fillText('꺼억~ 잘 먹었다!', 500, 38);

  rrPath(300, 574, 400, 38, 19); ctx.fill();
  ctx.font = F(17);
  ctx.fillStyle = '#ffc7de';
  ctx.fillText('둘은 마녀의 간식이 되었어요…', 500, 594);
  ctx.restore();
}

function drawEndingSuccess(t) {
  const mg = ctx.createRadialGradient(830, 108, 10, 830, 108, 130);

  ctx.beginPath();
  ctx.moveTo(0, 470);
  ctx.quadraticCurveTo(260, 410, 520, 462);
  ctx.quadraticCurveTo(760, 505, 1000, 440);
  ctx.lineTo(1000, 620); ctx.lineTo(0, 620); ctx.closePath(); ctx.fill();

  const pop = easeOutBack(clamp(G.endingT / 0.5, 0, 1));
  ctx.save();
  ctx.translate(500, 122);
  ctx.scale(0.7 + 0.3 * pop, 0.7 + 0.3 * pop);
  ctx.fillStyle = '#ffe066';
  rrPath(-210, -56, 420, 112, 26); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6;
  rrPath(-210, -56, 420, 112, 26); ctx.stroke();
  ctx.fillStyle = '#e03e77';
  ctx.font = F(64);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('성공!', 0, -8);
  ctx.font = F(19);
  ctx.fillStyle = '#8a5a00';
  ctx.fillText('마녀 몰래 과자 도둑 대성공', 0, 38);
  ctx.restore();

  const prog = clamp(G.endingT / 2.1, 0, 1);
  const ex = 1 - Math.pow(1 - prog, 3);
  const cx = lerp(320, 690, ex);

  ctx.save();
  ctx.translate(cx, 552);
  ctx.rotate(Math.sin(t * 6) * 0.04);
  ctx.fillStyle = '#c98a55';
  ell(0, -26, 62, 58); ctx.fill();
  ctx.fillStyle = '#e0a566';
  ell(-10, -34, 42, 38); ctx.fill();
  ctx.strokeStyle = '#8a5a34'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-22, -72); ctx.quadraticCurveTo(0, -62, 22, -72); ctx.stroke();
  ctx.fillStyle = '#ff5f9e';
  circle(-30, -82, 9); ctx.fill();
  ctx.fillStyle = '#8ef2b8';
  circle(2, -88, 8); ctx.fill();
  ctx.fillStyle = '#ffe066';
  circle(32, -80, 9); ctx.fill();
  ctx.restore();

  const old = players.map(p => ({ x: p.x, y: p.y, face: p.face, vx: p.vx, vy: p.vy, chew: p.chew, caught: p.caught }));
  players[0].x = cx - 96; players[0].y = 556; players[0].face = 1;
  players[0].vx = 130; players[0].vy = 0; players[0].chew = 0; players[0].caught = false;
  players[1].x = cx + 98; players[1].y = 556; players[1].face = 1;
  players[1].vx = 130; players[1].vy = 0; players[1].chew = 0; players[1].caught = false;
  drawPlayer(players[0], t);
  drawPlayer(players[1], t);
  players.forEach((p, i) => Object.assign(p, old[i]));

  for (let i = 0; i < 30; i++) {
    const ct = (t * 0.35 + i * 0.137) % 1;
    const x = 60 + ((i * 167) % 880);
    const y = 60 + ct * 520;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ct * 6 + i);
    ctx.fillStyle = ['#ff8fb1', '#ffe066', '#8ef2b8', '#a97bff', '#fff'][i % 5];
    rrPath(-4, -2, 8, 4, 2); ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.font = F(18);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 7;
  ctx.strokeStyle = 'rgba(30,8,24,.7)';
  ctx.strokeText('과자를 잔뜩 챙겨서 도망쳤다!', 500, 592);
  ctx.fillStyle = '#fff';
  ctx.fillText('과자를 잔뜩 챙겨서 도망쳤다!', 500, 592);
  ctx.restore();
}

function drawEndingCauldron(t) {
  bigCauldron(500, 590, 2.0, t);

  if (!G.endingFlag) {
    const fp = clamp(G.endingT / 1.55, 0, 1);
    const x = 500 + Math.sin(fp * Math.PI * 2.2) * 90 * (1 - fp);
    const y = 290 + fp * fp * 235;
    ctx.save();
    ctx.globalAlpha = 1 - Math.max(0, fp - 0.82) * 5.5;
    miniWitch(x, y, 2.0, t, 1, fp * Math.PI * 2.2);
    ctx.restore();
    ctx.save();
    const wob = 1 + Math.sin(t * 12) * 0.06;
    ctx.translate(220, 170);
    ctx.rotate(-0.14);
    ctx.scale(wob, wob);
    ctx.font = F(44);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(20,4,26,.75)';
    ctx.strokeText('어라…?', 0, 0);
    ctx.fillStyle = '#ffe066';
    ctx.fillText('어라…?', 0, 0);
    ctx.restore();
  } else {
    const sink = clamp((G.endingT - 1.55) / 0.5, 0, 1);
    const baseY = 402 + sink * 26;
    const wiggle = Math.sin(t * 8) * 0.14;
    ctx.save();
    ctx.translate(500, baseY);
    ctx.fillStyle = '#5b3f8a';
    ell(0, 0, 74, 26); ctx.fill();
    const legs = [[-34, -0.38 + wiggle], [30, 0.32 - wiggle]];
    for (const leg of legs) {
      ctx.save();
      ctx.translate(leg[0], -10);
      ctx.rotate(leg[1]);
      ctx.fillStyle = '#ffd9c2';
      rrPath(-13, -100, 26, 92, 13); ctx.fill();
      ctx.fillStyle = '#ff9ec4';
      for (let k = 0; k < 3; k++) { rrPath(-13, -72 + k * 24, 26, 10, 4); ctx.fill(); }
      ctx.fillStyle = '#3f2a6b';
      ell(0, -102, 22, 14); ctx.fill();
      ctx.restore();
    }
    for (let i = 0; i < 4; i++) {
      const bt = (t * 0.7 + i * 0.28) % 1;
      ctx.fillStyle = `rgba(160,255,205,${(1 - bt) * 0.8})`;
      circle(-40 + i * 26, -12 - bt * 90, 5 + bt * 8); ctx.fill();
    }
    ctx.restore();

    for (let i = 0; i < 5; i++) {
      const a = t * 2 + i * 1.256;
      star(500 + Math.cos(a) * 128, 356 + Math.sin(a) * 34, 5, '#ffe066');
    }
  }

  const since = G.endingT - 1.55;
  if (since >= 0 && since < 0.9) {
    const sp = since / 0.9;
    ctx.save();
    ctx.globalAlpha = 1 - sp;
    ctx.fillStyle = '#8ef2b8';
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI * (0.15 + (i / 11) * 0.7);
      const d = 30 + sp * 160;
      circle(500 + Math.cos(a) * d, 404 + Math.sin(a) * d * 0.7, 8 + sp * 10); ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = clamp(1 - sp * 1.4, 0, 1);
    ctx.translate(760, 240);
    ctx.rotate(0.12);
    ctx.font = F(46);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(20,4,26,.75)';
    ctx.strokeText('풍덩!', 0, 0);
    ctx.fillStyle = '#8ef2b8';
    ctx.fillText('풍덩!', 0, 0);
    ctx.restore();
  }

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = F(44);
  ctx.lineWidth = 11;
  ctx.strokeStyle = 'rgba(20,4,26,.8)';
  ctx.strokeText('마녀가 자기 솥에 빠졌다!', 500, 86);
  ctx.fillStyle = '#8ef2b8';
  ctx.fillText('마녀가 자기 솥에 빠졌다!', 500, 86);
  ctx.font = F(18);
  ctx.lineWidth = 7;
  ctx.strokeText('400점 돌파! 과자 도둑들의 완벽한 복수!', 500, 124);
  ctx.fillStyle = '#fff';
  ctx.fillText('400점 돌파! 과자 도둑들의 완벽한 복수!', 500, 124);
  ctx.restore();
}

/* ============================================================
   렌더
   ============================================================ */
function render(t) {
  ctx.clearRect(0, 0, W, H);
  if (G.mode === 'story') { drawStory(t); return; }
  if (G.mode === 'ending') {
    drawEnding(t);
    if (G.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.4})`;
      ctx.fillRect(0, 0, W, H);
    }
    return;
  }

  ctx.save();
  if (G.shake > 0.2) ctx.translate(rand(-1, 1) * G.shake * 0.6, rand(-1, 1) * G.shake * 0.6);

  drawRoom(t);
  drawCandies(t);

  const ents = [];
  for (const p of players) ents.push({ y: p.y, f: () => drawPlayer(p, t) });
  ents.push({ y: 556, f: () => drawWitch(t) });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e.f();

  drawParticles();
  drawFloats();
  if (G.mode !== 'title') drawBadges(t);
  ctx.restore();

  drawVignette(t);
  drawHUD(t);
  if (G.mode === 'countdown') drawCountdown(t);
  if (G.mode === 'caught') drawCaughtBanner(t);
  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,30,70,${G.flash * 0.3})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ============================================================
   그리기 — 플레이어
   ============================================================ */
function drawPlayer(p, t) {
  const speed = Math.hypot(p.vx, p.vy);
  const moving = speed > 28 && !p.caught;
  const walkPhase = t * 15 + p.id * 1.7;
  const swing = moving ? Math.sin(walkPhase) : 0;
  const bob = moving ? Math.abs(Math.sin(walkPhase)) * 2.6 : Math.sin(t * 2.6 + p.id * 1.3) * 1.2;
  const skin = '#e9ad6b', skinDark = '#cf8c42';

  ctx.save();
  ctx.translate(p.x, p.y);

  ctx.fillStyle = 'rgba(90,50,80,.20)';
  ell(0, 1, 25, 7.5); ctx.fill();

  ctx.translate(0, -bob);
  ctx.scale(p.face, 1);

  // 다리
  ctx.fillStyle = skinDark;
  ctx.save();
  ctx.translate(-8, -17);
  ctx.rotate(swing * 0.42);
  rrPath(-6.5, -2, 13, 20, 6); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(8, -17);
  ctx.rotate(-swing * 0.42);
  rrPath(-6.5, -2, 13, 20, 6); ctx.fill();
  ctx.restore();

  // 팔
  ctx.fillStyle = skin;
  ctx.save();
  ctx.translate(-19, -46);
  ctx.rotate(0.35 + swing * 0.25);
  rrPath(-5.5, 0, 11, 24, 5.5); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(19, -46);
  ctx.rotate(-0.35 - swing * 0.25);
  rrPath(-5.5, 0, 11, 24, 5.5); ctx.fill();
  ctx.restore();

  // 몸통
  const bg = ctx.createLinearGradient(0, -54, 0, -8);
  bg.addColorStop(0, '#f0b878');
  bg.addColorStop(1, '#d8914c');
  ctx.fillStyle = bg;
  rrPath(-21, -54, 42, 40, 15); ctx.fill();

  // 어깨 아이싱
  ctx.fillStyle = p.color;
  rrPath(-21, -57, 42, 13, 6.5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  rrPath(-18, -55, 36, 4, 2); ctx.fill();

  // 단추
  ctx.fillStyle = '#fff6e8';
  circle(-7, -32, 3.2); ctx.fill();
  circle(7, -32, 3.2); ctx.fill();
  heart(0, -20, 0.55, p.color);

  // 머리
  ctx.fillStyle = '#eebd80';
  circle(0, -66, 21); ctx.fill();

  // 머리 장식
  if (p.id === 1) {
    // 리본
    ctx.fillStyle = p.colorDark;
    ctx.beginPath();
    ctx.moveTo(-18, -84); ctx.lineTo(-35, -93); ctx.lineTo(-32, -74); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-18, -84); ctx.lineTo(-3, -95); ctx.lineTo(-4, -76); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd1e4';
    circle(-17, -84, 4.5); ctx.fill();
  } else {
    // 민트 비니
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(0, -78, 22, 15, 0, Math.PI, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = p.colorDark;
    rrPath(-22, -80, 44, 8, 4); ctx.fill();
    ctx.fillStyle = '#fff';
    circle(0, -93, 5); ctx.fill();
    ctx.fillStyle = p.colorDark;
    circle(0, -93, 3); ctx.fill();
  }

  // 얼굴
  if (p.caught) {
    ctx.strokeStyle = '#3a2a28';
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    line(-12, -75, -4, -67); line(-4, -75, -12, -67);
    line(4, -75, 12, -67); line(12, -75, 4, -67);
    ctx.fillStyle = '#5a2a2a';
    ell(0, -56, 6, 4); ctx.fill();
  } else {
    // 눈
    ctx.fillStyle = '#fff';
    ell(-7.5, -69, 5.4, 6.4); ctx.fill();
    ell(7.5, -69, 5.4, 6.4); ctx.fill();
    ctx.fillStyle = '#3a2a28';
    const blink = Math.sin(t * 1.6 + p.id * 3) > 0.97 ? 0.25 : 1;
    ell(-7, -68.5, 3, 3.5 * blink); ctx.fill();
    ell(8, -68.5, 3, 3.5 * blink); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    circle(-8.5, -70.5, 1.3 * blink); ctx.fill();
    circle(6.5, -70.5, 1.3 * blink); ctx.fill();

    // 볼
    ctx.fillStyle = 'rgba(255,130,160,.4)';
    ell(-14, -62, 5, 3); ctx.fill();
    ell(14, -62, 5, 3); ctx.fill();

    // 입
    if (p.chew > 0) {
      const open = 2.4 + Math.abs(Math.sin(t * 20)) * 4.2;
      ctx.fillStyle = '#7a3a34';
      ell(0, -58, 6.2, open); ctx.fill();
      ctx.fillStyle = '#ff9aa8';
      ell(0, -58 + open * 0.45, 3.4, open * 0.4); ctx.fill();
    } else {
      ctx.strokeStyle = '#8a4a3a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -61, 4.5, 0.25, Math.PI - 0.25);
      ctx.stroke();
    }
  }

  ctx.restore();

  // 땀방울 / 먹는 소리
  if (p.chew > 0) {
    ctx.save();
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#fff';
    ctx.font = F(12);
    ctx.textAlign = 'center';
    ctx.fillText('냠', p.x + 30 * p.face, p.y - 92 - Math.sin(t * 12) * 3);
    ctx.restore();
  }
}

function drawBadges(t) {
  for (const p of players) {
    const y = p.y - 116;
    const R = 17.5;

    // 진행 링
    ctx.save();
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    circle(p.x, y, R); ctx.stroke();
    if (p.chew > 0.005) {
      ctx.strokeStyle = p.color;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(p.x, y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, p.chew));
      ctx.stroke();
    }
    ctx.fillStyle = p.color;
    circle(p.x, y, 13.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    circle(p.x, y - 4, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = F(13);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.id + 'P', p.x, y + 1);
    ctx.restore();

    // 먹기 키 힌트
    if (G.mode === 'playing' && p.chew === 0 && p.target && !p.caught) {
      const label = p.id === 1 ? 'Enter' : 'Space';
      ctx.save();
      ctx.font = F(12);
      const tw = ctx.measureText(label).width;
      const w = tw + 18;
      ctx.fillStyle = 'rgba(255,255,255,.94)';
      rrPath(p.x - w / 2, y - 46, w, 23, 9); ctx.fill();
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      rrPath(p.x - w / 2, y - 46, w, 23, 9); ctx.stroke();
      ctx.fillStyle = p.colorDark;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, p.x, y - 34);
      ctx.restore();
    }
  }
}

    <div class="resultScore">${G.score}<small>점</small></div>
    <div class="stats">
      <div class="stat"><b>${G.eaten}개</b><span>먹은 과자</span></div>
      <div class="stat"><b>${Math.ceil(G.time)}초</b><span>남은 시간</span></div>
      <div class="stat"><b>${G.best}점</b><span>${d.emoji} ${d.name} 최고</span></div>
    </div>
    <div class="scoreRow"><span>201점↑ 성공</span><span>400점↑ 솥행</span><span>그 외 잡아먹힘</span></div>
    <div class="btnRow">
      <button class="btn" data-act="retry">다시 도전</button>
      <button class="btn ghost" data-act="title">난이도 선택</button>
    </div>
    <p class="tip">Enter / Space 로 바로 다시 도전할 수 있어요</p>
  `;
  overlayEl.classList.add('show');
}

overlayEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  initAudio();
  const act = btn.dataset.act;
  if (act === 'easy' || act === 'hard') beginRun(act, true);
  else if (act === 'retry') beginRun(G.diff, false);
  else if (act === 'title') showTitle();
  else if (act === 'start') beginRun(G.diff, true);
});

cvs.addEventListener('pointerdown', () => {
  if (G.mode === 'story') advanceStory();
  else if (G.mode === 'ending' && G.endingT > 0.55) showResult(G.ending);
});

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  initAudio();
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
});
window.addEventListener('pointerdown', initAudio, { once: true });

/* ============================================================
   시작
   ============================================================ */
resetGame();
showTitle();

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  update(dt, now / 1000);
  render(now / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
