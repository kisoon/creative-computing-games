<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>고요한 호숫가 · 해질녘의 낚시</title>
<style>
  :root{
    --ink:#f0eadc;
    --muted:rgba(233,231,220,.58);
    --faint:rgba(233,231,220,.32);
    --panel:rgba(12,24,29,.58);
    --panel-strong:rgba(10,21,26,.82);
    --line:rgba(231,216,183,.16);
    --warm:#e8b77a;
    --teal:#8ac4b4;
    --serif:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;
    --sans:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b141d;}
  body{
    color:var(--ink);font-family:var(--sans);font-weight:400;
    user-select:none;-webkit-user-select:none;touch-action:none;
    overscroll-behavior:none;
  }
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;}
  #grain{
    position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.18;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
    mix-blend-mode:soft-light;
  }
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:3;
    background:
      radial-gradient(ellipse at 50% 46%,transparent 45%,rgba(3,9,14,.28) 76%,rgba(2,7,10,.62) 100%),
      linear-gradient(180deg,rgba(3,8,14,.2),transparent 22%,transparent 78%,rgba(3,8,10,.18));
  }
  #danger{
    position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
    background:radial-gradient(ellipse at 50% 50%,transparent 42%,rgba(176,65,47,.28) 100%);
    transition:opacity .16s linear;
  }
  #danger.on{opacity:1;}
  #ui{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));}
  .topbar{position:absolute;top:max(22px,env(safe-area-inset-top));left:max(26px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));display:flex;align-items:flex-start;justify-content:space-between;gap:20px;}
  .brand{display:flex;align-items:center;gap:13px;filter:drop-shadow(0 2px 12px rgba(0,0,0,.26));}
  .brand-mark{width:37px;height:37px;flex:0 0 auto;opacity:.9;}
  .brand h1{font-family:var(--serif);font-weight:500;font-size:23px;line-height:1.05;margin:0 0 6px;letter-spacing:.055em;color:rgba(247,239,221,.94);}
  .brand p{margin:0;color:var(--muted);font-size:10px;letter-spacing:.23em;text-transform:uppercase;}
  .top-actions{display:flex;align-items:center;gap:9px;}
  .counter,.wallet{
    display:flex;align-items:center;gap:8px;height:37px;padding:0 14px;border:1px solid var(--line);
    border-radius:999px;background:rgba(7,17,22,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--muted);font-size:11px;letter-spacing:.08em;white-space:nowrap;
  }
  .counter svg,.wallet svg{width:15px;height:15px;color:var(--warm);opacity:.82;flex:0 0 auto;}
  .counter b,.wallet b{font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);letter-spacing:0;transition:transform .3s cubic-bezier(.2,.8,.2,1);display:inline-block;font-variant-numeric:tabular-nums;}
  .counter b.pop,.wallet b.pop{transform:scale(1.22);color:#ffe3b2;}
  .wallet{border-color:rgba(232,183,122,.22);background:rgba(35,25,15,.32);color:rgba(240,216,177,.68);}
  .wallet svg{color:#f2c781;}
  .dock{
    position:absolute;left:max(26px,env(safe-area-inset-left));top:max(71px,calc(env(safe-area-inset-top) + 62px));
    display:flex;align-items:center;gap:7px;pointer-events:auto;
  }
  .dock-btn{
    position:relative;display:flex;align-items:center;gap:6px;height:31px;padding:0 11px;border-radius:9px;
    border:1px solid rgba(233,218,186,.11);background:rgba(7,17,22,.26);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:rgba(240,234,220,.62);font-family:var(--sans);font-size:10.5px;letter-spacing:.04em;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,transform .18s;
  }
  .dock-btn:hover{background:rgba(32,47,48,.5);border-color:rgba(232,183,122,.24);color:rgba(248,240,224,.9);transform:translateY(-1px);}
  .dock-btn:active{transform:scale(.96);}
  .dock-btn svg{width:14px;height:14px;opacity:.7;}
  .dock-btn b{
    min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:rgba(232,183,122,.13);
    color:rgba(246,213,167,.82);font-size:8.5px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;
    letter-spacing:0;font-variant-numeric:tabular-nums;
  }
  .dock-btn b:empty{display:none;}
  .dock-btn.hot{color:#f5ddb8;}
  .dock-btn.hot svg{opacity:.95;}
  .icon-btn{
    pointer-events:auto;width:37px;height:37px;padding:0;border:1px solid var(--line);border-radius:50%;
    background:rgba(7,17,22,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:rgba(242,235,218,.8);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,transform .2s;
  }
  .icon-btn:hover{background:rgba(34,52,54,.55);border-color:rgba(231,216,183,.27);transform:translateY(-1px);}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn svg{width:17px;height:17px;overflow:visible;}
  .icon-btn .mute-line{opacity:0;transition:opacity .2s;}
  .icon-btn.muted .mute-line{opacity:1;}
  .icon-btn.muted .sound-wave{opacity:.12;}
  .hint{
    position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translate(-50%,12px);
    display:flex;align-items:center;gap:10px;padding:10px 17px 10px 13px;border:1px solid rgba(233,218,186,.13);
    border-radius:999px;background:rgba(6,16,20,.42);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:rgba(241,235,220,.73);font-size:12px;letter-spacing:.02em;white-space:nowrap;
    opacity:0;visibility:hidden;transition:opacity .45s,transform .45s,visibility .45s;
  }
  .hint.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
  .hint .ripple-dot{width:20px;height:20px;border-radius:50%;border:1px solid rgba(231,183,122,.52);position:relative;flex:0 0 auto;}
  .hint .ripple-dot::after{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(231,183,122,.72);animation:softPulse 2.4s ease-in-out infinite;}
  .hint em{font-style:normal;color:var(--warm);}
  @keyframes softPulse{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:1;transform:scale(1)}}
  .bite-alert{
    position:absolute;left:50%;top:23%;transform:translate(-50%,14px) scale(.96);
    text-align:center;opacity:0;visibility:hidden;transition:opacity .16s,transform .2s,visibility .16s;
    filter:drop-shadow(0 3px 14px rgba(0,0,0,.38));
  }
  .bite-alert.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1);animation:bitePulse 1s ease-in-out infinite;}
  .bite-alert .label{display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--serif);font-size:clamp(23px,3.3vw,34px);letter-spacing:.1em;color:#ffe6bd;}
  .bite-alert .label i{width:7px;height:7px;border-radius:50%;background:#ffb06d;box-shadow:0 0 14px rgba(255,157,82,.9);animation:softPulse .7s ease-in-out infinite;}
  .bite-alert .sub{font-size:11px;letter-spacing:.16em;color:rgba(255,235,207,.72);margin-top:5px;}
  .bite-timer{width:116px;height:2px;margin:11px auto 0;background:rgba(255,230,194,.17);overflow:hidden;border-radius:2px;}
  .bite-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f2ba7d,#ffdfac);transform-origin:left;}
  @keyframes bitePulse{0%,100%{filter:drop-shadow(0 3px 14px rgba(0,0,0,.38))}50%{filter:drop-shadow(0 3px 20px rgba(211,130,65,.35))}}
  .toast{
    position:absolute;left:50%;top:82px;transform:translate(-50%,-8px);padding:9px 16px;border-radius:10px;
    background:rgba(8,18,22,.7);border:1px solid rgba(233,216,183,.13);backdrop-filter:blur(10px);
    color:rgba(242,235,218,.78);font-size:12px;letter-spacing:.02em;opacity:0;visibility:hidden;
    transition:opacity .3s,transform .3s,visibility .3s;white-space:nowrap;
  }
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
  .fight-hud{
    position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,16px);
    width:min(420px,calc(100vw - 42px));padding:14px 16px 13px;border-radius:16px;
    background:rgba(7,18,22,.6);border:1px solid rgba(233,218,186,.13);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    opacity:0;visibility:hidden;transition:opacity .3s,transform .3s,visibility .3s;
    box-shadow:0 12px 40px rgba(0,0,0,.15);
  }
  .fight-hud.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
  .fight-fish{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:10px;letter-spacing:.14em;}
  .fight-fish b{font-family:var(--serif);font-weight:500;font-size:13px;letter-spacing:.06em;color:rgba(246,237,218,.9);}
  .gauge-row{display:flex;align-items:center;gap:10px;margin-top:7px;}
  .gauge-row label{width:42px;flex:0 0 auto;font-size:10px;letter-spacing:.08em;color:rgba(235,230,216,.56);}
  .gauge{flex:1;height:6px;border-radius:8px;background:rgba(231,228,210,.1);overflow:hidden;position:relative;}
  .gauge i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0);border-radius:6px;transition:transform .08s linear;}
  #tensionFill{background:linear-gradient(90deg,#79b9a7 0%,#d6bd7e 52%,#dc8063 80%,#ea6b51 100%);}
  #progressFill{background:linear-gradient(90deg,#76ab9f,#c9d9bd);}
  .fight-tip{margin-top:10px;color:rgba(232,229,216,.4);font-size:10px;text-align:center;letter-spacing:.025em;}
  .fight-tip b{color:rgba(232,206,166,.7);font-weight:400;}
  .result-wrap{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none;}
  .result-card{
    width:min(370px,calc(100vw - 38px));padding:19px 24px 19px;border-radius:22px;
    background:linear-gradient(150deg,rgba(16,32,34,.82),rgba(8,19,24,.86));
    border:1px solid rgba(232,215,181,.19);box-shadow:0 24px 80px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.035);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    opacity:0;visibility:hidden;transform:translateY(18px) scale(.97);
    transition:opacity .5s cubic-bezier(.2,.8,.22,1),transform .5s cubic-bezier(.2,.8,.22,1),visibility .5s;
    text-align:center;position:relative;overflow:hidden;
  }
  .result-card.show{opacity:1;visibility:visible;transform:translateY(0) scale(1);}
  .result-card::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(238,189,119,.08),transparent 58%);pointer-events:none;}
  .result-card.golden{border-color:rgba(248,210,131,.38);box-shadow:0 24px 80px rgba(0,0,0,.36),0 0 50px rgba(238,178,71,.12),inset 0 1px rgba(255,240,190,.07);}
  .result-card.golden::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,227,157,.09) 50%,transparent 60%);animation:shimmer 3s ease-in-out infinite;pointer-events:none;}
  @keyframes shimmer{0%{transform:translateX(-35%)}50%,100%{transform:translateX(35%)}}
  .result-kicker{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:8px;color:rgba(233,226,206,.4);font-size:9px;letter-spacing:.2em;text-transform:uppercase;}
  .result-kicker span{color:rgba(232,183,122,.82);letter-spacing:.08em;}
  .fish-art{position:relative;z-index:1;height:96px;margin:8px 0 1px;display:flex;align-items:center;justify-content:center;}
  .fish-art svg{width:170px;height:105px;overflow:visible;filter:drop-shadow(0 12px 18px rgba(0,0,0,.24));}
  .result-card.golden .fish-art svg{filter:drop-shadow(0 0 18px rgba(255,190,80,.35)) drop-shadow(0 12px 18px rgba(0,0,0,.22));}
  .result-card h2{position:relative;z-index:1;margin:0;font-family:var(--serif);font-size:28px;letter-spacing:.12em;font-weight:500;color:#f6eedc;}
  .result-size{position:relative;z-index:1;margin-top:4px;font-family:var(--serif);color:#e7c28a;font-size:18px;letter-spacing:.05em;}
  .result-size small{font-family:var(--sans);font-size:9px;letter-spacing:.13em;color:rgba(232,214,183,.5);margin-left:4px;}
  .result-note{position:relative;z-index:1;margin:9px auto 0;max-width:270px;color:rgba(231,226,210,.5);font-size:10.5px;line-height:1.65;word-break:keep-all;}
  .result-dismiss{position:relative;z-index:1;margin-top:14px;padding-top:12px;border-top:1px solid rgba(231,216,183,.1);color:rgba(236,229,210,.46);font-size:10px;letter-spacing:.03em;}
  .result-dismiss b{font-weight:400;color:rgba(239,213,169,.76);}
  .lost-mark{width:66px;height:66px;border:1px solid rgba(209,203,186,.18);border-radius:50%;display:grid;place-items:center;color:rgba(231,220,199,.5);font-family:var(--serif);font-size:23px;letter-spacing:.08em;background:rgba(220,213,192,.025);}
  .lost .result-card::before{background:radial-gradient(ellipse at 50% 0%,rgba(143,170,164,.07),transparent 58%);}
  .result-badges{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:8px;flex-wrap:wrap;}
  .rarity-badge,.grade-badge{
    display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;
    border:1px solid color-mix(in srgb,var(--badge,#a8b4b5) 36%,transparent);
    background:color-mix(in srgb,var(--badge,#a8b4b5) 12%,transparent);
    color:var(--badge,#d9ded8);font-size:9.5px;letter-spacing:.05em;white-space:nowrap;
  }
  .rarity-badge i{width:5px;height:5px;border-radius:50%;background:var(--badge);box-shadow:0 0 8px var(--badge);}
  .grade-badge{font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:.02em;min-width:25px;justify-content:center;padding:0 7px;}
  .grade-S{--badge:#ffd873!important;color:#ffe6a2!important;}
  .grade-A{--badge:#d6a8ff!important;color:#e7c9ff!important;}
  .grade-B{--badge:#8cc9ff!important;color:#bfe3ff!important;}
  .grade-C{--badge:#93d8ae!important;color:#c0ebcf!important;}
  .grade-D{--badge:#bcc8b8!important;color:#d8e0d2!important;}
  .grade-E{--badge:#a9a394!important;color:#cbc5b6!important;}
  .grade-F{--badge:#9a8575!important;color:#c5b5a6!important;}
  .result-value{position:relative;z-index:1;margin-top:9px;font-size:10px;letter-spacing:.04em;color:rgba(236,225,203,.5);}
  .result-value b{font-family:var(--serif);font-size:14px;font-weight:500;color:#f2cf8e;letter-spacing:.02em;}
  .result-new{
    display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:5px;margin-right:6px;
    background:rgba(232,183,122,.14);color:#f5d7a2;font-size:8px;letter-spacing:.12em;vertical-align:1px;
  }
  .result-card.golden .result-value b{color:#ffe2a1;text-shadow:0 0 12px rgba(255,196,82,.3);}

  /* ---------- sheet / collection / shop ---------- */
  .sheet-overlay{
    position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
    background:rgba(2,8,12,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;visibility:hidden;transition:opacity .24s,visibility .24s;
  }
  .sheet-overlay.show{opacity:1;visibility:visible;}
  .sheet{
    position:relative;width:min(820px,100%);max-height:min(88dvh,860px);display:flex;flex-direction:column;
    border-radius:22px;border:1px solid rgba(232,215,181,.18);
    background:linear-gradient(155deg,rgba(15,30,33,.96),rgba(7,17,22,.97));
    box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.035);
    transform:translateY(16px) scale(.985);transition:transform .28s cubic-bezier(.2,.8,.22,1);overflow:hidden;
  }
  .sheet-overlay.show .sheet{transform:translateY(0) scale(1);}
  .sheet::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(238,189,119,.065),transparent 55%);pointer-events:none;}
  .sheet-head{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:21px 24px 15px;border-bottom:1px solid rgba(231,216,183,.09);}
  .sheet-head h2{margin:0;font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:.08em;color:#f5eddb;}
  .sheet-head p{margin:5px 0 0;color:rgba(232,226,210,.46);font-size:10.5px;line-height:1.5;letter-spacing:.02em;}
  .sheet-close{
    width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid rgba(233,218,186,.14);
    background:rgba(255,255,255,.025);color:rgba(240,234,220,.65);cursor:pointer;display:grid;place-items:center;
    transition:background .18s,color .18s,transform .18s;
  }
  .sheet-close:hover{background:rgba(255,255,255,.07);color:#fff;transform:rotate(6deg);}
  .sheet-close svg{width:15px;height:15px;}
  .sheet-body{position:relative;z-index:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 24px 24px;scrollbar-width:thin;scrollbar-color:rgba(232,183,122,.22) transparent;}
  .sheet-body::-webkit-scrollbar{width:6px;}
  .sheet-body::-webkit-scrollbar-thumb{background:rgba(232,183,122,.2);border-radius:8px;}
  .sheet-toast{
    position:absolute;left:50%;bottom:16px;transform:translate(-50%,10px);z-index:5;padding:8px 14px;border-radius:8px;
    background:rgba(8,18,22,.92);border:1px solid rgba(232,183,122,.22);color:#f2d8ab;font-size:10.5px;
    opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;white-space:nowrap;pointer-events:none;
  }
  .sheet-toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);}
  .sheet-stats{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .sheet-stats .stat-line{display:flex;align-items:baseline;gap:7px;color:rgba(232,226,210,.5);font-size:10.5px;letter-spacing:.04em;}
  .sheet-stats .stat-line b{font-family:var(--serif);font-size:17px;font-weight:500;color:#f0d29b;}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:15px;}
  .filter-chip{
    height:28px;padding:0 11px;border-radius:8px;border:1px solid rgba(233,218,186,.11);background:rgba(255,255,255,.018);
    color:rgba(236,230,216,.55);font-size:10px;letter-spacing:.03em;cursor:pointer;transition:all .16s;
  }
  .filter-chip:hover{color:#f3ead7;border-color:rgba(232,183,122,.24);}
  .filter-chip.on{background:rgba(232,183,122,.12);border-color:rgba(232,183,122,.32);color:#f2d6a6;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;
    border:1px solid rgba(232,183,122,.24);background:rgba(232,183,122,.1);color:#f0d3a2;font-family:var(--sans);
    font-size:10.5px;letter-spacing:.03em;cursor:pointer;transition:background .18s,border-color .18s,transform .18s,opacity .18s;
  }
  .btn:hover{background:rgba(232,183,122,.17);border-color:rgba(232,183,122,.4);}
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.3;cursor:default;transform:none;}
  .btn.ghost{border-color:rgba(233,218,186,.12);background:rgba(255,255,255,.02);color:rgba(236,230,216,.55);}
  .btn.ghost:hover{background:rgba(255,255,255,.055);color:#f2ead9;}
  .btn.soft{border-color:rgba(138,196,180,.22);background:rgba(138,196,180,.08);color:#bfe2d7;}
  .dex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;}
  .dex-card{
    position:relative;min-height:140px;border-radius:12px;border:1px solid rgba(233,218,186,.09);
    background:linear-gradient(160deg,rgba(255,255,255,.028),rgba(255,255,255,.008));padding:10px 11px 11px;
    overflow:hidden;transition:border-color .18s,background .18s;
  }

const invLerp = (a,b,v) => clamp((v-a)/(b-a||1),0,1);
const easeOut = t => 1 - Math.pow(1-t,3);
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function gradeFromPct(pct){
  if(pct >= .90) return 'S';
  if(pct >= .78) return 'A';
  if(pct >= .64) return 'B';
  if(pct >= .48) return 'C';
  if(pct >= .32) return 'D';
  if(pct >= .16) return 'E';
  return 'F';
}
function gradeFor(size, sp){
  return gradeFromPct(invLerp(sp.size[0], sp.size[1], size));
}
function fishValue(sp, grade){
  return Math.max(10, Math.round(sp.price * GRADES[grade].mult * (1 + sp.tier * .012)));
}
function speciesWeight(sp){
  const base = Math.pow(.70, sp.tier - 1);
  const rod = currentRod();
  return base * (1 + rod.rare * Math.max(0, sp.tier - 4));
}
function nearestFish(){
  const pool = MAP_POOLS[currentMapId] || MAP_POOLS.lake;
  let total = 0;
  for(const sp of pool) total += speciesWeight(sp);
  let roll = Math.random() * total;
  for(const sp of pool){
    roll -= speciesWeight(sp);
    if(roll <= 0) return makeFish(sp);
  }
  return makeFish(pool[pool.length - 1]);
}
function makeFish(sp){
  const pct = Math.pow(Math.random(), 1.65);
  const raw = lerp(sp.size[0], sp.size[1], pct);
  const size = Math.round(raw * 10) / 10;
  const grade = gradeFromPct(pct);
  return {
    id: sp.id, name: sp.name, tier: sp.tier, rarityLabel: sp.rarityLabel,
    rarityColor: sp.rarityColor, size, grade, gradeColor: GRADES[grade].color,
    value: fishValue(sp, grade), basePrice: sp.price,
    colors: { ...sp.colors }, shape: sp.shape, pattern: sp.pattern,
    desc: sp.desc, maps: sp.maps.slice(),
    strength: clamp(.58 + (sp.size[1] / 620) + sp.tier * .026, .62, 1.56),

}

function makeNoiseBuffer(ctx, seconds=2, brown=false){
  const len = Math.floor(ctx.sampleRate*seconds);
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for(let i=0;i<len;i++){
    const white = Math.random()*2-1;
    if(brown){ last = (last + .018*white)/1.018; data[i] = last*3.2; }
    else data[i] = white;
  }
  return buffer;
}

/* ============================================================
   SOUND — tiny synthesized soundscape, no files
   ============================================================ */
const Sound = {
  ctx:null, master:null, started:false, muted:false, lastTick:0, nextCrackle:2,
  init(){
    if(this.ctx) { if(this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : .62;
      this.master.connect(this.ctx.destination);
      this.noise = makeNoiseBuffer(this.ctx, 3, true);
      this.white = makeNoiseBuffer(this.ctx, 2, false);
      this.makeAmbience();
      this.started = true;
    }catch(e){ this.ctx = null; }
  },
  makeAmbience(){
    const c = this.ctx;
    if(!c) return;
    // low water lapping
    const water = c.createBufferSource(); water.buffer = this.noise; water.loop = true;
    const wf = c.createBiquadFilter(); wf.type='lowpass'; wf.frequency.value=520; wf.Q.value=.5;
    const wg = c.createGain(); wg.gain.value=.052;
    const lfo = c.createOscillator(); lfo.type='sine'; lfo.frequency.value=.075;
    const lfoGain = c.createGain(); lfoGain.gain.value=.022;
    lfo.connect(lfoGain); lfoGain.connect(wg.gain);
    water.connect(wf); wf.connect(wg); wg.connect(this.master);
    water.start(); lfo.start();
    // airy wind
    const wind = c.createBufferSource(); wind.buffer = this.white; wind.loop = true;
    const hp = c.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=760; hp.Q.value=.34;
    const wg2 = c.createGain(); wg2.gain.value=.011;
    const lfo2 = c.createOscillator(); lfo2.type='sine'; lfo2.frequency.value=.117;
    const lg2 = c.createGain(); lg2.gain.value=.006;
    lfo2.connect(lg2); lg2.connect(wg2.gain);
    wind.connect(hp); hp.connect(wg2); wg2.connect(this.master);
    wind.start(); lfo2.start();
  },
  toggle(){
    this.init();
    this.muted = !this.muted;
    if(!this.ctx) return this.muted;
    const t = this.ctx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.setTargetAtTime(this.muted ? 0 : .62, t, .08);
    return this.muted;
  },
  tone(freq, dur=.12, type='sine', vol=.05, slide=null, delay=0){
    const c = this.ctx; if(!c || this.muted) return;
    const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.03);
  },
  noiseBurst(dur=.25, freq=900, q=.7, vol=.08, type='bandpass', slide=null, delay=0){
    const c = this.ctx; if(!c || this.muted) return;
    const t = c.currentTime + delay;
    const src = c.createBufferSource(); src.buffer=this.white;
    const f = c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t); f.Q.value=q;
    if(slide) f.frequency.exponentialRampToValueAtTime(Math.max(60,slide), t+dur);
    const g = c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t, Math.random()*1.4, dur+.05);
  },
  cast(){
    this.noiseBurst(.42, 1600, .5, .035, 'bandpass', 220);
    this.tone(180,.2,'sine',.018,90,.02);
  },
  splash(strong=1){
    this.noiseBurst(.36*strong,.55*strong, .7, .085, 'bandpass', 120);
    this.tone(150,.15,'sine',.025*strong, 65);
    this.tone(380,.11,'sine',.012*strong, 210,.03);
  },
  bite(){
    this.tone(660,.09,'sine',.045,700);
    this.tone(990,.14,'sine',.035,1120,.075);
    this.tone(130,.16,'sine',.028,80);
  },
  tick(){
    this.tone(230+Math.random()*80,.022,'triangle',.013,190);
  },
  hook(){
    this.tone(130,.18,'sawtooth',.025,260);
    this.noiseBurst(.2,900,.6,.05,'bandpass',250);
  },
  catchFish(tier=1, grade='E'){
    const t = clamp(Math.round(tier)||1, 1, 10);
    const roots = [392,415.3,440,466.16,493.88,523.25,587.33,659.25,739.99,783.99];
    const root = roots[t-1];
    const intervals = [1,1.122,1.26,1.335,1.498,1.682,1.888,2];
    const big = grade==='S'||grade==='A';
    const count = 3 + Math.floor((t-1)*.5) + (big?1:0);
    for(let i=0;i<count;i++){
      const idx = Math.round(i*(intervals.length-1)/Math.max(1,count-1));
      const freq = root*intervals[idx];
      this.tone(freq,.58,'sine',.028+t*.0022,freq,i*.085);
      if(t>=7) this.tone(freq*2,.4,'triangle',.0075,freq*2,i*.085+.028);
    }
    if(t>=4){
      this.tone(root/2,.5,'sine',.022+(t*.0018),root/2*.99,0);
      this.tone(root*.75,.42,'triangle',.012,root*.75,count*.05);
    }
    if(grade==='S'){
      [2,2.5,3].forEach((r,i)=>this.tone(root*r,.72,'sine',.014,root*r,.2+i*.09));
      this.noiseBurst(.55,4200,.55,.02,'highpass',7600,.1);
    } else if(grade==='A'){
      [2,2.5].forEach((r,i)=>this.tone(root*r,.56,'sine',.011,root*r,.22+i*.1));
    } else if(grade==='B'){
      this.tone(root*2,.5,'sine',.009,root*2,.24);
    } else if(grade==='F'){
      this.tone(root*.82,.4,'triangle',.012,root*.78,.12);
    }
    if(t>=9){
      this.tone(root/2,.95,'triangle',.017,root/2,0);
      this.noiseBurst(.65,2500,.5,.013,'bandpass',900,.05);
      this.tone(root*3,.8,'sine',.01,root*3,.34);
    }
  },
  snap(){
    this.noiseBurst(.18,2400,.4,.08,'highpass',700);
    this.tone(240,.22,'sawtooth',.025,70);
    this.tone(120,.3,'sine',.02,50,.03);
  },
  miss(){ this.tone(330,.16,'sine',.022,220); this.tone(220,.25,'sine',.018,150,.1); },
  crackle(){
    const c=this.ctx; if(!c || this.muted) return;
    this.noiseBurst(.045+Math.random()*.05, 1800+Math.random()*2200, 1.4, .009+Math.random()*.01, 'bandpass', 700);
  },
  update(dt, reeling){
    if(!this.ctx || this.muted) return;
    if(reeling && elapsed - this.lastTick > .085){
      this.lastTick = elapsed; this.tick();
    }
    this.nextCrackle -= dt;
    if(this.nextCrackle <= 0){
      this.crackle();
      this.nextCrackle = rand(1.7,5.2);
    }
  }
};

/* ============================================================
   LAYOUT + PRE-RENDERED SCENERY
   ============================================================ */
function resize(){
  W = Math.max(260, window.innerWidth);
  H = Math.max(360, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, CONFIG.maxDPR);
  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  portrait = H > W*1.04;
  horizon = H * (portrait ? .385 : .415);
  layout = makeLayout();
  ridges = makeRidges();
  buildBackground();
  buildForeground();
  buildWaterParticles();
  buildClouds();
  buildFireflies();
  if(!rod.init){
    rod.tip = {...desiredRodTip(elapsed)};
    rod.desired = {...rod.tip};
    rod.init = true;
  }
}
function makeLayout(){
  const tentW = clamp(W*.175, 96, 268);
  const tentH = clamp(H*.225, 132, 238);
  const tentCx = Math.max(tentW*.53, W*.095);
  const groundY = H*(portrait ? .785 : .805);
  const fireScale = clamp(Math.min(W,H)/820, .74, 1.42);
  return {
    tent:{ cx:tentCx, baseY:groundY, w:tentW, h:tentH, peakY:groundY-tentH },
    fire:{ x:W*(portrait?.80:.805), y:groundY+H*.004, scale:fireScale*1.24 },
    lantern:{ x:Math.min(tentCx+tentW*.63, W*.26), y:groundY-tentH*.52 },
    chair:{ x:W*.943, y:groundY-.9, scale:fireScale*.82 },
    frontTop: H*.735,
    shoreY: groundY
  };
}
function makeRidges(){
  const map = currentMap();
  const k = map.ridgeAmp;
  const specs = [
    { seed:113, base:horizon+2, amp:H*.185*k, layers:19, top:'#59617c', bottom:'#756877', alpha:.72 },
    { seed:287, base:horizon+5, amp:H*.128*k, layers:17, top:'#394b5f', bottom:'#5d5d69', alpha:.84 },
    { seed:491, base:horizon+8, amp:H*.078*k, layers:15, top:'#203b44', bottom:'#344d52', alpha:1 }
  ];
  if(map.ridges==='islands'){
    specs[0].top='#3c5666'; specs[0].bottom='#546b74';
    specs[1].top='#274552'; specs[1].bottom='#3f5b62';
    specs[2].top='#18343f'; specs[2].bottom='#2a4850';
  } else if(map.ridges==='hills'){
    specs[0].top='#4a5d60'; specs[0].bottom='#68706a';
    specs[1].top='#304a47'; specs[1].bottom='#4a5c52';
    specs[2].top='#1d3a35'; specs[2].bottom='#2c4a42';

    return [];
  }
  return specs.map((spec,idx)=>{
    const rng = mulberry32(spec.seed);
    const pts = [];
    const n = spec.layers;
    for(let i=0;i<=n;i++){
      const t = i/n;
      const envelope = Math.pow(Math.sin(t*Math.PI), .62);

function buildBackground(){

    moonFace.addColorStop(.68,'rgba(235,219,190,.36)');
    moonFace.addColorStop(1,'rgba(221,205,181,.12)');
    g.fillStyle=moonFace;
    g.beginPath(); g.arc(moonX,moonY,moonR,0,TAU); g.fill();
    g.fillStyle='rgba(164,157,146,.07)';
    g.beginPath(); g.arc(moonX-moonR*.25,moonY+moonR*.12,moonR*.26,0,TAU); g.fill();

  // setting sun / moon glow
  const orbX = map.orb==='moon' ? W*.78 : sunX;

  const glow = g.createRadialGradient(orbX,orbY,0,orbX,orbY,W*.31);
  glow.addColorStop(0,`rgba(${glowR},${glowG},${glowB},.36)`);

  glow.addColorStop(.48,`rgba(${glowR},${glowG},${glowB},.08)`);
  glow.addColorStop(1,`rgba(${glowR},${glowG},${glowB},0)`);
  g.fillStyle=glow; g.fillRect(0,0,W,horizon+2);
  if(map.orb==='moon'){

    face.addColorStop(0,'rgba(238,250,250,.62)');

    g.fillStyle=face; g.beginPath(); g.arc(orbX,orbY,mr,0,TAU); g.fill();
    g.fillStyle='rgba(120,168,180,.12)';
    g.beginPath(); g.arc(orbX-mr*.24,orbY+mr*.16,mr*.22,0,TAU); g.fill();
    g.beginPath(); g.arc(orbX+mr*.3,orbY-mr*.3,mr*.14,0,TAU); g.fill();
  } else {

    g.beginPath(); g.arc(orbX,orbY,W*.016,0,TAU); g.fill();

    g.fillStyle=`rgba(${glowR},${glowG},${glowB},${.014+crng()*.03})`;

  }
  // mountains
  for(const layer of ridges){

    g.beginPath(); g.moveTo(layer.pts[0].x,layer.pts[0].y);
    for(let i=1;i<layer.pts.length;i++) g.lineTo(layer.pts[i].x,layer.pts[i].y);
    g.lineTo(W+30,layer.base+H*.025); g.lineTo(-30,layer.base+H*.025); g.closePath(); g.fill();
  }
  g.globalAlpha=1;
  // horizon haze
  const haze=g.createLinearGradient(0,horizon-H*.1,0,horizon+H*.03);
  haze.addColorStop(0,`rgba(${glowR},${glowG},${glowB},0)`);
  haze.addColorStop(.62,`rgba(${glowR},${glowG},${glowB},.14)`);
  haze.addColorStop(1,`rgba(${glowR},${glowG},${glowB},.05)`);
  g.fillStyle=haze; g.fillRect(0,horizon-H*.1,W,H*.135);
  // distant tree line
  if(map.trees){
    const trng=mulberry32(2029);
    for(let i=0;i<145;i++){
      const tx=trng()*W, th=H*(.008+trng()*.027)*(.7+trng()*.7), tw=th*(.33+trng()*.23);
      drawPineStatic(g,tx,horizon+2,th,tw,map.scene==='river'?'#10292a':'#102a2d');
    }
    // a few larger midground pines at the far edges
    for(let i=0;i<8;i++){
      const left=i<4;
      const tx=left?W*(.01+i*.026):W*(.88+(i-4)*.027);
      const th=H*(.055+trng()*.05);
      drawPineStatic(g,tx,horizon+H*.008,th,th*.26,'#0d2629');
    }
  } else if(map.palms){
    const prng=mulberry32(4111);
    for(let i=0;i<7;i++){

  const wStops=[0,.045,.14,.32,.62,1];
  map.water.forEach((col,i)=>water.addColorStop(wStops[i],col));

    g.beginPath();
    g.moveTo(layer.pts[0].x,horizon+(horizon-layer.pts[0].y)*scale);
    for(let i=1;i<layer.pts.length;i++){
      const p=layer.pts[i];
      g.lineTo(p.x,horizon+(horizon-p.y)*scale);
    }
    g.lineTo(W+30,horizon+2); g.lineTo(-30,horizon+2); g.closePath(); g.fill();
  }
  g.globalAlpha=1;
  // light reflection on water
  g.save();
  const beam=g.createLinearGradient(orbX,horizon,orbX,H*.8);
  beam.addColorStop(0,`rgba(${beamR},${beamG},${beamB},.30)`);
  beam.addColorStop(.3,`rgba(${beamR},${beamG},${beamB},.12)`);
  beam.addColorStop(.75,`rgba(${beamR},${beamG},${beamB},.025)`);
  beam.addColorStop(1,`rgba(${beamR},${beamG},${beamB},0)`);
  g.fillStyle=beam;

  g.moveTo(orbX-W*.02,horizon);

  g.lineTo(orbX+W*.12,H*.78);

  // distant shoreline and haze
  g.fillStyle='rgba(12,38,40,.55)'; g.fillRect(0,horizon,W,2);
  g.fillStyle=`rgba(${glowR},${glowG},${glowB},.13)`; g.fillRect(0,horizon+3,W,1);

function drawPineStatic(g,x,baseY,h,w,color){

    const t=j/4, yy=baseY-h*.66+t*h*.58, ww=w*(.36+t*.64), hh=h*.3*(1-t*.28);
    g.beginPath(); g.moveTo(x,yy-hh); g.lineTo(x-ww*.5,yy); g.lineTo(x+ww*.5,yy); g.closePath(); g.fill();
  }
}
function drawPalmStatic(g,x,baseY,h,w){
  g.strokeStyle='rgba(9,26,29,.92)'; g.lineWidth=Math.max(1.4,w*.13); g.lineCap='round';
  g.beginPath(); g.moveTo(x,baseY); g.quadraticCurveTo(x+w*.28,baseY-h*.55,x+w*.13,baseY-h); g.stroke();
  const tx=x+w*.13, ty=baseY-h;
  g.fillStyle='rgba(9,27,29,.9)';
  for(let i=0;i<7;i++){
    const a=-2.7+i*.55;
    g.save(); g.translate(tx,ty); g.rotate(a);
    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(w*1.2,-w*.34,w*2.2,w*.1);
    g.quadraticCurveTo(w*1.15,w*.1,0,w*.16); g.closePath(); g.fill();
    g.restore();
  }
}

function buildForeground(){
  fgCanvas = fgCanvas || document.createElement('canvas');
  fgCanvas.width = Math.round(W*DPR); fgCanvas.height = Math.round(H*DPR);
  const g = fgCanvas.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  const map=currentMap();
  const {tent,fire,lantern,chair}=layout;
  if(map.scene==='camp'||map.scene==='river'){
    // left bank
    let grad=g.createLinearGradient(0,H*.7,0,H);
    grad.addColorStop(0,map.scene==='river'?'#152420':'#14211f');
    grad.addColorStop(.45,'#0d1919'); grad.addColorStop(1,'#07100f');
    g.fillStyle=grad;
    g.beginPath();
    g.moveTo(-10,H*.65);
    g.bezierCurveTo(W*.055,H*.685,W*.12,H*.72,W*.158,H*.795);
    g.bezierCurveTo(W*.19,H*.86,W*.21,H*.94,W*.222,H+10);
    g.lineTo(-10,H+10); g.closePath(); g.fill();
    // right bank
    g.beginPath();
    g.moveTo(W+10,H*.64);
    g.bezierCurveTo(W*.905,H*.68,W*.825,H*.73,W*.775,H*.79);
    g.bezierCurveTo(W*.748,H*.85,W*.725,H*.94,W*.712,H+10);
    g.lineTo(W+10,H+10); g.closePath(); g.fill();
    // bottom foreground bank
    g.beginPath();
    g.moveTo(W*.20,H+8);
    g.bezierCurveTo(W*.37,H*.955,W*.55,H*.97,W*.755,H*.965);
    g.lineTo(W+10,H+10); g.lineTo(-10,H+10); g.closePath(); g.fill();
    // warm earth patches near camp
    for(const [cx,cy,r,col] of [[tent.cx,tent.baseY+7,tent.w*.62,'rgba(67,53,35,.20)'],[fire.x,fire.y+13,H*.055,'rgba(112,64,34,.16)']]){
      const rg=g.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=rg; g.beginPath(); g.ellipse(cx,cy,r,r*.35,0,0,TAU); g.fill();
    }
    // ground grass specks
    const rng=mulberry32(6621);
    for(let i=0;i<70;i++){
      let x,base;
      if(rng()<.5){ x=W*rng()*.23; base=H*(.76+rng()*.22); }
      else if(rng()<.55){ x=W*(.73+rng()*.27); base=H*(.74+rng()*.24); }
      else { x=W*(.18+rng()*.66); base=H*(.94+rng()*.06); }

    }
    drawTent(g,tent);
    drawLanternPole(g,lantern,tent);

    drawChair(g,chair);
    drawCampGear(g,fire,tent);
    drawForegroundGrass(g);
  } else if(map.scene==='pier'||map.scene==='reef'){
    drawPierForeground(g,map);
  } else {
    drawDeepForeground(g);
  }
}
function drawPierForeground(g,map){

function drawTent(g,t){
  const {cx,baseY,w,h}=t;

  lg.addColorStop(0,'#27352f'); lg.addColorStop(1,'#111e1c');
  g.fillStyle=lg;
  g.beginPath(); g.moveTo(cx-w*.52,baseY); g.lineTo(peakX,peakY); g.lineTo(cx+w*.03,baseY); g.closePath(); g.fill();
  // right panel
  let rg=g.createLinearGradient(cx,peakY,cx+w*.55,baseY);

  g.beginPath(); g.moveTo(peakX,peakY); g.lineTo(cx+w*.52,baseY); g.lineTo(cx+w*.03,baseY); g.closePath(); g.fill();

  }

  g.beginPath();
  g.moveTo(cx+w*.01,baseY-1); g.lineTo(cx+w*.09,baseY-h*.56); g.lineTo(cx+w*.24,baseY-1); g.closePath(); g.fill();
  g.fillStyle='rgba(215,143,76,.18)';
  g.beginPath();
  g.moveTo(cx+w*.075,baseY-3); g.lineTo(cx+w*.09,baseY-h*.49); g.lineTo(cx+w*.165,baseY-3); g.closePath(); g.fill();
  // rolled flap
  g.strokeStyle='rgba(93,107,84,.4)'; g.lineWidth=2;
  g.beginPath(); g.moveTo(cx+w*.01,baseY-2); g.quadraticCurveTo(cx+w*.035,baseY-h*.38,cx+w*.08,baseY-h*.56); g.stroke();
  // ridge line
  g.strokeStyle='rgba(178,174,142,.17)'; g.lineWidth=1.2;

  // guy ropes and pegs

  const ropes=[[peakX+3,peakY+h*.08,cx-w*.72,baseY-2],[peakX+5,peakY+h*.12,cx+w*.73,baseY+1]];
  for(const [x1,y1,x2,y2] of ropes){
    g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke();

}
function drawLanternPole(g,lantern,t){

/* ============================================================
   WATER, SKY, LIGHT & SMALL PARTICLES
   ============================================================ */
function buildWaterParticles(){
  const rng=mulberry32(9131);
  const map=currentMap();
  waves=[];
  const count=Math.round(clamp(W*H/18000,55,145));
  for(let i=0;i<count;i++){
    const depth=Math.pow(rng(),1.55);
    waves.push({
      nx:rng()*1.1-.05, ny:.015+depth*.93,
      len:W*(.01+rng()*.055)*(0.4+depth),
      speed:(.003+rng()*.012)*(.4+depth*.8),
      phase:rng()*TAU, freq:.5+rng()*1.7,
      alpha:.035+rng()*.11,
      width:.5+rng()*1.1,
      warm:rng()<map.warmRatio
    });
  }
  glints=[];
  for(let i=0;i<54;i++){
    const ny=.018+Math.pow(rng(),1.4)*.82;
    glints.push({
      sx:rng()*2-1, ny,
      span:W*(.008+rng()*.038)*(0.35+ny),
      phase:rng()*TAU, speed:.45+rng()*1.9,
      alpha:.07+rng()*.22, warm:rng()<Math.max(.2,map.warmRatio*2.4)
    });
  }
}
function buildClouds(){
  const map=currentMap();
  if(cloudSpritesMap!==currentMapId){
    cloudSpritesMap=currentMapId;
    const base=map.cloudRGB;
    cloudSprites=[makeCloudSprite(31,`rgba(${base},`),makeCloudSprite(57,`rgba(${base},`),makeCloudSprite(89,`rgba(${base},`)];
  }
  clouds=[];
  const rng=mulberry32(307);
  for(let i=0;i<map.clouds;i++){
    clouds.push({
      x:rng()*1.2-.1, y:.055+rng()*.16,
      scale:.35+rng()*.72, speed:.0015+rng()*.004,
      alpha:.16+rng()*.22, sprite:i%3, flip:rng()>.5
    });
  }
}
function makeCloudSprite(seed,colorPrefix){
  const c=document.createElement('canvas'); c.width=360; c.height=140;
  const g=c.getContext('2d'); const rng=mulberry32(seed);
  const puffs=[];
  for(let i=0;i<11;i++){
    puffs.push({x:58+rng()*244,y:74+(rng()-.5)*28,rx:31+rng()*45,ry:13+rng()*21});
  }
  for(const p of puffs){
    const rg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.rx);
    rg.addColorStop(0,colorPrefix+'.13)');
    rg.addColorStop(.58,colorPrefix+'.055)');
    rg.addColorStop(1,colorPrefix+'0)');
    g.save(); g.translate(p.x,p.y); g.scale(1,p.ry/p.rx); g.translate(-p.x,-p.y);
    g.fillStyle=rg; g.beginPath(); g.arc(p.x,p.y,p.rx,0,TAU); g.fill(); g.restore();
  }
  return c;
}
function buildFireflies(){
  const rng=mulberry32(4477);
  const map=currentMap();
  fireflies=[];
  for(let i=0;i<map.fireflies;i++){
    const right=i%2===0;
    fireflies.push({
      nx:right? .58+rng()*.38 : .03+rng()*.3,
      ny: .42+rng()*.42,
      phase:rng()*TAU, speed:.25+rng()*.55,
      amp:6+rng()*18, size:.7+rng()*1.2,
      alpha:.2+rng()*.55, drift:rng()*TAU
    });
  }
}
function drawSky(t){
  ctx.save();
  ctx.globalCompositeOperation='screen';
  for(const c of clouds){
    if(c.x>1.25) c.x=-.3;
    const spr=cloudSprites[c.sprite];
    const sw=W*.32*c.scale, sh=sw*(140/360);
    ctx.globalAlpha=c.alpha;
    ctx.save();
    ctx.translate(c.x*W,c.y*H);
    if(c.flip) ctx.scale(-1,1);
    ctx.drawImage(spr,-sw/2,-sh/2,sw,sh);
    ctx.restore();
  }
  // scarce twinkling stars
  ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const a=s.a*(.42+.58*(.5+.5*Math.sin(t*s.speed+s.phase)));
    if(a<.08) continue;
    ctx.fillStyle=`rgba(245,236,216,${a})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function drawWater(t){
  const map=currentMap();
  ctx.save();
  ctx.beginPath(); ctx.rect(0,horizon,W,H-horizon); ctx.clip();
  // slow moving bands of reflected light
  const sunX=map.orb==='moon'?W*.78:W*(portrait?.59:.655);
  ctx.globalCompositeOperation='screen';
  for(let i=0;i<3;i++){
    const a=.012+.008*Math.sin(t*.21+i*1.8);
    ctx.fillStyle=`rgba(${map.glowRGB},${Math.max(0,a)})`;
    const yy=horizon+H*(.05+i*.09);
    ctx.beginPath(); ctx.ellipse(sunX+Math.sin(t*.12+i)*W*.025,yy,W*(.16-i*.025),H*.022,0,0,TAU); ctx.fill();
  }
  // light glints
  for(const s of glints){
    const x=sunX+s.sx*W*.11+Math.sin(t*s.speed*.24+s.phase)*W*.025;
    const y=horizon+s.ny*(H-horizon);
    const a=s.alpha*(.35+.65*(.5+.5*Math.sin(t*s.speed+s.phase)));
    if(a<.02) continue;
    ctx.strokeStyle=s.warm?`rgba(${map.glintWarm},${a})`:`rgba(${map.glintCool},${a*.7})`;
    ctx.lineWidth=.65+s.alpha*2.6;
    const half=s.span*(.55+.45*Math.sin(t*.5+s.phase));
    ctx.beginPath(); ctx.moveTo(x-half,y);
    ctx.quadraticCurveTo(x,y-1.2,x+half,y); ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';
  // surface ripples / tiny waves
  for(const w of waves){
    let x=((w.nx+t*w.speed)%1.15)*W-W*.06;
    const y=horizon+w.ny*(H-horizon);
    const sway=Math.sin(t*w.freq+w.phase);
    const a=w.alpha*(.62+.38*sway);
    ctx.strokeStyle=w.warm?`rgba(${map.glintWarm},${a*.75})`:`rgba(${map.glintCool},${a})`;
    ctx.lineWidth=w.width;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.quadraticCurveTo(x+w.len*.5,y-1.2-w.ny*1.5,x+w.len,y);
    ctx.stroke();
  }
  // foreground edge darkness
  const vg=ctx.createLinearGradient(0,H*.7,0,H);
  vg.addColorStop(0,'rgba(6,20,26,0)'); vg.addColorStop(1,'rgba(4,14,20,.46)');
  ctx.fillStyle=vg; ctx.fillRect(0,H*.7,W,H*.3);
  ctx.restore();
}
function spawnRipple(nx,ny,maxR=46,strength=1,delay=0){
  ripples.push({nx,ny,r:1,maxR,life:1,delay,strength,speed:rand(.75,1.25)});
}
function spawnSplash(nx,ny,amount=12,strength=1){
  const x=nx*W, y=ny*H;
  const scale=clamp(.6+(ny-.4)*1.2,.6,1.3);
  for(let i=0;i<amount;i++){
    const a=rand(-Math.PI*.92,-Math.PI*.08);
    const sp=rand(18,70)*strength*scale;
    particles.push({
      x,y,vx:Math.cos(a)*sp*.7,vy:Math.sin(a)*sp,
      life:rand(.35,.85),max:1,size:rand(.7,2.5)*scale,
      gravity:150,color:Math.random()<.18?'rgba(244,220,184,':'rgba(211,231,225,'
    });
  }
}
function updateRipples(dt){
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i];
    if(r.delay>0){ r.delay-=dt; continue; }
    r.life-=dt*.62;
    r.r += dt*(46+r.maxR)*r.speed*.42;
    if(r.life<=0 || r.r>r.maxR) ripples.splice(i,1);
  }
}
function drawRipples(){
  for(const r of ripples){
    if(r.delay>0) continue;
    const x=r.nx*W, y=r.ny*H;
    const a=Math.max(0,r.life)*.32*r.strength;
    const ry=Math.max(.65,r.r*.27);
    ctx.strokeStyle=`rgba(220,226,210,${a})`;
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(x,y,r.r,ry,0,0,TAU); ctx.stroke();
    if(r.r>8){
      ctx.strokeStyle=`rgba(237,221,192,${a*.35})`;
      ctx.beginPath(); ctx.ellipse(x,y,Math.max(1,r.r*.65),Math.max(.6,ry*.65),0,0,TAU); ctx.stroke();
    }
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt;
    p.vy+=p.gravity*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    const a=clamp(p.life*2.2,0,.65);
    ctx.fillStyle=p.color+a+')';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*clamp(p.life*2,0,1),0,TAU); ctx.fill();
  }
}

/* ---------- warm camp light / fire / lantern ---------- */
function drawCampfire(t){
  const f=layout.fire, s=f.scale;
  const x=f.x, y=f.y+2*s;
  // big low glow, with a soft pool of light on the ground
  ctx.save();
  ctx.globalCompositeOperation='screen';
  const glowRadius=118*s;
  const gl=ctx.createRadialGradient(x,y-12*s,0,x,y-12*s,glowRadius);
  gl.addColorStop(0,'rgba(255,151,67,.24)');
  gl.addColorStop(.34,'rgba(244,121,54,.11)');
  gl.addColorStop(.7,'rgba(225,94,40,.035)');
  gl.addColorStop(1,'rgba(220,87,38,0)');
  ctx.fillStyle=gl;
  ctx.beginPath(); ctx.arc(x,y-12*s,glowRadius,0,TAU); ctx.fill();
  const pool=ctx.createRadialGradient(x,y+2*s,0,x,y+2*s,70*s);
  pool.addColorStop(0,'rgba(255,143,63,.17)');
  pool.addColorStop(1,'rgba(220,87,38,0)');
  ctx.fillStyle=pool;
  ctx.beginPath(); ctx.ellipse(x,y+4*s,72*s,22*s,0,0,TAU); ctx.fill();
  // thin smoke
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(151,147,134,.035)'; ctx.lineWidth=2.4*s;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(x+(i-1)*7*s,y-38*s);
    ctx.bezierCurveTo(x+(i-1)*8*s+Math.sin(t*.55+i)*9*s,y-65*s,x+(i-1)*5*s+Math.sin(t*.48+i*2)*16*s,y-92*s,x+(i-1)*3*s+Math.sin(t*.4+i*3)*22*s,y-115*s);
    ctx.stroke();
  }
  // three softly separated flame tongues
  const flick=.9+.07*Math.sin(t*8.3)+.05*Math.sin(t*13.1+1.8)+.025*Math.sin(t*21.7);
  const h=(47+8*Math.sin(t*4.7))*s*flick, w=22*s;
  function flameTongue(ox,hh,ww,sway,alpha,g0,g1,g2){
    const grd=ctx.createLinearGradient(x+ox,y,x+ox,y-hh*1.15);
    grd.addColorStop(0,g0); grd.addColorStop(.42,g1); grd.addColorStop(.78,g2); grd.addColorStop(1,'rgba(255,220,142,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.moveTo(x+ox-ww,y+1*s);
    ctx.bezierCurveTo(x+ox-ww*1.08,y-hh*.28,x+ox-ww*.6,y-hh*.54,x+ox+sway,y-hh);
    ctx.bezierCurveTo(x+ox+ww*.58,y-hh*.56,x+ox+ww*1.03,y-hh*.26,x+ox+ww,y+1*s);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=.88;
  flameTongue(-9*s,h*.62,w*.52,Math.sin(t*6.1)*4*s,.6,'rgba(192,57,22,.9)','rgba(234,104,38,.82)','rgba(250,166,66,.5)');
  flameTongue(10*s,h*.54,w*.46,Math.sin(t*7.2+1.4)*4.5*s,.55,'rgba(203,66,25,.9)','rgba(240,119,41,.8)','rgba(255,178,76,.46)');
  flameTongue(0,h,w*.65,Math.sin(t*5.8)*4*s,1,'rgba(235,101,35,.96)','rgba(249,151,55,.94)','rgba(255,202,104,.58)');
  // glowing coals and charred logs in front of the base
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,174,74,.9)';
  ctx.beginPath(); ctx.ellipse(x,y+1*s,w*.72,2.6*s,0,0,TAU); ctx.fill();
  ctx.strokeStyle='#19130f'; ctx.lineWidth=5*s; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-w*.95,y+2*s); ctx.lineTo(x+w*.85,y-1*s); ctx.stroke();
  ctx.strokeStyle='#2b1c13'; ctx.lineWidth=4*s;
  ctx.beginPath(); ctx.moveTo(x-w*.75,y-3*s); ctx.lineTo(x+w*.65,y+3*s); ctx.stroke();
  ctx.strokeStyle='rgba(237,112,44,.55)'; ctx.lineWidth=1.1*s;
  ctx.beginPath(); ctx.moveTo(x-w*.65,y+1*s); ctx.lineTo(x+w*.35,y-2*s); ctx.stroke();
  ctx.globalCompositeOperation='screen';
  // embers
  for(const e of embers){
    e.life-=.012;
    e.y-=e.speed/60; e.x+=Math.sin(t*4+e.phase)*.18;
    if(e.life<=0){ e.life=rand(.5,1.6); e.x=x+rand(-10,10)*s; e.y=y-rand(4,22)*s; e.speed=rand(12,34); }
    ctx.fillStyle=`rgba(255,178,88,${clamp(e.life,0,.8)})`;
    ctx.beginPath(); ctx.arc(e.x,e.y,e.size,0,TAU); ctx.fill();
  }
  ctx.restore();
}

function drawForegroundBranch(t){

      const nx=bx-W*.03-j*W*.006, ny=by+H*.006+j*H*.004;
      ctx.beginPath(); ctx.ellipse(nx,ny,W*.012,H*.0032,-.35,0,TAU); ctx.fill();
    }

}
function drawSwayingGrass(t){
  const rng=mulberry32(8123);
  ctx.strokeStyle='rgba(29,45,36,.55)'; ctx.lineWidth=1;
  for(let i=0;i<10;i++){
    const left=i<5;
    const x=left?W*rng()*.2:W*(.74+rng()*.25);
    const base=H*(.86+rng()*.1);
    const hh=H*(.035+rng()*.035);

/* ============================================================
   ROD, LINE, BOBBER, FISH
   ============================================================ */
function targetScreen(){ return { x:target.nx*W, y:target.ny*H }; }
function desiredRodTip(t){
  const wind=Math.sin(t*.55)*2.2 + Math.sin(t*1.07+2)*1.1;
  const base={ x:W*.615+wind, y:H*.225+Math.sin(t*.86)*2.4 };
  if(state===STATE.CASTING){
    const p=invLerp(0,CONFIG.cast.duration,stateTime);
    const idle={x:W*.615,y:H*.225};
    const back={x:W*.735,y:H*.118};
    const forward={x:W*.475,y:H*.285};
    const settle={x:W*.61,y:H*.245};
    if(p<.25) return mixPoint(idle,back,easeOut(p/.25));
    if(p<.50) return mixPoint(back,forward,easeInOut((p-.25)/.25));
    if(p<.78) return mixPoint(forward,settle,easeOut((p-.5)/.28));
    return settle;
  }
  if(state===STATE.BITE){
    const pulse=Math.sin(t*20)*2.2;
    return { x:base.x-W*.012+pulse, y:base.y+H*.024+Math.sin(t*13)*2 };
  }
  if(state===STATE.FIGHT && fight){
    const tn=clamp(fight.tension/(fight.maxTension||CONFIG.fight.tensionMax),0,1);
    const pull=fight.pullTimer>0?1:0;
    const toward=targetScreen();
    const side=Math.sin(t*3.3)*2.1 + (pull?Math.sin(t*22)*2.8:0);
    if(fight.hookTime>0){
      const k=1-fight.hookTime/CONFIG.fight.hookTime;
      const lift=Math.sin(clamp(k,0,1)*Math.PI)*H*.075;
      return {
        x:base.x+(toward.x-base.x)*.035+Math.sin(t*26)*1.8,
        y:base.y+H*.018-lift
      };
    }
    return {
      x: base.x+(toward.x-base.x)*(.07+.075*tn)+side*1.3,
      y: base.y+H*(.028+.075*tn)+Math.sin(t*(pull?18:7))* (pull?3:1.2)
    };
  }
  if(state===STATE.CAUGHT){
    const p=clamp(stateTime/.55,0,1);
    return { x:lerp(base.x,W*.47,easeOut(p)), y:lerp(base.y,H*.085,easeOut(p)) };
  }
  if(state===STATE.LOST){
    const p=clamp(stateTime/.45,0,1);
    return { x:lerp(base.x,W*.69,easeOut(p)), y:lerp(base.y,H*.105,easeOut(p)) };
  }
  return base;
}
function mixPoint(a,b,t){ return {x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t)}; }
function updateRod(dt,t){
  const d=desiredRodTip(t);
  rod.desired=d;
  if(!rod.init){ rod.tip={...d}; rod.init=true; return; }
  const rate=state===STATE.CASTING?16:(state===STATE.FIGHT?9:5.2);
  const k=1-Math.exp(-rate*dt);
  rod.tip.x=lerp(rod.tip.x,d.x,k);
  rod.tip.y=lerp(rod.tip.y,d.y,k);
}
function cubicPoint(p0,p1,p2,p3,t){
  const m=1-t;
  return {
    x:m*m*m*p0.x+3*m*m*t*p1.x+3*m*t*t*p2.x+t*t*t*p3.x,
    y:m*m*m*p0.y+3*m*m*t*p1.y+3*m*t*t*p2.y+t*t*t*p3.y
  };
}
function rodCurve(){
  const base={x:W*.925,y:H*1.085};
  const tip=rod.tip;
  const dx=tip.x-base.x, dy=tip.y-base.y;
  const dist=Math.hypot(dx,dy)||1;
  const nx=-dy/dist, ny=dx/dist;
  const tn=fight?clamp(fight.tension/(fight.maxTension||CONFIG.fight.tensionMax),0,1):0;
  const bend=dist*(.022+.042*tn+(state===STATE.CASTING?.012:0));
  const p1={ x:base.x+dx*.29+nx*bend*.8, y:base.y+dy*.29+ny*bend*.8 };
  const p2={ x:base.x+dx*.67+nx*bend*1.8, y:base.y+dy*.67+ny*bend*1.8 };
  return {base,p1,p2,tip,dist,nx,ny,tn};
}
function drawRod(t){
  const curve=rodCurve();
  const gripPoint=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,.105);
  drawArm(gripPoint,t);
  const N=30, pts=[];
  for(let i=0;i<=N;i++){
    const q=i/N;
    const p=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,q);
    const q2=Math.min(1,q+.008);
    const pn=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,q2);
    let tx=pn.x-p.x, ty=pn.y-p.y; const len=Math.hypot(tx,ty)||1;
    tx/=len; ty/=len;
    const width=lerp(6.5,.95,Math.pow(q,.72))*clamp(Math.min(W,H)/800,.82,1.3);
    pts.push({x:p.x,y:p.y,nx:-ty,ny:tx,w:width,q});
  }
  // tapered rod body
  const grad=ctx.createLinearGradient(curve.base.x,curve.base.y,curve.tip.x,curve.tip.y);
  grad.addColorStop(0,'#1b1511');
  grad.addColorStop(.16,'#33261b');
  grad.addColorStop(.58,'#6d4b31');
  grad.addColorStop(.83,'#8c623d');
  grad.addColorStop(1,'#a57a51');
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const p=pts[i]; const x=p.x+p.nx*p.w*.5, y=p.y+p.ny*p.w*.5;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i]; ctx.lineTo(p.x-p.nx*p.w*.5,p.y-p.ny*p.w*.5);
  }
  ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
  // highlight
  ctx.strokeStyle='rgba(240,196,143,.22)'; ctx.lineWidth=.85;
  ctx.beginPath();
  for(let i=3;i<pts.length;i++){
    const p=pts[i]; const x=p.x-p.nx*p.w*.23, y=p.y-p.ny*p.w*.23;
    if(i===3) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  // grip
  ctx.strokeStyle='#191713'; ctx.lineWidth=11*clamp(Math.min(W,H)/800,.82,1.3); ctx.lineCap='round';
  ctx.beginPath();
  const a=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,.012);
  const b=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,.09);
  ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  ctx.strokeStyle='rgba(137,110,73,.28)'; ctx.lineWidth=1;
  for(let i=1;i<7;i++){
    const q=i/8, p=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,.012+q*.078);
    ctx.beginPath(); ctx.moveTo(p.x-5,p.y-2); ctx.lineTo(p.x+5,p.y+2); ctx.stroke();
  }
  // guides
  ctx.strokeStyle='rgba(195,185,159,.5)';
  for(const q of [.31,.5,.68,.83,.94]){
    const p=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,q);
    const p2=cubicPoint(curve.base,curve.p1,curve.p2,curve.tip,Math.min(1,q+.005));
    const tx=p2.x-p.x, ty=p2.y-p.y, len=Math.hypot(tx,ty)||1;
    const nx=-ty/len, ny=tx/len, w=lerp(6.5,.95,Math.pow(q,.72))*2.1;
    ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(p.x-nx*w*.5,p.y-ny*w*.5); ctx.lineTo(p.x+nx*w*.5,p.y+ny*w*.5); ctx.stroke();
  }
  // reel
  drawReel(t,curve,gripPoint);
  // fingers over the grip
  drawHand(gripPoint,t);
  // tip bead
  ctx.fillStyle='rgba(209,145,82,.7)';
  ctx.beginPath(); ctx.arc(curve.tip.x,curve.tip.y,1.8,0,TAU); ctx.fill();
}
function drawReel(t,c,grip){
  const p=cubicPoint(c.base,c.p1,c.p2,c.tip,.155);
  const s=clamp(Math.min(W,H)/820,.8,1.35);
  const ox=p.x+c.nx*8*s, oy=p.y+c.ny*8*s;
  ctx.save(); ctx.translate(ox,oy); ctx.rotate(-.18);
  ctx.fillStyle='#181a16';
  ctx.beginPath(); ctx.ellipse(0,6*s,8*s,10*s,0,0,TAU); ctx.fill();
  ctx.fillStyle='#30352b';

function drawArm(grip,t){

function drawHand(grip,t){

function bobberFlight(t){
  if(state!==STATE.CASTING) return null;
  const start=CONFIG.cast.flightStart, end=CONFIG.cast.flightEnd;
  if(stateTime<start) return null;
  const p=clamp((stateTime-start)/(end-start),0,1);
  const ts=targetScreen();
  const e=easeOut(p);
  const arc=CONFIG.cast.arc*clamp(H/800,.75,1.3);
  return {
    x:lerp(castStart.x,ts.x,e),
    y:lerp(castStart.y,ts.y,e)-Math.sin(Math.PI*p)*arc,
    p, airborne:true
  };
}
function bobberPosition(t){
  const ts=targetScreen();
  if(state===STATE.CASTING) return bobberFlight(t);
  if(state===STATE.WAITING){
    return {x:ts.x+Math.sin(t*1.2)*1.2,y:ts.y+Math.sin(t*2.1)*1.8,p:1,airborne:false};
  }
  if(state===STATE.BITE){
    return {x:ts.x+Math.sin(t*14)*2.1,y:ts.y+9+Math.sin(t*16)*2.3,p:1,airborne:false};
  }
  if(state===STATE.FIGHT){
    return {
      x:ts.x+(fight?fight.offsetX:0)+Math.sin(t*3.1)*2.2,
      y:ts.y+7+Math.sin(t*6.5)*2+(fight&&fight.pullTimer>0?4:0),
      p:1,airborne:false
    };
  }
  return null;
}
function drawFishingLineAndBobber(t){
  const bp=bobberPosition(t);
  if(!bp) return;
  const tip=rod.tip;
  let sag=8;
  if(state===STATE.FIGHT) sag=2.2+Math.max(0,3.5-fight.tension*.03);
  if(state===STATE.BITE) sag=2.8;
  if(bp.airborne) sag=4.5;
  const midx=(tip.x+bp.x)/2, midy=(tip.y+bp.y)/2+sag;
  ctx.save();
  ctx.strokeStyle='rgba(11,18,18,.68)'; ctx.lineWidth=1.25;
  ctx.beginPath(); ctx.moveTo(tip.x,tip.y); ctx.quadraticCurveTo(midx,midy,bp.x,bp.y); ctx.stroke();
  ctx.strokeStyle='rgba(238,231,205,.35)'; ctx.lineWidth=.5;
  ctx.beginPath(); ctx.moveTo(tip.x,tip.y-1); ctx.quadraticCurveTo(midx,midy-1,bp.x,bp.y-1); ctx.stroke();
  ctx.restore();
  drawBobber(bp,t);
}
function drawBobber(bp,t){

  ctx.beginPath(); ctx.ellipse(0,-2.6*s,3.5*s,3.2*s,0,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,228,190,.52)';

  ctx.strokeStyle='rgba(68,47,37,.5)'; ctx.lineWidth=.55;

  }

}
function drawCatchFish(t){
  if(state!==STATE.CAUGHT || !lastResult || !lastResult.fish) return;
  const age=stateTime;
  const fish=lastResult.fish;
  const ts=targetScreen();
  let x,y,scale=.9,rot=0,alpha=1;
  if(age<.16) return;

  x=lerp(ts.x,W*.5,easeOut(p));
  y=lerp(ts.y,H*.43,easeOut(p))-Math.sin(p*Math.PI)*H*.17;
  rot=lerp(.4,-.28,easeOut(p))+Math.sin(p*Math.PI*2)*.13;

  ctx.beginPath(); ctx.arc(len*.24,-h*.05,h*.22,-1.1,1.1); ctx.stroke();
  ctx.strokeStyle='rgba(255,245,215,.25)'; ctx.lineWidth=Math.max(1,len*.015);
  ctx.beginPath(); ctx.moveTo(-len*.25,-h*.16); ctx.quadraticCurveTo(-len*.02,-h*.32,len*.21,-h*.16); ctx.stroke();
  ctx.restore();
}
function drawReticle(t){
  if(state!==STATE.IDLE || !pointer.inside || pointer.type==='touch') return;
  if(!isWaterPoint(pointer.x,pointer.y)) return;
  const a=.34+.16*Math.sin(t*2.2);
  ctx.save();
  ctx.translate(pointer.x,pointer.y);
  ctx.strokeStyle=`rgba(236,219,184,${a})`; ctx.lineWidth=.8;
  ctx.beginPath(); ctx.arc(0,0,11+Math.sin(t*1.8)*.8,0,TAU); ctx.stroke();
  ctx.fillStyle=`rgba(236,219,184,${a*1.4})`;
  ctx.beginPath(); ctx.arc(0,0,1.1,0,TAU); ctx.fill();
  ctx.strokeStyle=`rgba(236,219,184,${a*.55})`;
  for(let i=0;i<4;i++){
    const ang=i*Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(ang)*15,Math.sin(ang)*15);
    ctx.lineTo(Math.cos(ang)*19,Math.sin(ang)*19); ctx.stroke();
  }
  ctx.restore();
}

function registerCatch(fish){
  const prev = dex[fish.id];
  const first = !prev;
  const best = !prev || fish.size > prev.best;
  dex[fish.id] = {
    count: (prev ? prev.count : 0) + 1,
    best: best ? fish.size : prev.best,
    bestGrade: best ? fish.grade : prev.bestGrade,
    first: prev ? prev.first : Date.now(),
    last: Date.now()
  };
  const inv = inventory[fish.id] || { count:0, value:0, best:0, bestGrade:'F' };
  inv.count++;
  inv.value += fish.value;
  if(fish.size > inv.best){ inv.best = fish.size; inv.bestGrade = fish.grade; }

  lastCatchWasNew = first;
  updateMetaUI();

function updateCamera(dt,t){
  let target=0;

    const warnT=(fight.maxTension||CONFIG.fight.tensionMax)*(CONFIG.fight.warning/CONFIG.fight.tensionMax);
    target = fight.pullTimer>0?1.9:Math.max(0,(fight.tension-warnT)*.035);
  }
  if(target>0) camera.shake=Math.max(camera.shake,target*.35);
  camera.shake=Math.max(0,camera.shake-dt*4.5);
  const s=camera.shake;
  camera.x=Math.sin(t*57)*s*.72+Math.sin(t*31+1.2)*s*.28+Math.sin(t*.27)*.55;

  // fish resistance bursts
  if(active){
    fight.nextPull-=dt;
    if(fight.nextPull<=0 && fight.pullTimer<=0){
      fight.pullTimer=rand(CONFIG.fight.pullDurationMin,CONFIG.fight.pullDurationMax);
      fight.nextPull=rand(CONFIG.fight.pullMin,CONFIG.fight.pullMax)+fight.pullTimer;
      fight.direction=Math.random()<.5?-1:1;
      fight.sprayTimer=0;
      Sound.splash(.6);
      addShake(1.9);
    }
    if(fight.pullTimer>0){
      fight.pullTimer-=dt;
      fight.offsetX=lerp(fight.offsetX,fight.direction*20*clamp(H/800,.7,1.3),1-Math.exp(-8*dt));
      fight.sprayTimer-=dt;
      if(fight.sprayTimer<=0){
        fight.sprayTimer=rand(.16,.27);
        spawnSplash(target.nx+fight.offsetX/W,target.ny,.7);
        spawnRipple(target.nx+fight.offsetX/W,target.ny,26,.55,0);
      }
    } else {
      fight.offsetX=lerp(fight.offsetX,Math.sin(elapsed*2.1)*4,1-Math.exp(-3*dt));
    }
    const pulling=fight.pullTimer>0;
    const maxT=fight.maxTension||CONFIG.fight.tensionMax;
    const warnT=maxT*(CONFIG.fight.warning/CONFIG.fight.tensionMax);
    const dangerT=maxT*(CONFIG.fight.danger/CONFIG.fight.tensionMax);
    if(fight.reeling){
      fight.progress += dt*CONFIG.fight.reelProgress*f.reel*(fight.rodReel||1)*(pulling?CONFIG.fight.pullProgressFactor:1);
      fight.tension += dt*CONFIG.fight.tensionRise*f.strength*(pulling?1.55:1);
      if(pulling) fight.tension += dt*CONFIG.fight.pullExtraTension;
      if(Math.random()<dt*4){
        spawnRipple(target.nx+fight.offsetX/W,target.ny,18,.22,0);
      }
    } else {
      fight.tension -= dt*CONFIG.fight.tensionFall;
      fight.progress -= dt*CONFIG.fight.progressFall;
    }
    if(pulling && !fight.reeling) fight.tension += dt*1.6;
    fight.tension=clamp(fight.tension,0,maxT);
    fight.progress=clamp(fight.progress,0,CONFIG.fight.progressMax);
    dom.tension.style.transform=`scaleX(${fight.tension/maxT})`;
    dom.progress.style.transform=`scaleX(${fight.progress/CONFIG.fight.progressMax})`;
    dom.danger.classList.toggle('on',fight.tension>=dangerT);
    if(fight.tension>=maxT-.05){ startLost('snap'); return; }
    if(fight.progress>=CONFIG.fight.progressMax-.05){ startCatch(); return; }
    if(fight.tension>=warnT && !fight.warningPlayed){
      fight.warningPlayed=true;
      showToast('장력이 높아요 · 손을 떼어 보세요');
    }
    if(fight.tension<warnT*.8) fight.warningPlayed=false;
  }
}
function showResultCard(){
  if(!lastResult || resultShown) return;
  resultShown=true;
  const caught=lastResult.type==='caught';
  const fish=lastResult.fish;
  dom.result.classList.toggle('golden',caught && fish && fish.tier>=9);
  dom.result.classList.toggle('lost',!caught);
  if(caught && fish){
    dom.resultNew.style.display = lastResult.isNew ? '' : 'none';
    dom.resultKickerText.textContent = lastResult.isNew ? '새로운 발견 · ' : '정체 공개 · ';
    dom.resultRarity.textContent = `${fish.tier} · ${fish.rarityLabel}`;
    dom.resultRarity.style.color = fish.rarityColor;
    dom.resultArt.innerHTML=fishSVG(fish);
    dom.resultName.textContent=fish.name;
    dom.resultSize.textContent=fmtSize(fish.size);
    resultSizeWrap.style.display='';
    dom.resultBadges.style.display='';
    dom.resultRarityBadge.style.setProperty('--badge',fish.rarityColor);
    dom.resultRarityText.textContent=`${fish.tier}등급 · ${fish.rarityLabel}`;
    dom.resultGrade.className=`grade-badge grade-${fish.grade}`;
    dom.resultGrade.textContent=fish.grade;
    dom.resultValue.style.display='';
    dom.resultValue.innerHTML=`예상 판매가 <b>${formatCoins(fish.value)}</b> 코인 · 수족관에 보관했어요`;
    dom.resultNote.textContent=fish.desc;
  } else {
    dom.resultNew.style.display='none';
    dom.resultKickerText.textContent='아쉬운 순간 · ';
    dom.resultRarity.textContent='놓침';
    dom.resultRarity.style.color='';
    dom.resultBadges.style.display='none';
    dom.resultValue.style.display='none';
    dom.resultArt.innerHTML=`<div class="lost-mark">
      <svg viewBox="0 0 72 72" width="56" height="56" fill="none" aria-hidden="true">
        <path d="M7 46c8-6 15-6 23 0s15 6 23 0 9-4 12-2" stroke="rgba(214,224,213,.44)" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M10 53c7-3 12-3 19 0s12 3 19 0" stroke="rgba(204,216,205,.16)" stroke-width="1" stroke-linecap="round"/>
        <path d="M38 10c6 7 7 15 1 23-3 4-5 8-2 12" stroke="rgba(230,210,173,.54)" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M31 45l-6 7M43 45l5 7" stroke="rgba(230,210,173,.32)" stroke-width="1.1" stroke-linecap="round"/>
        <circle cx="38" cy="10" r="1.7" fill="rgba(235,203,151,.58)"/>
      </svg>
    </div>`;
    dom.resultName.textContent='도망갔어요';
    resultSizeWrap.style.display='none';
    dom.resultNote.textContent=lastResult.reason==='snap'
      ? '장력이 너무 높아 낚싯줄이 끊어졌어요. 다음엔 조금 더 천천히 감아 보세요.'
      : '입질의 순간을 놓쳤어요. 다시 차분히 기다려 보세요.';
  }
  dom.result.classList.add('show');
}
function hideResult(){
  dom.result.classList.remove('show','golden','lost');
  resultShown=false;
}
function showToast(message){
  dom.toast.textContent=message;
  dom.toast.classList.add('show');
  toastHiddenAt=elapsed+2.35;
}
function updateToast(){
  if(dom.toast.classList.contains('show') && elapsed>toastHiddenAt){
    dom.toast.classList.remove('show');
  }
}
function update(dt,t){
  elapsed+=dt;
  updateRod(dt,t);
  updateCamera(dt,t);
  updateRipples(dt);
  updateParticles(dt);
  for(const c of clouds) c.x += c.speed*dt;
  if(!modalOpen){
    stateTime+=dt;
    if(state===STATE.CASTING) updateCasting(dt);
    else if(state===STATE.WAITING){
      waitTimer-=dt;
      bobberRippleTimer-=dt;
      if(bobberRippleTimer<=0 && waitTimer>.35){
        spawnRipple(target.nx,target.ny,22,.35,0);
        bobberRippleTimer=rand(1.1,2.2);
      }
      if(waitTimer<=0) startBite();
    }
    else if(state===STATE.BITE){
      biteTimer-=dt;
      dom.biteTimer.style.transform=`scaleX(${clamp(biteTimer/CONFIG.cast.biteWindow,0,1)})`;
      if(Math.random()<dt*8) spawnRipple(target.nx,target.ny,34,.4,0);
      if(biteTimer<=0) missBite();
    }
    else if(state===STATE.FIGHT){
      updateFight(dt);
    }
    else if(state===STATE.CAUGHT || state===STATE.LOST){
      if(!resultShown && lastResult){
        const delay=lastResult.type==='caught'?CONFIG.result.caughtShow:CONFIG.result.lostShow;
        if(stateTime>=delay) showResultCard();
      }
    }
  }
  updateToast();
  Sound.update(dt,!modalOpen && state===STATE.FIGHT && fight && fight.reeling && fight.hookTime<=0);
}
function updatePointer(e){
  pointer.x=e.clientX;
  pointer.y=e.clientY;
  pointer.inside=true;
  pointer.type=e.pointerType||'mouse';
}
function onPointerDown(e){
  if(e.button!==undefined && e.button!==0 && e.pointerType==='mouse') return;
  e.preventDefault();
  Sound.init();
  updatePointer(e);
  pointer.down=true;
  const x=e.clientX,y=e.clientY;
  if(state===STATE.IDLE){
    if(isWaterPoint(x,y)) startCast(x,y);
    else showToast('물가 안쪽을 눌러 주세요');
  } else if(state===STATE.BITE){
    startFight();
  } else if(state===STATE.FIGHT){
    if(fight) fight.reeling=true;
  } else if(state===STATE.WAITING){
    if(elapsed-earlyClickAt>2.4){
      earlyClickAt=elapsed;
      showToast('아직 입질이 없어요 · 조금만 기다려 주세요');
    }
  } else if(state===STATE.CAUGHT){
    if(resultShown && stateTime>=CONFIG.result.dismissCaught) resetToIdle();
  } else if(state===STATE.LOST){
    if(resultShown && stateTime>=CONFIG.result.dismissLost) resetToIdle();
  }
}
function onPointerUp(){
  pointer.down=false;
  if(fight) fight.reeling=false;
}
function onPointerMove(e){
  updatePointer(e);
  if(e.pointerType) pointer.type=e.pointerType;
}
function onPointerLeave(){
  pointer.inside=false;
}
function initEvents(){
  canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
  window.addEventListener('pointerup',onPointerUp,{passive:true});
  window.addEventListener('pointercancel',onPointerUp,{passive:true});
  window.addEventListener('blur',onPointerUp);
  canvas.addEventListener('pointermove',onPointerMove,{passive:true});
  canvas.addEventListener('pointerleave',onPointerLeave,{passive:true});
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('resize',()=>{ clearTimeout(resize._timer); resize._timer=setTimeout(resize,120); });
  window.addEventListener('orientationchange',()=>setTimeout(resize,180));
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) onPointerUp();
    else lastFrame=performance.now();
  });
  dom.sound.addEventListener('click',e=>{
    e.stopPropagation();
    const muted=Sound.toggle();
    dom.sound.classList.toggle('muted',muted);
    dom.sound.setAttribute('aria-label',muted?'소리 켜기':'소리 끄기');
    dom.sound.title=muted?'소리 켜기':'소리 끄기';
    if(!Sound.ctx) showToast('이 브라우저에서는 소리를 재생할 수 없어요');
    else if(!muted) showToast('물가의 소리를 켰어요');
  });
  dom.dock.addEventListener('click',e=>{
    const btn=e.target.closest('[data-open]');
    if(!btn) return;
    e.stopPropagation();
    openSheet(btn.dataset.open);
  });
  dom.sheetClose.addEventListener('click',closeSheet);
  dom.sheetBody.addEventListener('click',onSheetClick);
  dom.overlay.addEventListener('click',e=>{
    if(e.target===dom.overlay) closeSheet();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape' && modalOpen) closeSheet();
  });
}
function render(t){
  const map=currentMap();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=map.scene==='deep'?'#030a12':'#08121b';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(camera.x,camera.y);
  if(bgCanvas) ctx.drawImage(bgCanvas,0,0,W,H);
  drawSky(t);
  drawWater(t);
  drawRipples();
  drawParticles();
  drawFishingLineAndBobber(t);
  if(fgCanvas) ctx.drawImage(fgCanvas,0,0,W,H);
  if(map.fire) drawCampfire(t);
  if(map.tent) drawLantern(t);
  if(map.grass) drawSwayingGrass(t);
  drawFireflies(t);
  drawRod(t);
  drawCatchFish(t);
  if(map.branch) drawForegroundBranch(t);
  drawReticle(t);
  ctx.restore();
}
function initEmbers(){
  embers=[];
  const f=layout.fire;
  for(let i=0;i<17;i++){
    embers.push({
      x:f.x+rand(-9,9)*f.scale, y:f.y-rand(2,17)*f.scale,
      life:rand(.3,1.6), speed:rand(10,27), phase:rand(0,TAU), size:rand(.6,1.6)
    });
  }
}
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));
  lastFrame=now;
  update(dt,now/1000);
  render(now/1000);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
resize();
if(currentMap().fire) initEmbers();
initEvents();
updateMetaUI();
document.body.dataset.state=STATE.IDLE;
syncStateUI();
requestAnimationFrame(frame);
