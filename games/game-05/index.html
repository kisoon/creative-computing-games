<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장미와 모란 · 궁중 뺨때리기</title>
<style>
  :root{
    --ink:#0b070d;
    --gold:#d9b76c;
    --gold2:#f3dfaa;
    --paper:#f4e7cf;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 50% 20%, #2a1522 0%, #130b13 55%, #08050a 100%);
    color:var(--paper);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;min-height:100dvh;overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:radial-gradient(rgba(255,225,180,.22) .7px, transparent .7px);
    background-size:22px 22px;
  }
  .stage{
    position:relative;
    width:min(96vw, calc(91dvh * 16 / 9));
    aspect-ratio:16/9;
    border-radius:14px;
    padding:5px;
    background:linear-gradient(145deg,#6b4d25,#24170d 30%,#8c6b36 50%,#1c120a 72%,#5b421f);
    box-shadow:0 30px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(255,230,170,.12), inset 0 0 0 1px rgba(0,0,0,.7);
  }
  .stage::after{
    content:"";position:absolute;inset:5px;border-radius:10px;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.8), inset 0 0 60px rgba(0,0,0,.5);
  }
  canvas{
    display:block;width:100%;height:100%;border-radius:10px;background:#140d15;
    touch-action:none;
  }
  footer{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:8px 18px;font-size:12.5px;letter-spacing:.01em;color:#b8a58e;
    padding:0 16px;text-align:center;
  }
  footer b{color:#efd9a9;font-weight:700}
  kbd{
    display:inline-block;min-width:52px;padding:4px 10px;margin-right:6px;
    border-radius:6px;border:1px solid #7d6338;border-bottom-width:3px;
    background:linear-gradient(#3a2b1a,#241b11);color:#f4e4c2;
    font:700 11px/1.2 "Apple SD Gothic Neo",system-ui,sans-serif;
    letter-spacing:.08em;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.5);
  }
  .note{color:#7f6f60}
  @media (max-width:700px){ footer{font-size:11px} .note{display:none} }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="1280" height="720" aria-label="장미와 모란 — 조선 궁궐 뺨때리기 타이밍 게임"></canvas>
  </div>
  <footer>
    <span><kbd>SPACE</kbd><b>뺨때리기 / 회피</b></span>
    <span><kbd>M</kbd>소리</span>
    <span><kbd>R</kbd>처음부터</span>
    <span class="note">마우스 없이, 오직 스페이스 바 하나로.</span>
  </footer>
<script>
(() => {
'use strict';

/* =========================================================
   기본 설정
   ========================================================= */
const cvs = document.querySelector('#game');
const ctx = cvs.getContext('2d');
const W = 1280, H = 720, TAU = Math.PI * 2;
const SANS  = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
const SERIF = '"AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif';

let state = 'title';      // title | story | attack | attackResult | defend | defendResult | stageClear | gameOver | gameClear
let stateT = 0;
let stageIndex = 0;
let time = 0;

/* ---------- 작은 도우미들 ---------- */
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const pick  = arr => arr[Math.floor(Math.random()*arr.length)];
const easeOut = t => 1 - Math.pow(1-clamp(t,0,1),3);
const easeInOut = t => { t=clamp(t,0,1); return t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; };

function el(x,y,rx,ry,color,rot=0){
  ctx.save(); ctx.translate(x,y); if(rot) ctx.rotate(rot);
  ctx.beginPath(); ctx.ellipse(0,0,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);
  ctx.fillStyle=color; ctx.fill(); ctx.restore();
}
function box(x,y,w,h,color){
  ctx.fillStyle=color; ctx.fillRect(x,y,w,h);
}
function rrPath(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function rr(x,y,w,h,r,fill,stroke,lw=1){
  rrPath(x,y,w,h,r);
  if(fill){ ctx.fillStyle=fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
}
function ln(x1,y1,x2,y2,color,w=1){
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round'; ctx.stroke();
}
function grad(x0,y0,x1,y1,stops){
  const g = ctx.createLinearGradient(x0,y0,x1,y1);
  for(const s of stops) g.addColorStop(s[0],s[1]);
  return g;
}
function radGrad(x,y,r0,r1,stops){
  const g = ctx.createRadialGradient(x,y,r0,x,y,r1);
  for(const s of stops) g.addColorStop(s[0],s[1]);
  return g;
}
function setFont(size, weight='700', serif=false){
  ctx.font = `${weight} ${size}px ${serif?SERIF:SANS}`;
}
function txt(str,x,y,{size=20,weight='700',color='#fff',align='left',baseline='alphabetic',serif=false,alpha=1,shadow=0,shadowColor='rgba(0,0,0,.6)'}={}){
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(size,weight,serif);
  ctx.textAlign=align; ctx.textBaseline=baseline;
  if(shadow){ ctx.shadowColor=shadowColor; ctx.shadowBlur=shadow; ctx.shadowOffsetY=Math.max(1,shadow/4); }
  ctx.fillStyle=color; ctx.fillText(str,x,y);
  ctx.restore();
}
function gradientTxt(str,x,y,size,colors,{weight='700',serif=true,align='center',baseline='middle',border=null}={}){
  setFont(size,weight,serif);
  ctx.textAlign=align; ctx.textBaseline=baseline;
  const w = ctx.measureText(str).width;
  const g = ctx.createLinearGradient(x-w/2,y-size*.6,x+w/2,y+size*.45);
  colors.forEach(s=>g.addColorStop(s[0],s[1]));
  if(border){ ctx.lineWidth=border; ctx.strokeStyle='rgba(20,10,5,.55)'; ctx.strokeText(str,x,y); }
  ctx.fillStyle=g; ctx.fillText(str,x,y);
}
function wrapText(text,maxW,size,weight='500',serif=false){
  setFont(size,weight,serif);
  const lines=[]; let cur='';
  for(const ch of Array.from(text)){
    const test = cur + ch;
    if(ctx.measureText(test).width > maxW && cur){
      lines.push(cur); cur = ch;
    } else cur = test;
  }
  if(cur) lines.push(cur);
  return lines;
}
function seal(x,y,s,label,rot=-.06){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  rr(-s/2,-s/2,s,s,s*.12,'#a52f35','#6d1a20',2);
  ctx.globalAlpha=.92;
  txt(label,0,1,{size:s*.36,weight:'800',color:'#f6e6cf',align:'center',baseline:'middle',serif:true});
  ctx.restore();
}

/* =========================================================
   사운드 — 외부 파일 없이 Web Audio로 합성
   ========================================================= */
const Sound = (() => {
  let ac=null, master=null, muted=false, noise=null;
  function ensure(){
    if(!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = .55;
      master.connect(ac.destination);
      const len = Math.floor(ac.sampleRate*.35);
      noise = ac.createBuffer(1,len,ac.sampleRate);
      const d = noise.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    if(ac.state==='suspended') ac.resume();
    return ac;
  }
  function env(node, t, peak, attack, decay){
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t+attack+decay);
    node.connect(g); g.connect(master);
    return g;
  }
  function slap(power=1,pitch=1){
    if(!ensure()||muted) return;
    const t=ac.currentTime;
    const src=ac.createBufferSource(); src.buffer=noise; src.playbackRate.value=pitch;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1100*power; bp.Q.value=.7;
    src.connect(bp); env(bp,t,.7*power,.004,.16); src.start(t); src.stop(t+.22);
    const o=ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(190*power,t); o.frequency.exponentialRampToValueAtTime(55,t+.13);
    env(o,t,.55*power,.004,.14); o.start(t); o.stop(t+.2);
  }
  function whoosh(){
    if(!ensure()||muted) return;
    const t=ac.currentTime;
    const src=ac.createBufferSource(); src.buffer=noise;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;
    bp.frequency.setValueAtTime(500,t); bp.frequency.exponentialRampToValueAtTime(2200,t+.2);
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.28,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+.26);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+.3);
  }
  function chime(high=true){
    if(!ensure()||muted) return;
    const t=ac.currentTime, base=high?880:660;
    [1,1.5].forEach((m,i)=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=base*m;
      const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16/(i+1),t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.55);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+.6);
    });
  }
  function gong(){
    if(!ensure()||muted) return;
    const t=ac.currentTime;
    [110,164,220,328].forEach((f,i)=>{
      const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=rand(-8,8);
      const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.2/(i*.6+1),t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+1.8+i*.3);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+2.4);
    });
    const src=ac.createBufferSource(); src.buffer=noise;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=ac.createGain(); g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    src.connect(lp); lp.connect(g); g.connect(master); src.start(t); src.stop(t+.9);
  }
  function pluck(freq=440,vol=.13){
    if(!ensure()||muted) return;
    const t=ac.currentTime;
    const o=ac.createOscillator(); o.type='triangle'; o.frequency.value=freq;
    const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+.52);
  }
  function startJingle(){
    [392,523.25,659.25,783.99].forEach((f,i)=>setTimeout(()=>pluck(f,.11),i*95));
  }
  function toggle(){ muted=!muted; if(master) master.gain.value = muted?0:.55; return muted; }
  return { slap,whoosh,chime,gong,pluck,startJingle,toggle,ensure,get muted(){return muted;} };
})();

/* =========================================================
   꽃잎
   ========================================================= */
const petals = [];
function makePetal(front=false, anywhere=false){
  const colors = front
    ? ['#f0b6c1','#e8a0ad','#f5d6c2','#e7c38f']
    : ['#d99aa7','#e9bfa8','#c98b99','#e3ca9c'];
  return {
    x:rand(-20,W+20), y: anywhere?rand(0,H):rand(-120,-20),
    s: front?rand(7,13):rand(4,9),
    vy: front?rand(30,58):rand(14,32),
    vx: rand(-16,16),
    rot: rand(0,TAU), vr: rand(-1.6,1.6),
    sway: rand(.8,2), phase: rand(0,TAU),
    color: pick(colors),
    alpha: front?rand(.55,.9):rand(.25,.6),
    front
  };
}
for(let i=0;i<26;i++) petals.push(makePetal(false,true));
for(let i=0;i<7;i++) petals.push(makePetal(true,true));

function updatePetals(dt,t){
  for(const p of petals){
    p.y += p.vy*dt;
    p.x += (p.vx + Math.sin(t*p.sway+p.phase)*18)*dt;
    p.rot += p.vr*dt;
    if(p.y>H+30 || p.x<-40 || p.x>W+40){
      Object.assign(p, makePetal(p.front));
    }
  }
}
function drawPetals(front,t){
  for(const p of petals){
    if(p.front!==front) continue;
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha=p.alpha;
    ctx.beginPath();
    ctx.moveTo(0,-p.s*.62);
    ctx.bezierCurveTo(p.s*.7,-p.s*.5,p.s*.62,p.s*.55,0,p.s*.62);
    ctx.bezierCurveTo(-p.s*.62,p.s*.55,-p.s*.7,-p.s*.5,0,-p.s*.62);
    ctx.fillStyle=p.color; ctx.fill();
    ctx.globalAlpha=p.alpha*.5;
    ctx.beginPath(); ctx.moveTo(0,-p.s*.5); ctx.quadraticCurveTo(p.s*.16,0,0,p.s*.5);
    ctx.strokeStyle='#8f5d66'; ctx.lineWidth=Math.max(.5,p.s*.06); ctx.stroke();
    ctx.restore();
  }
}

/* =========================================================
   배경 — 조선 궁궐의 낮
   ========================================================= */
function drawLatticeWindow(x,y,w,h,t){
  ctx.save();
  rr(x-12,y-12,w+24,h+24,10,'#f3dcc0','#c9a170',3);
  // 맑은 낮 하늘
  box(x,y,w,h,grad(x,y,x,y+h,[[0,'#cfeaf8'],[.52,'#e8f3e4'],[1,'#f8efd7']]));
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  // 햇살
  ctx.fillStyle=radGrad(x+w*.76,y+h*.2,4,w*.52,[[0,'rgba(255,244,190,.85)'],[1,'rgba(255,244,190,0)']]);
  ctx.fillRect(x,y,w,h*.8);
  // 구름
  const clouds=[[.2,.2,.95],[.62,.13,.7],[.86,.31,.52]];
  for(const [cx,cy,s] of clouds){
    const px=x+w*cx, py=y+h*cy;
    el(px,py,36*s,13*s,'rgba(255,255,255,.92)');
    el(px+25*s,py-7*s,24*s,11*s,'rgba(255,255,255,.92)');
    el(px-27*s,py+3*s,20*s,9*s,'rgba(255,255,255,.86)');
  }
  // 언덕
  ctx.fillStyle='#cfe6c5';
  ctx.beginPath();
  ctx.moveTo(x,y+h*.7);
  ctx.quadraticCurveTo(x+w*.28,y+h*.5,x+w*.58,y+h*.64);
  ctx.quadraticCurveTo(x+w*.82,y+h*.74,x+w,y+h*.6);
  ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#dcebd0';
  ctx.beginPath();
  ctx.moveTo(x,y+h*.82);
  ctx.quadraticCurveTo(x+w*.4,y+h*.72,x+w*.7,y+h*.82);
  ctx.quadraticCurveTo(x+w*.9,y+h*.88,x+w,y+h*.8);
  ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill();
  // 살구나무
  for(const [tx,ty,s] of [[.13,.63,.85],[.88,.68,.66]]){
    const px=x+w*tx, py=y+h*ty;
    ln(px,y+h*.98,px,py,'#bd9067',5*s);
    ln(px,py+10,px-18*s,py-6,'#bd9067',3*s);
    for(let i=0;i<8;i++){
      const a=i/8*TAU;
      el(px+Math.cos(a)*25*s,py-16+Math.sin(a)*15*s,15*s,11*s,i%2?'#f7c4cf':'#fbd6de');
    }
    el(px,py-18,12*s,9*s,'#f3aebd');
  }
  // 창살
  ctx.strokeStyle='#c9a170'; ctx.lineWidth=5;
  for(let i=1;i<5;i++){
    const lx=x+w*i/5;
    ctx.beginPath(); ctx.moveTo(lx,y); ctx.lineTo(lx,y+h); ctx.stroke();
  }
  for(let i=1;i<7;i++){
    const ly=y+h*i/7;
    ctx.beginPath(); ctx.moveTo(x,ly); ctx.lineTo(x+w,ly); ctx.stroke();
  }
  ctx.restore();
  // 창가 빛
  ctx.save(); ctx.globalAlpha=.28+.05*Math.sin(t*1.3);
  ctx.fillStyle=radGrad(x+w*.62,y+h*.5,0,w*.6,[[0,'rgba(255,250,220,.7)'],[1,'rgba(255,250,220,0)']]);
  ctx.fillRect(x,y,w,h);
  ctx.restore();
  ctx.restore();
}

function drawPeonyArt(cx,cy,s,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle='#d98fa2'; ctx.fillStyle='#e8a6b5'; ctx.lineWidth=2.2;
  // 가지
  ctx.beginPath(); ctx.moveTo(cx-s*1.15,cy+s*.9);
  ctx.bezierCurveTo(cx-s*.5,cy+s*.2,cx-s*.2,cy+s*.4,cx+s*.75,cy-s*.35); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*.45,cy+s*.25);
  ctx.bezierCurveTo(cx-s*.2,cy-s*.1,cx+s*.05,cy-s*.1,cx+s*.25,cy-s*.2); ctx.stroke();
  // 잎
  for(let i=0;i<4;i++){
    const lx=cx-s*.75+i*s*.42, ly=cy+s*.35-i*s*.16;
    ctx.beginPath(); ctx.ellipse(lx,ly,s*.14,s*.055,i*.5-.3,0,TAU); ctx.fill();
  }
  // 꽃
  const fx=[cx-s*.82,cy-s*.08,cx+s*.7], fy=[cy+s*.06,cy-s*.5,cy-s*.25];
  for(let k=0;k<3;k++){
    const fxx=fx[k], fyy=fy[k], R=s*(k===1?.34:.25);
    for(let i=0;i<7;i++){
      const a=i/7*TAU + k;
      ctx.beginPath(); ctx.ellipse(fxx+Math.cos(a)*R*.55,fyy+Math.sin(a)*R*.55,R*.56,R*.34,a,0,TAU);
      ctx.globalAlpha=alpha*.62; ctx.stroke();
    }
    ctx.globalAlpha=alpha; ctx.beginPath(); ctx.arc(fxx,fyy,R*.24,0,TAU); ctx.fill();
  }
  ctx.restore();
}
function drawPhoenixArt(cx,cy,s,alpha,t){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle='#5aa392'; ctx.fillStyle='#5aa392'; ctx.lineWidth=2.4;
  // 몸통
  ctx.beginPath();
  ctx.moveTo(cx-s*.9,cy+s*.5);
  ctx.bezierCurveTo(cx-s*.5,cy-s*.1,cx-s*.2,cy-s*.7,cx+s*.35,cy-s*.55);
  ctx.bezierCurveTo(cx+s*.7,cy-s*.45,cx+s*.45,cy-s*.02,cx+s*.15,cy+.08*s);
  ctx.stroke();
  // 머리
  ctx.beginPath(); ctx.arc(cx+s*.4,cy-s*.62,s*.13,0,TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+s*.52,cy-s*.65); ctx.lineTo(cx+s*.74,cy-s*.58); ctx.lineTo(cx+s*.55,cy-s*.55); ctx.stroke();
  // 꼬리깃
  for(let i=0;i<5;i++){
    ctx.beginPath();
    ctx.moveTo(cx-s*.55,cy+s*.28);
    ctx.bezierCurveTo(cx-s*.95-i*s*.09,cy+s*.1,cx-s*1.1-i*s*.08,cy+s*.75,cx-s*.5-i*s*.13,cy+s*.95);
    ctx.stroke();
  }
  // 날개
  ctx.beginPath();
  ctx.moveTo(cx-s*.05,cy-s*.18);
  ctx.quadraticCurveTo(cx-s*.45,cy-s*.55,cx-s*.68,cy-s*.15);
  ctx.quadraticCurveTo(cx-s*.35,cy-s*.02,cx-s*.05,cy-s*.18);
  ctx.stroke();
  // 해
  ctx.globalAlpha=alpha*.45; ctx.fillStyle='#f4c76f';
  ctx.beginPath(); ctx.arc(cx+s*.62,cy-s*.7,s*.2,0,TAU); ctx.fill();
  ctx.restore();
}
function drawDragonArt(cx,cy,s,alpha,t){
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle='#7d95c9'; ctx.fillStyle='#7d95c9'; ctx.lineWidth=2.6;
  // 구름
  for(let i=0;i<3;i++){
    const yy=cy+s*(.35+i*.22);
    ctx.beginPath(); ctx.arc(cx-s*.75+i*s*.2,yy,s*.13,Math.PI,0); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(cx+s*.8,cy-s*.12); ctx.quadraticCurveTo(cx+s*.98,cy+s*.05,cx+s*.84,cy+s*.16); ctx.stroke();
  // 발톱
  for(let i=0;i<2;i++){

/* ---------- 팔 ---------- */
function qPoint(sx,sy,cx,cy,ex,ey,t){
  const u=1-t;
  return {x:u*u*sx+2*u*t*cx+t*t*ex, y:u*u*sy+2*u*t*cy+t*t*ey};
}
function currentArm(pose){
  const a = ARM[pose.arm] || ARM.rest;
  if(!pose.armFrom) return a;
  const b = ARM[pose.armTo] || a;
  const m = pose.armMix==null?1:pose.armMix;
  return {
    cx:lerp(a.cx,b.cx,m), cy:lerp(a.cy,b.cy,m),
    hx:lerp(a.hx,b.hx,m), hy:lerp(a.hy,b.hy,m),
    w0:lerp(a.w0,b.w0,m), w1:lerp(a.w1,b.w1,m)
  };
}
function sleeveShape(sx,sy,cx,cy,ex,ey,w0,w1){
  const L=[],R=[];
  const N=14;
  for(let i=0;i<=N;i++){
    const t=i/N;
    const p=qPoint(sx,sy,cx,cy,ex,ey,t);
    const p2=qPoint(sx,sy,cx,cy,ex,ey,Math.min(1,t+.01));
    const dx=p2.x-p.x, dy=p2.y-p.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const w=lerp(w0,w1,t)/2;
    L.push({x:p.x+nx*w,y:p.y+ny*w});
    R.push({x:p.x-nx*w,y:p.y-ny*w});
  }
  return {L,R};
}
function drawSleeve(def,sx,sy,arm,scale=1,ghost=0){
  const sh=sleeveShape(sx,sy,arm.cx,arm.cy,arm.hx,arm.hy,arm.w0*scale,arm.w1*scale);
  ctx.save();
  ctx.globalAlpha *= (1-ghost*.6);
  ctx.beginPath();
  ctx.moveTo(sh.L[0].x,sh.L[0].y);
  for(let i=1;i<sh.L.length;i++) ctx.lineTo(sh.L[i].x,sh.L[i].y);
  for(let i=sh.R.length-1;i>=0;i--) ctx.lineTo(sh.R[i].x,sh.R[i].y);
  ctx.closePath();
  ctx.fillStyle = ghost ? def.robe3 : def.robe;
  ctx.fill();
  if(!ghost){
    ctx.strokeStyle='rgba(120,70,80,.22)'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
    // 소맷부리
    const p1=qPoint(sx,sy,arm.cx,arm.cy,arm.hx,arm.hy,.82);
    const p2=qPoint(sx,sy,arm.cx,arm.cy,arm.hx,arm.hy,.88);
    const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    ctx.save(); ctx.translate(p1.x,p1.y); ctx.rotate(ang);
    rr(-4,-arm.w1*scale*.58,8,arm.w1*scale*1.16,4,def.trim);
    ctx.restore();
  }
  ctx.restore();
  return qPoint(sx,sy,arm.cx,arm.cy,arm.hx,arm.hy,1);
}

  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);

function drawFace(def,pose,t){
  const hy=-452;
  const mood=pose.mood||'calm';
  const blink = !pose.forceOpen && ((t+def.seed)%4.3)<.1 && (mood==='calm'||mood==='determined'||mood==='smug');
  const ex1=-10, ex2=32, ey=hy-2;
  const ink=def.eye;

  // 볼터치
  ctx.save(); ctx.globalAlpha=mood==='hurt'?.6:.45;
  el(39,hy+19,12,7,'#f29aa8',-.16);
  el(-20,hy+21,9,5.6,'#f29aa8',.16);
  ctx.restore();

  // 눈썹
  ctx.save();
  ctx.strokeStyle=ink; ctx.lineCap='round';
  const tilt = mood==='angry'?7:mood==='hurt'?-6:mood==='determined'?4:mood==='smug'?-3:0;
  ctx.lineWidth=def.style==='king'?5:3.4;
  ctx.beginPath(); ctx.moveTo(ex1-12,ey-18-tilt*.5); ctx.quadraticCurveTo(ex1,ey-23-tilt,ex1+11,ey-17+tilt*.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex2-11,ey-17+tilt*.3); ctx.quadraticCurveTo(ex2,ey-23-tilt,ex2+12,ey-18-tilt*.5); ctx.stroke();
  ctx.restore();

  // 눈
  ctx.save();
  ctx.strokeStyle=ink; ctx.fillStyle=ink; ctx.lineCap='round'; ctx.lineJoin='round';
  if(mood==='hurt'){
    ctx.lineWidth=3.6;
    ctx.beginPath(); ctx.moveTo(ex1-9,ey-4); ctx.lineTo(ex1,ey+1); ctx.lineTo(ex1-9,ey+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2+9,ey-4); ctx.lineTo(ex2,ey+1); ctx.lineTo(ex2+9,ey+6); ctx.stroke();
    // 눈물 한 방울
    ctx.globalAlpha=.8; ctx.fillStyle='#9fd6ea';
    ctx.beginPath(); ctx.moveTo(ex2+13,ey+8); ctx.quadraticCurveTo(ex2+18,ey+18,ex2+13,ey+21); ctx.quadraticCurveTo(ex2+8,ey+18,ex2+13,ey+8); ctx.fill();
  } else if(mood==='happy'){
    ctx.lineWidth=3.6;
    ctx.beginPath(); ctx.arc(ex1,ey+2,8,Math.PI*1.12,Math.PI*1.88); ctx.stroke();
    ctx.beginPath(); ctx.arc(ex2,ey+2,8,Math.PI*1.12,Math.PI*1.88); ctx.stroke();
  } else if(mood==='shock'){
    for(const ex of [ex1,ex2]){
      el(ex,ey,9,10.5,'#fffdf7');
      el(ex+1,ey+.5,4.6,5.4,ink);
    }
  } else if(blink || mood==='smug'){
    ctx.lineWidth=3.2;
    ctx.beginPath(); ctx.moveTo(ex1-8,ey); ctx.quadraticCurveTo(ex1,ey+4,ex1+8,ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2-8,ey); ctx.quadraticCurveTo(ex2,ey+4,ex2+8,ey); ctx.stroke();
  } else {
    el(ex1,ey,6.2,7.6,ink);
    el(ex2,ey,6.2,7.6,ink);
    el(ex1+1.9,ey-2.2,1.6,1.9,'#fffdf7');
    el(ex2+1.9,ey-2.2,1.6,1.9,'#fffdf7');
  }
  ctx.restore();

  // 코
  ctx.save();
  ctx.strokeStyle='rgba(190,130,110,.55)'; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(43,hy+8,3,Math.PI*.1,Math.PI*.9); ctx.stroke();
  ctx.restore();

  // 입
  const mx=31,my=hy+30;
  ctx.save();
  ctx.strokeStyle=def.lips; ctx.fillStyle=def.lips; ctx.lineCap='round'; ctx.lineWidth=3;
  if(mood==='hurt'){
    ctx.beginPath();
    ctx.moveTo(mx-9,my+1); ctx.quadraticCurveTo(mx-4,my-3,mx,my+1);
    ctx.quadraticCurveTo(mx+5,my+5,mx+9,my); ctx.stroke();
  } else if(mood==='shock'){
    el(mx,my+1,5.6,8,'#a85360');
    el(mx,my-2,3,2.4,'rgba(255,245,235,.7)');
  } else if(mood==='angry'){
    ctx.beginPath();
    ctx.moveTo(mx-10,my+2); ctx.quadraticCurveTo(mx,my-6,mx+11,my+1);
    ctx.quadraticCurveTo(mx,my+5,mx-10,my+2); ctx.fill();
  } else if(mood==='smug'){
    ctx.beginPath(); ctx.moveTo(mx-9,my+2); ctx.quadraticCurveTo(mx,my+7,mx+10,my-2); ctx.stroke();
  } else if(mood==='happy'){
    ctx.beginPath();
    ctx.moveTo(mx-10,my-2); ctx.quadraticCurveTo(mx,my+10,mx+11,my-2);
    ctx.quadraticCurveTo(mx,my+3,mx-10,my-2); ctx.fill();
  } else if(mood==='determined'){
    ctx.beginPath(); ctx.moveTo(mx-8,my); ctx.quadraticCurveTo(mx,my+4,mx+9,my-1); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(mx-8,my-1); ctx.quadraticCurveTo(mx,my+6,mx+9,my-2); ctx.stroke();
  }
  ctx.restore();

  // 수염 (왕)
  if(def.style==='king'){
    ctx.save(); ctx.fillStyle='#4a3d3b';
    // 콧수염
    ctx.beginPath();
    ctx.moveTo(mx-14,my-3); ctx.quadraticCurveTo(mx-6,my-9,mx,my-3);
    ctx.quadraticCurveTo(mx+6,my-9,mx+14,my-3);
    ctx.quadraticCurveTo(mx+6,my+2,mx,my-1);
    ctx.quadraticCurveTo(mx-6,my+2,mx-14,my-3);
    ctx.fill();
    // 턱수염
    ctx.beginPath();
    ctx.moveTo(-6,hy+38); ctx.quadraticCurveTo(2,hy+70,30,hy+56);
    ctx.quadraticCurveTo(24,hy+44,10,hy+36); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 손자국
  if(pose.handprint>0){
    ctx.save();
    ctx.globalAlpha=pose.handprint*.7;
    ctx.translate(40,hy+12); ctx.rotate(-.25);
    ctx.fillStyle='#d95f74';
    ctx.beginPath(); ctx.ellipse(0,0,11,13,0,0,TAU); ctx.fill();
    for(let i=0;i<4;i++) el(10,-9+i*6.5,7,2.7,'#d95f74',-.1);
    el(-8,9,6,3,'#d95f74',.5);
    ctx.restore();
  }
}

function drawCharacter(def,opt){
  const {x,mirror=false,t,pose,motes=true}=opt;
  ctx.save();
  ctx.translate(x,720);
  if(mirror) ctx.scale(-1,1);
  ctx.translate(pose.shiftX||0,0);
  ctx.rotate(pose.lean||0);
  const s=pose.scale||1;
  if(s!==1) ctx.scale(s,s);
  ctx.translate(0, Math.sin(t*1.5+def.seed)*2.2 + (pose.bob||0));

  drawHairBack(def,pose,t);
  drawLowerBody(def,pose);
  drawArmFar(def,pose);
  drawTorso(def,pose);
  // 앞땋은머리
  if(def.style==='maid') drawBraids(def,t);
  // 머리 회전
  ctx.save();
  ctx.translate(pose.headX||0,0);
  ctx.translate(0,-380);
  ctx.rotate(pose.headRot||0);
  ctx.translate(0,380);
  drawHead(def,pose,t);
  ctx.restore();
  drawArmNear(def,pose,t);
  ctx.restore();
}

/* ---------- 타격 이펙트 ---------- */
function drawStarburst(x,y,t,size,color='#fff4ce'){
  ctx.save(); ctx.translate(x,y); ctx.globalAlpha=Math.max(0,1-t*2.4);
  const R=size*(.7+t*2.8);
  ctx.rotate(t*3.1);
  ctx.beginPath();
  for(let i=0;i<16;i++){
    const a=i/16*TAU, r=i%2?R*.42:R;
    const px=Math.cos(a)*r, py=Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fillStyle=color; ctx.fill();
  ctx.globalAlpha*=.5; ctx.beginPath(); ctx.arc(0,0,R*.18,0,TAU); ctx.fillStyle='#fff'; ctx.fill();
  ctx.globalAlpha=Math.max(0,1-t*1.9);
  ctx.beginPath(); ctx.arc(0,0,R*.55,0,TAU); ctx.strokeStyle=color; ctx.lineWidth=4; ctx.stroke();
  ctx.restore();
}
function drawHandPrintFX(x,y,t){

  for(let i=0;i<4;i++) el(19,-17+i*12,12,5,'rgba(205,60,80,.7)');

}
function drawWhoosh(x,y,dir,t,scale=1){
  ctx.save(); ctx.translate(x,y); ctx.scale(dir,1); ctx.globalAlpha=Math.max(0,1-t*1.6);
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.arc(0,0,60+i*22+ t*80, -1.1+i*.17, .35+i*.13);
    ctx.strokeStyle=i%2?'rgba(255,245,215,.8)':'rgba(230,200,140,.5)';
    ctx.lineWidth=(4-i*.7)*scale; ctx.lineCap='round'; ctx.stroke();
  }
  ctx.restore();
}
function drawDamage(x,y,amount,t,color='#ffe6a8'){
  ctx.save(); ctx.globalAlpha=Math.max(0,1-t*.9);
  const yy=y-70*t-18;

  ctx.restore();
}

  attack:['이 한 대는 억울해서다!','서열을 바꾸자!','받아라!'],
  perfect:['철썩!','이 맛이야!','한 대 더?'],
  hurt:['아야!','억울합니다…!','으읏…']
};

/* =========================================================
   게임 상태
   ========================================================= */
let playerMax = 120, playerHP = 120;
let playerHPshow = 120, playerGhost = 120;
let oppMax = 84, oppHP = 84, oppHPshow = 84, oppGhost = 84;
let exchange = 1, combo = 0, maxCombo = 0, counterBuff = false;
let stats = { perfect:0, hit:0, miss:0, dodge:0, block:0, taken:0 };
let gauge = { pos:0, dir:1, speed:1, last:0, active:false, pressPos:0 };
let resultInfo = null;
let feedback = { text:'', color:'#cbb28c', t:0 };
let bubble = null;
let toast = { text:'', t:0 };
let shake = 0, flash = 0;
let playerPose = neutralPose(), oppPose = neutralPose();

function neutralPose(){
  return { arm:'rest', mood:'calm', headRot:0, headX:0, shiftX:0, lean:0,
           handprint:0, armFrom:null, armTo:null, armMix:1, forceOpen:false, bob:0 };
}
function resetPoses(){ playerPose=neutralPose(); oppPose=neutralPose(); }

function stageNow(){ return STAGES[stageIndex]; }
function isPlayState(){ return state==='attack'||state==='defend'||state==='attackResult'||state==='defendResult'; }
function say(who,text,life=2.2){ bubble={who,text,t:0,life}; }
function setFeedback(text,color){ feedback={text,color,t:0}; }

function resetGame(){
  stageIndex=0; playerMax=120; playerHP=120; playerHPshow=120; playerGhost=120;
  combo=0; maxCombo=0; counterBuff=false; exchange=1;
  stats={perfect:0,hit:0,miss:0,dodge:0,block:0,taken:0};
  resultInfo=null; bubble=null; shake=0; flash=0; resetPoses();
  enterStage(0);
}
function enterStage(i){
  stageIndex=i;
  const st=STAGES[i];
  oppMax=st.hp; oppHP=st.hp; oppHPshow=st.hp; oppGhost=st.hp;
  combo=0; counterBuff=false; exchange=1;
  resultInfo=null; bubble=null; gauge.active=false;
  if(i>0) playerHP=Math.min(playerMax, playerHP+28);
  playerHPshow=playerHP; playerGhost=playerHP;
  state='story'; stateT=0;
  setFeedback('','#cbb28c');
  resetPoses();
  Sound.pluck(392,.08);
}
function startGame(){
  Sound.ensure();
  resetGame();
  Sound.startJingle();
}
function beginAttack(){
  const st=stageNow();
  state='attack'; stateT=0;
  startGauge(st.speed + Math.min(.4,(exchange-1)*.045));
  setFeedback('중앙의 금빛을 노려라','#cbb28c');
  if(Math.random()<.22) say('player',pick(PLAYER_LINES.attack));
}
function beginDefend(){
  const st=stageNow();
  state='defend'; stateT=0;
  startGauge(st.defSpeed + Math.min(.4,(exchange-1)*.04));
  setFeedback('중앙에서 막아라!','#b9d8c8');
  if(Math.random()<.42) say('opp',pick(st.taunts.attack));
}
function winStage(){
  const st=stageNow();
  setFeedback('','#fff');
  if(stageIndex>=2){
    state='gameClear'; stateT=0;
  } else {
    state='stageClear'; stateT=0;
  }
  Sound.gong();
}
function loseGame(){
  state='gameOver'; stateT=0;
  Sound.gong();
}

/* ---------- 타이밍 게이지 ---------- */
function startGauge(speed){
  let p=rand(-.74,.74);
  if(Math.abs(p)<.3) p = p<0?-.4:.4;
  gauge.pos=p; gauge.dir=Math.random()<.5?-1:1;
  gauge.speed=speed; gauge.last=performance.now(); gauge.active=true; gauge.pressPos=p;
}
function syncGauge(now){
  if(!gauge.active) return;
  let dt=Math.min(.06, Math.max(0,(now-gauge.last)/1000));
  gauge.last=now;
  gauge.pos += gauge.dir*gauge.speed*dt;
  let guard=0;
  while((gauge.pos>1||gauge.pos<-1) && guard++<5){
    if(gauge.pos>1){ gauge.pos=2-gauge.pos; gauge.dir=-1; }
    if(gauge.pos<-1){ gauge.pos=-2-gauge.pos; gauge.dir=1; }
  }
  gauge.pos=clamp(gauge.pos,-1,1);
}
function evalPress(){
  syncGauge(performance.now());
  const st=stageNow();
  const d=Math.abs(gauge.pos);
  const pZone=.066*st.zone, gZone=.19*st.zone;
  gauge.pressPos=gauge.pos;
  return d<=pZone ? 'perfect' : d<=gZone ? 'good' : 'miss';
}

/* ---------- 공격 판정 ---------- */
function resolveAttack(){
  const st=stageNow();
  const kind=evalPress();
  gauge.active=false;
  state='attackResult'; stateT=0;
  const buff=counterBuff?9:0;
  counterBuff=false;
  let dmg=0;
  if(kind==='perfect'){
    dmg=Math.round(26 + Math.min(16,combo*4) + buff);
    combo++; maxCombo=Math.max(maxCombo,combo); stats.perfect++;
    setFeedback('PERFECT! 철썩—!','#f4d98a');
    shake=16; flash=.28;
    Sound.slap(1.35,1.06); Sound.chime(true);
    if(Math.random()<.55) say('opp',pick(st.taunts.hit));
    else if(Math.random()<.3) say('player',pick(PLAYER_LINES.perfect));
  } else if(kind==='good'){
    dmg=Math.round(13 + Math.floor(combo*.8) + buff);
    combo=0; stats.hit++;
    setFeedback('적중! 짝!','#a9d8b8');
    shake=8; flash=.1;
    Sound.slap(.9,.95);
    if(Math.random()<.3) say('opp',pick(st.taunts.hit));
  } else {
    combo=0; stats.miss++;
    setFeedback('빗나갔다…!','#d98a8a');
    Sound.whoosh();
    if(Math.random()<.3) say('opp',pick(st.taunts.dodge));
  }
  if(dmg>0){
    oppHP=Math.max(0,oppHP-dmg);
    stats.dealt=(stats.dealt||0)+dmg;
    shake=Math.max(shake,kind==='perfect'?16:8);
  }
  resultInfo={kind,dmg,by:'player'};
}
/* ---------- 수비 판정 ---------- */
function resolveDefend(){
  const st=stageNow();
  const kind=evalPress();
  gauge.active=false;
  state='defendResult'; stateT=0;
  if(kind==='perfect'){
    counterBuff=true; stats.dodge++;
    setFeedback('완벽한 회피! 반격 기회!','#8fe0c0');
    shake=3;
    Sound.whoosh(); Sound.chime(true);
    resultInfo={kind:'dodge',dmg:0,by:'opp'};
    if(Math.random()<.5) say('player','휙—!');
  } else if(kind==='good'){
    const dmg=5;
    playerHP=Math.max(0,playerHP-dmg); stats.block++; stats.taken+=dmg;
    setFeedback('막았다! 퍽!','#b9d8c8');
    shake=5;
    Sound.slap(.5,.8);
    resultInfo={kind:'block',dmg,by:'opp'};
  } else {
    const dmg=Math.round(rand(st.dmg[0],st.dmg[1]));
    playerHP=Math.max(0,playerHP-dmg); stats.taken+=dmg;
    setFeedback('얻어맞았다! 철썩!','#f09a9a');
    shake=15; flash=.32;
    Sound.slap(1.15,.88);
    resultInfo={kind:'hit',dmg,by:'opp'};
    if(Math.random()<.45) say('player',pick(PLAYER_LINES.hurt));
  }
}

/* ---------- 포즈 ---------- */
function hitEnv(T,delay){
  if(T<delay) return 0;
  const q=T-delay;
  if(q<.05) return q/.05;
  return 1-easeInOut(clamp((q-.12)/.66,0,1));
}
function dodgeEnv(T,delay){
  if(T<delay) return 0;
  const q=T-delay;
  if(q<.08) return q/.08;
  return 1-easeInOut(clamp((q-.1)/.55,0,1));
}
function updatePoses(){
  const T=stateT, st=stageNow();
  const p=neutralPose(), o=neutralPose();

  if(state==='story'){
    p.mood='determined';
    o.mood=stageIndex===1?'smug':stageIndex===2?'angry':'smug';
    o.lean=.01;
  } else if(state==='attack'){
    p.arm='cock'; p.mood='determined';
    p.shiftX=Math.sin(time*26)*.9;
    o.mood=stageIndex===1?'smug':stageIndex===2?'angry':'smug';
  } else if(state==='attackResult'){
    const res=resultInfo;
    if(T<.14){ p.armFrom='cock'; p.armTo='slap'; p.armMix=easeOut(T/.14); }
    else if(T<.55){ p.arm='slap'; }
    else { p.armFrom='slap'; p.armTo='rest'; p.armMix=easeOut((T-.55)/.55); }
    p.mood=T<.6?'determined':'calm';
    if(res && res.dmg>0){
      const e=hitEnv(T,.14);
      o.headRot=-.3*e; o.headX=-15*e; o.lean=-.045*e; o.shiftX=-20*e;
      o.mood=e>.22?'hurt':'shock';
      o.handprint=e;
      p.lean=.035*easeOut(T/.14);
      if(T>.7) p.lean*=Math.max(0,1-(T-.7)/.4);
    } else {
      o.mood='smug'; p.mood='worried'; p.lean=.02;
    }
  } else if(state==='defend'){
    p.arm='guard'; p.mood='worried';
    o.arm='cock'; o.mood='angry';
    o.shiftX=Math.sin(time*24)*1.1; o.lean=.02;
  } else if(state==='defendResult'){
    const res=resultInfo;
    if(T<.14){ o.armFrom='cock'; o.armTo='slap'; o.armMix=easeOut(T/.14); }
    else if(T<.55){ o.arm='slap'; }
    else { o.armFrom='slap'; o.armTo='rest'; o.armMix=easeOut((T-.55)/.55); }
    if(res && res.kind==='hit'){
      const e=hitEnv(T,.14);
      p.headRot=-.31*e; p.headX=-16*e; p.lean=-.055*e; p.shiftX=-22*e;
      p.mood=e>.22?'hurt':'shock'; p.handprint=e;
      o.mood='smug';
    } else if(res && res.kind==='block'){
      const e=dodgeEnv(T,.12);
      p.arm='guard'; p.lean=-.022*e; p.shiftX=-7*e; p.mood='calm';
      o.mood='angry';
    } else if(res && res.kind==='dodge'){
      const e=dodgeEnv(T,.08);
      p.lean=-.07*e; p.shiftX=-32*e; p.headRot=.1*e; p.mood='smug';
      o.mood='shock'; o.shiftX=10*e;
    }
  } else if(state==='stageClear'){
    p.mood='happy'; o.mood='hurt'; o.handprint=1; o.headRot=-.16; o.lean=-.02;
  } else if(state==='gameOver'){
    p.mood='hurt'; p.handprint=1; p.headRot=-.2; p.lean=-.05;
    o.mood='smug';
  } else if(state==='gameClear'){
    p.mood='happy';
    o.mood='hurt'; o.handprint=1; o.headRot=-.15;
  }
  playerPose=p; oppPose=o;
}

/* ---------- 업데이트 ---------- */
function update(dt){
  time+=dt; stateT+=dt;
  if(gauge.active) syncGauge(performance.now());
  updatePetals(dt,time);
  updatePoses();

  playerHPshow += (playerHP-playerHPshow)*Math.min(1,dt*8);
  playerGhost += (playerHP-playerGhost)*Math.min(1,dt*2.2);
  oppHPshow += (oppHP-oppHPshow)*Math.min(1,dt*8);
  oppGhost += (oppHP-oppGhost)*Math.min(1,dt*2.2);

  feedback.t+=dt;
  if(bubble){ bubble.t+=dt; if(bubble.t>bubble.life) bubble=null; }
  if(toast.t>0) toast.t-=dt;
  shake=Math.max(0,shake-dt*52);
  flash=Math.max(0,flash-dt*2.4);

  if(state==='attackResult' && stateT>1.32){
    if(oppHP<=0) winStage();
    else beginDefend();
  } else if(state==='defendResult' && stateT>1.4){
    if(playerHP<=0) loseGame();
    else { exchange++; beginAttack(); }
  }
  if(oppHP<=0 && state==='defend'){ oppHP=0; }
  if(playerHP<=0 && state==='attack'){ playerHP=0; }
}

function drawFlower(x,y,r,color,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha;
  for(let i=0;i<5;i++){
    const a=i/5*TAU - Math.PI/2;
    el(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.48,r*.32,color,a);
  }
  el(x,y,r*.24,'#f6e6b4');
  ctx.restore();
}
function hpBar(x,y,w,h,ratio,ghost,flip,c1,c2){
  ratio=clamp(ratio,0,1); ghost=clamp(ghost,0,1);
  rr(x,y,w,h,h/2,'rgba(8,5,8,.85)','rgba(230,200,140,.24)',1);
  ctx.save(); rrPath(x,y,w,h,h/2); ctx.clip();
  const gw=w*ghost, fw=w*ratio;
  const gcol='rgba(255,210,140,.32)';
  if(flip){
    if(gw>0) box(x+w-gw,y,gw,h,gcol);
    if(fw>0){
      const g=grad(x+w-fw,y,x+w,y,[[0,c1],[1,c2]]);
      box(x+w-fw,y,fw,h,g);
      box(x+w-fw,y,fw*.4,0,'rgba(255,255,255,.14)');
    }
  } else {
    if(gw>0) box(x,y,gw,h,gcol);
    if(fw>0){
      const g=grad(x,y,x+fw,y,[[0,c1],[1,c2]]);
      box(x,y,fw,h,g);
      box(x,y,fw,h*.38,'rgba(255,255,255,.14)');
    }
  }
  // 눈금
  ctx.globalAlpha=.15;
  for(let i=1;i<10;i++){
    const nx=x+w*i/10;
    ln(nx,y,nx,y+h,'#150c11',1);
  }
  ctx.restore();
}

function drawBubble(){
  if(!bubble) return;
  const a=clamp(Math.min(bubble.t*9,(bubble.life-bubble.t)*5),0,1);
  const isP=bubble.who==='player';
  const cx=isP?446:834;
  setFont(15,'700');
  const tw=Math.min(330,ctx.measureText(bubble.text).width+40);
  const bw=tw, bh=46, bx=cx-bw/2, by=96;
  ctx.save(); ctx.globalAlpha=a;
  ctx.beginPath();
  ctx.moveTo(cx-10,by+bh-2);

/* =========================================================
   타격 연출
   ========================================================= */
function drawImpactWord(text,x,y,t,color){
  if(t<0) return;
  const k=clamp(t/.1,0,1);
  const scale=1+(1-k)*.75;
  ctx.save();
  ctx.translate(x,y); ctx.rotate(-.1); ctx.scale(scale,scale);
  ctx.globalAlpha=clamp(1-t*1.15,0,1);
  txt(text,0,0,{size:48,weight:'800',color,align:'center',baseline:'middle',serif:true,shadow:12,shadowColor:'rgba(40,10,15,.5)'});
  ctx.restore();
}
function drawFX(){
  if(state==='attackResult' && resultInfo){
    const cx=768, cy=282;
    if(resultInfo.dmg>0 && stateT>.14){
      const t=stateT-.14;
      drawStarburst(cx,cy,t,resultInfo.kind==='perfect'?78:54);
      if(resultInfo.kind==='perfect'){
        ctx.save(); ctx.globalAlpha=Math.max(0,1-t*1.3);
        for(let i=0;i<10;i++){
          const a=i/10*TAU+time*.5, r=40+t*160;
          el(cx+Math.cos(a)*r,cy+Math.sin(a)*r,3.2,1.6,'#f5d98d',a);
        }
        ctx.restore();
      }
      drawImpactWord(resultInfo.kind==='perfect'?'철썩!':'짝!',cx+(resultInfo.kind==='perfect'?2:-2),cy-72,t,resultInfo.kind==='perfect'?'#ffe9a8':'#f7e7c7');
      drawDamage(cx,cy-74,resultInfo.dmg,t,resultInfo.kind==='perfect'?'#ffe6a0':'#f4dcc0');
    } else if(resultInfo.kind==='miss' && stateT>.1){
      drawWhoosh(786,282,-1,Math.max(0,stateT-.1),.85);
    }
  }
  if(state==='defendResult' && resultInfo){
    const cx=512, cy=282;
    if(resultInfo.kind==='hit' && stateT>.14){
      const t=stateT-.14;
      drawStarburst(cx,cy,t,62);
      drawImpactWord('철썩!',cx,cy-72,t,'#ffd2c7');
      drawDamage(cx,cy-74,resultInfo.dmg,t,'#ffb8ae');
    } else if(resultInfo.kind==='block' && stateT>.12){
      const t=stateT-.12;
      drawStarburst(cx+16,cy-4,t,34,'#d8ecdd');
      drawImpactWord('퍽!',cx+10,cy-64,t,'#d9f0e2');
      drawDamage(cx,cy-70,resultInfo.dmg,t,'#d8f1e6');
    } else if(resultInfo.kind==='dodge' && stateT>.08){
      drawWhoosh(548,286,-1,Math.max(0,stateT-.08),1);
      drawImpactWord('휙—',556,262,Math.max(0,stateT-.08),'#d7f1e7');
    }
  }
}

/* =========================================================
   렌더
   ========================================================= */
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>.4){
    const s=shake*.55;
    ctx.translate(rand(-s,s),rand(-s,s));
  }
  drawBackground(time);
  if(state!=='title'){
    const st=stageNow();
    drawCharacter(DEFS.player,{x:470,t:time,pose:playerPose});
    drawCharacter(DEFS[st.key],{x:810,t:time,pose:oppPose,mirror:true});
  }
  drawPetals(true,time);
  drawFX();
  ctx.restore();

  if(isPlayState()){
    drawHUD();
    drawGaugePanel();
    drawBubble();
  }

  if(state==='title') drawTitle();
  else if(state==='story') drawStory();
  else if(state==='stageClear') drawStageClear();
  else if(state==='gameOver') drawGameOver();
  else if(state==='gameClear') drawGameClear();

  drawToast();
  if(flash>0){
    ctx.fillStyle=`rgba(255,248,235,${clamp(flash,0,1)*.55})`;
    ctx.fillRect(0,0,W,H);
  }
}

/* =========================================================
   입력 & 루프
   ========================================================= */
function onSpace(){
  Sound.ensure();
  if(state==='title'){ startGame(); return; }
  if(state==='story'){ Sound.pluck(523.25,.1); beginAttack(); return; }
  if(state==='attack'){ if(stateT>.16) resolveAttack(); return; }
  if(state==='defend'){ if(stateT>.16) resolveDefend(); return; }
  if(state==='stageClear'){
    if(stageIndex+1<STAGES.length) enterStage(stageIndex+1);
    else { state='gameClear'; stateT=0; }
    return;
  }
  if(state==='gameOver'||state==='gameClear'){ startGame(); return; }
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(e.repeat) return;
    onSpace();
  } else if(e.code==='KeyM'){
    e.preventDefault();
    const muted=Sound.toggle();
    toast={text:muted?'소리 꺼짐':'소리 켜짐',t:1.4};
  } else if(e.code==='KeyR'){
    e.preventDefault();
    if(state!=='title'){
      startGame();
      toast={text:'처음부터 다시',t:1.4};
    }
  }
},{passive:false});

let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));
  lastT=now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* 개발 확인용 (게임에는 영향 없음) */
window.__ROSE = {
  get snapshot(){
    return {
      state, stateT, stage:stageIndex, exchange, combo, maxCombo,
      playerHP, oppHP, playerMax, oppMax, stats:{...stats},
      gauge:{pos:gauge.pos, speed:gauge.speed, active:gauge.active},
      feedback:{...feedback}, result:resultInfo ? {...resultInfo} : null,
      pose:{player:playerPose.arm, opp:oppPose.arm}
    };
  },
  press:onSpace,
  step(dt=.016){ update(Math.max(.001,Math.min(.05,dt))); render(); },
  setGaugePos(p){ gauge.pos=clamp(p,-1,1); gauge.last=performance.now(); },
  setHP(p,o){ playerHP=p; playerHPshow=p; if(o!=null){ oppHP=o; oppHPshow=o; } }
};

})();
